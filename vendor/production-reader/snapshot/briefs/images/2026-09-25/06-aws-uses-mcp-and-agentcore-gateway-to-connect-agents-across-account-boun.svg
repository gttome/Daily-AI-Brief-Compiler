<svg role="img" aria-label="Cross-account agent architecture: central orchestration, AgentCore Gateway controls, local MCP servers, and audit" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#ffffff"/><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
<style>.k{font:700 14px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:1.2px}.h{font:700 29px Inter,Arial,sans-serif;fill:#0f172a}.s{font:400 15px Inter,Arial,sans-serif;fill:#475569}.t{font:700 15px Inter,Arial,sans-serif;fill:#0f172a}.b{font:400 12px Inter,Arial,sans-serif;fill:#475569}.m{font:700 12px Inter,Arial,sans-serif;fill:#334155}.tiny{font:400 10px Inter,Arial,sans-serif;fill:#64748b}</style></defs><text x="44" y="34" class="k">AWS AGENTCORE + MCP</text><text x="44" y="69" class="h">Governed cross-account agent access</text><text x="44" y="94" class="s">A trust-boundary architecture: central orchestration, gateway enforcement, and account-local MCP servers keep authorization and data ownership explicit.</text><g filter="url(#shadow)"><rect x="44" y="138" width="1112" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1"/></g><text x="66" y="164" class="m">CROSS-ACCOUNT TRUST BOUNDARIES</text>
<g transform="translate(68,205)"><rect x="0" y="0" width="200" height="286" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="20" y="28" class="m">ORCHESTRATION ACCOUNT</text><circle cx="100" cy="100" r="52" fill="#fff" stroke="#6366f1" stroke-width="3"/><text x="72" y="105" class="t">AGENT</text><rect x="20" y="178" width="160" height="74" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="34" y="201" class="m">Responsibilities</text><text x="34" y="222" class="b">plan · query · synthesize</text><text x="34" y="240" class="b">no direct data ownership</text></g><line x1="270" y1="348" x2="350" y2="348" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(360,188)"><rect x="0" y="0" width="300" height="320" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="22" y="30" class="m">AGENTCORE GATEWAY</text><rect x="22" y="52" width="256" height="48" rx="10" fill="#fff" stroke="#fed7aa"/><text x="38" y="75" class="t">1 · Authenticate principal</text><text x="38" y="91" class="tiny">identity + assumed role</text><rect x="22" y="112" width="256" height="48" rx="10" fill="#fff" stroke="#fed7aa"/><text x="38" y="135" class="t">2 · Authorize scope</text><text x="38" y="151" class="tiny">policy + account + tool permissions</text><rect x="22" y="172" width="256" height="48" rx="10" fill="#fff" stroke="#fed7aa"/><text x="38" y="195" class="t">3 · Route MCP request</text><text x="38" y="211" class="tiny">approved server only</text><rect x="22" y="232" width="256" height="48" rx="10" fill="#fff" stroke="#fed7aa"/><text x="38" y="255" class="t">4 · Audit exchange</text><text x="38" y="271" class="tiny">request · action · response · principal</text></g>
<g transform="translate(735,188)"><rect x="0" y="0" width="395" height="92" rx="14" fill="#eff6ff" stroke="#3b82f6"/><text x="18" y="24" class="m">ACCOUNT A · FINANCE</text><rect x="18" y="38" width="150" height="36" rx="8" fill="#fff" stroke="#60a5fa"/><text x="36" y="61" class="m">Finance MCP server</text><rect x="190" y="38" width="180" height="36" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="208" y="61" class="b">account-local finance data</text><rect x="0" y="114" width="395" height="92" rx="14" fill="#eff6ff" stroke="#3b82f6"/><text x="18" y="138" class="m">ACCOUNT B · OPERATIONS</text><rect x="18" y="152" width="150" height="36" rx="8" fill="#fff" stroke="#60a5fa"/><text x="36" y="175" class="m">Ops MCP server</text><rect x="190" y="152" width="180" height="36" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="208" y="175" class="b">account-local operations data</text><rect x="0" y="228" width="395" height="92" rx="14" fill="#eff6ff" stroke="#3b82f6"/><text x="18" y="252" class="m">ACCOUNT C · RESEARCH</text><rect x="18" y="266" width="150" height="36" rx="8" fill="#fff" stroke="#60a5fa"/><text x="36" y="289" class="m">Research MCP server</text><rect x="190" y="266" width="180" height="36" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="208" y="289" class="b">account-local knowledge base</text></g><line x1="662" y1="268" x2="732" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="662" y1="348" x2="732" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="662" y1="428" x2="732" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="44" y1="590" x2="1156" y2="590" stroke="#e2e8f0" stroke-width="2"/><text x="44" y="611" class="tiny">Boundary model: orchestration is separated from data ownership; every MCP call is authenticated, authorized, routed, and audited.</text></svg>