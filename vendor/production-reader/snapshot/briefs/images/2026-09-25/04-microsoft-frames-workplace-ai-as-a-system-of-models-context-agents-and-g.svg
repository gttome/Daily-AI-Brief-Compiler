<svg role="img" aria-label="Enterprise AI system: organizational context, models, agents, workflow, governance, measurement, and outcomes" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#ffffff"/><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
<style>.k{font:700 14px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:1.2px}.h{font:700 29px Inter,Arial,sans-serif;fill:#0f172a}.s{font:400 15px Inter,Arial,sans-serif;fill:#475569}.t{font:700 15px Inter,Arial,sans-serif;fill:#0f172a}.b{font:400 12px Inter,Arial,sans-serif;fill:#475569}.m{font:700 12px Inter,Arial,sans-serif;fill:#334155}.tiny{font:400 10px Inter,Arial,sans-serif;fill:#64748b}</style></defs><text x="44" y="34" class="k">AI AT WORK</text><text x="44" y="69" class="h">An operating system for enterprise AI</text><text x="44" y="94" class="s">Models are only one layer; durable value comes from context, agents, workflow, governance, and measurement operating as a closed system.</text><g filter="url(#shadow)"><rect x="44" y="138" width="1112" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1"/></g><text x="66" y="164" class="m">ENTERPRISE AI OPERATING SYSTEM</text>
<g transform="translate(335,186)"><circle cx="250" cy="168" r="140" fill="#fff" stroke="#94a3b8" stroke-width="2"/><circle cx="250" cy="168" r="102" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><circle cx="250" cy="168" r="62" fill="#0f172a"/><text x="214" y="160" style="font:700 13px Inter,Arial;fill:#cbd5e1">WORK</text><text x="194" y="186" style="font:700 22px Inter,Arial;fill:#fff">OUTCOME</text><text x="202" y="208" style="font:400 10px Inter,Arial;fill:#cbd5e1">quality · time · cost</text><path d="M250 28 A140 140 0 0 1 378 110" fill="none" stroke="#3b82f6" stroke-width="7"/><path d="M388 138 A140 140 0 0 1 328 290" fill="none" stroke="#8b5cf6" stroke-width="7"/><path d="M298 302 A140 140 0 0 1 155 285" fill="none" stroke="#10b981" stroke-width="7"/><path d="M132 260 A140 140 0 0 1 120 115" fill="none" stroke="#f59e0b" stroke-width="7"/><path d="M135 88 A140 140 0 0 1 220 30" fill="none" stroke="#0ea5e9" stroke-width="7"/></g>
<g transform="translate(66,200)"><rect x="0" y="0" width="235" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="26" class="t">Organizational context</text><text x="18" y="49" class="b">people · files · knowledge</text><text x="18" y="69" class="b">permissions · current state</text><line x1="235" y1="48" x2="320" y2="118" stroke="#0ea5e9" stroke-width="3" marker-end="url(#arrow)"/><rect x="0" y="126" width="235" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="152" class="t">Models</text><text x="18" y="175" class="b">reasoning · generation</text><text x="18" y="195" class="b">routing by task / cost / risk</text><line x1="235" y1="172" x2="320" y2="172" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/><rect x="0" y="252" width="235" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="278" class="t">Measurement</text><text x="18" y="301" class="b">quality · adoption · cycle time</text><text x="18" y="321" class="b">business outcome + learning loop</text><line x1="235" y1="298" x2="330" y2="228" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/></g>
<g transform="translate(885,200)"><rect x="0" y="0" width="245" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="26" class="t">Agents</text><text x="18" y="49" class="b">plan · act · coordinate</text><text x="18" y="69" class="b">tool use within policy boundaries</text><line x1="0" y1="48" x2="-82" y2="118" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/><rect x="0" y="126" width="245" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="152" class="t">Workflow</text><text x="18" y="175" class="b">repeatable execution</text><text x="18" y="195" class="b">human checkpoints + exceptions</text><line x1="0" y1="172" x2="-82" y2="172" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/><rect x="0" y="252" width="245" height="92" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="18" y="278" class="t">Governance</text><text x="18" y="301" class="b">permissions · risk · audit</text><text x="18" y="321" class="b">policy enforced at action time</text><line x1="0" y1="298" x2="-72" y2="228" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/></g><line x1="44" y1="590" x2="1156" y2="590" stroke="#e2e8f0" stroke-width="2"/><text x="44" y="611" class="tiny">System design lens: trusted context feeds models and agents; governed workflows produce outcomes; measurement closes the improvement loop.</text></svg>