<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="GPT-6 Astra professional work rollout"><rect width="1200" height="630" fill="#f7f9fc"/><text x="60" y="72" font-family="Arial" font-size="34" font-weight="700" fill="#14213d">GPT-6 Astra moves into professional work</text><text x="60" y="108" font-family="Arial" font-size="18" fill="#52606d">A staged rollout combines stronger computer use with explicit authority boundaries</text><circle cx="280" cy="320" r="145" fill="#fff" stroke="#d6deea"/><text x="280" y="298" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#14213d">GPT-6 Astra</text><text x="280" y="338" text-anchor="middle" font-family="Arial" font-size="17" fill="#52606d">reason • browse • use computer</text><text x="280" y="370" text-anchor="middle" font-family="Arial" font-size="17" fill="#52606d">create work artifacts</text><rect x="520" y="170" rx="18" width="270" height="120" fill="#fff" stroke="#d6deea"/><text x="655" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#14213d">Documents &amp; slides</text><text x="655" y="250" text-anchor="middle" font-family="Arial" font-size="16" fill="#52606d">professional output</text><rect x="850" y="170" rx="18" width="270" height="120" fill="#fff" stroke="#d6deea"/><text x="985" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#14213d">Computer use</text><text x="985" y="250" text-anchor="middle" font-family="Arial" font-size="16" fill="#52606d">multistep execution</text><rect x="520" y="350" rx="18" width="270" height="120" fill="#fff" stroke="#d6deea"/><text x="655" y="395" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#14213d">Staged rollout</text><text x="655" y="430" text-anchor="middle" font-family="Arial" font-size="16" fill="#52606d">limited → broader access</text><rect x="850" y="350" rx="18" width="270" height="120" fill="#fff" stroke="#d6deea"/><text x="985" y="395" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#14213d">Human authority</text><text x="985" y="430" text-anchor="middle" font-family="Arial" font-size="16" fill="#52606d">approval for consequences</text></svg>
