<rect x="70" y="165" rx="24" width="310" height="330" fill="#ffffff" stroke="#d6deea"/><text x="225" y="215" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#14213d">Human research day</text><circle cx="225" cy="320" r="66" fill="#e8eef9"/><circle cx="225" cy="292" r="22" fill="#5c6ac4"/><path d="M175 365q50-55 100 0" fill="#5c6ac4"/><text x="225" y="430" text-anchor="middle" font-family="Arial" font-size="17" fill="#52606d">priorities • judgment • deployment</text>
<rect x="445" y="165" rx="24" width="685" height="330" fill="#ffffff" stroke="#d6deea"/><text x="490" y="215" font-family="Arial" font-size="22" font-weight="700" fill="#14213d">Agent workdays per human workday</text><rect x="495" y="270" width="145" height="74" rx="12" fill="#dce7ff"/><rect x="660" y="270" width="145" height="74" rx="12" fill="#dce7ff"/><rect x="825" y="270" width="145" height="74" rx="12" fill="#dce7ff"/><rect x="990" y="270" width="50" height="74" rx="12" fill="#dce7ff"/><text x="770" y="330" text-anchor="middle" font-family="Arial" font-size="58" font-weight="700" fill="#2b59c3">3.1×</text><text x="490" y="405" font-family="Arial" font-size="18" fill="#52606d">Measure more than usage:</text><text x="490" y="438" font-family="Arial" font-size="17" fill="#14213d">delegated workload → success → interventions → human decisions</text><path d="M380 330H445" stroke="#7f8ea3" stroke-width="4"/></svg>
