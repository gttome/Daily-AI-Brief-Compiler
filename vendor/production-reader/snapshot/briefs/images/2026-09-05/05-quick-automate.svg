<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f6fbf8"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d38a2c"/><stop offset="1" stop-color="#efb85c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#4d3a22" flood-opacity=".14"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#1d2d3a}.m{fill:#66727a}.l{font-weight:700;fill:#32454e}.t{font-size:15px;fill:#617078}</style></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="52" y="62" font-size="34" class="h">Reliable agentic automation mixes judgment with determinism</text><text x="52" y="92" font-size="18" class="m">Amazon Quick Automate guidance: bounded agents, fixed steps, review and observability</text><rect x="48" y="128" width="1104" height="444" rx="28" fill="#fff" stroke="#e5ddd0" filter="url(#s)"/><text x="90" y="178" font-size="18" class="l">Example: invoice processing</text><g><rect x="85" y="220" width="175" height="115" rx="20" fill="#f9fbfd" stroke="#ccd8df"/><circle cx="120" cy="255" r="22" fill="#4f83a2"/><text x="113" y="262" font-size="18" fill="#fff" font-weight="700">1</text><text x="155" y="250" font-size="17" class="l">Extract</text><text x="112" y="288" class="t">agent reads invoice</text><text x="112" y="312" class="t">structured output</text><rect x="300" y="220" width="175" height="115" rx="20" fill="#fff8ed" stroke="#e5c797"/><circle cx="335" cy="255" r="22" fill="url(#a)"/><text x="328" y="262" font-size="18" fill="#fff" font-weight="700">2</text><text x="370" y="250" font-size="17" class="l">Validate</text><text x="328" y="288" class="t">deterministic rules</text><text x="328" y="312" class="t">thresholds + checks</text><rect x="515" y="220" width="175" height="115" rx="20" fill="#f8fbf8" stroke="#c6ddcf"/><circle cx="550" cy="255" r="22" fill="#438b63"/><text x="543" y="262" font-size="18" fill="#fff" font-weight="700">3</text><text x="585" y="250" font-size="17" class="l">Decide</text><text x="543" y="288" class="t">agent handles context</text><text x="543" y="312" class="t">exceptions + judgment</text><rect x="730" y="220" width="175" height="115" rx="20" fill="#fbf8ff" stroke="#d7cbe8"/><circle cx="765" cy="255" r="22" fill="#7961b2"/><text x="758" y="262" font-size="18" fill="#fff" font-weight="700">4</text><text x="800" y="250" font-size="17" class="l">Review</text><text x="758" y="288" class="t">human approval gate</text><text x="758" y="312" class="t">for consequential cases</text><rect x="945" y="220" width="155" height="115" rx="20" fill="#f9fbfd" stroke="#ccd8df"/><circle cx="980" cy="255" r="22" fill="#4f83a2"/><text x="973" y="262" font-size="18" fill="#fff" font-weight="700">5</text><text x="1015" y="250" font-size="17" class="l">Act</text><text x="975" y="288" class="t">post + notify</text><text x="975" y="312" class="t">attributed identity</text></g><g stroke="#8a9ba4" stroke-width="4" fill="none"><path d="M260 278H300"/><path d="M475 278H515"/><path d="M690 278H730"/><path d="M905 278H945"/></g><g fill="#8a9ba4"><polygon points="300,278 288,270 288,286"/><polygon points="515,278 503,270 503,286"/><polygon points="730,278 718,270 718,286"/><polygon points="945,278 933,270 933,286"/></g><g><rect x="125" y="395" width="275" height="105" rx="20" fill="#f6fafc" stroke="#cedae1"/><text x="155" y="430" font-size="18" class="l">Bounded responsibility</text><text x="155" y="458" class="t">one coherent job per agent</text><text x="155" y="482" class="t">scoped tools + schema</text><rect x="465" y="395" width="275" height="105" rx="20" fill="#f6faf8" stroke="#c8ddd0"/><text x="495" y="430" font-size="18" class="l">Evaluate continuously</text><text x="495" y="458" class="t">unit tests • regression checks</text><text x="495" y="482" class="t">quality before assembly</text><rect x="805" y="395" width="275" height="105" rx="20" fill="#fff9ef" stroke="#e6cb9f"/><text x="835" y="430" font-size="18" class="l">Observe every run</text><text x="835" y="458" class="t">steps • tools • decision path</text><text x="835" y="482" class="t">metrics + alarms</text></g><text x="385" y="545" font-size="15" class="m">Rule of thumb: if the rule can be written completely, use a deterministic step.</text></svg>