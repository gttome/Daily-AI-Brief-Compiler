<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#eef8f5"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b8d78"/><stop offset="1" stop-color="#4db59e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#24485a" flood-opacity=".15"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#10233f}.m{fill:#5b6c7b}.l{font-weight:700;fill:#21475a}.t{font-size:15px;fill:#536878}</style></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="52" y="62" font-size="34" class="h">Agent memory needs a lifecycle</text><text x="52" y="92" font-size="18" class="m">Long-running agents improve when memory is scored, consolidated and pruned</text><rect x="48" y="128" width="1104" height="444" rx="28" fill="#fff" stroke="#d5e5e1" filter="url(#s)"/><circle cx="555" cy="350" r="145" fill="#f4fbf9" stroke="#b9ddd4" stroke-width="2"/><circle cx="555" cy="350" r="88" fill="url(#g)" filter="url(#s)"/><text x="511" y="342" font-size="20" fill="#fff" font-weight="700">Managed</text><text x="514" y="369" font-size="20" fill="#fff" font-weight="700">memory</text><g><rect x="95" y="190" width="250" height="88" rx="18" fill="#f7fbff" stroke="#cbdbe9"/><text x="125" y="224" font-size="19" class="l">Interaction stream</text><text x="125" y="250" class="t">conversations • outcomes • facts</text><path d="M345 234C405 234 430 270 450 292" stroke="#6f94ad" stroke-width="4" fill="none"/><polygon points="452,293 437,290 445,278" fill="#6f94ad"/></g><g><rect x="805" y="160" width="260" height="92" rx="18" fill="#f3fbf8" stroke="#a9d7cc"/><circle cx="845" cy="206" r="24" fill="#1b8d78"/><text x="838" y="214" font-size="21" fill="#fff" font-weight="700">1</text><text x="884" y="196" font-size="19" class="l">Score</text><text x="884" y="222" class="t">relevance • recency • risk</text><rect x="835" y="286" width="260" height="92" rx="18" fill="#fbf8ff" stroke="#d4c9e5"/><circle cx="875" cy="332" r="24" fill="#6f62b8"/><text x="868" y="340" font-size="21" fill="#fff" font-weight="700">2</text><text x="914" y="322" font-size="19" class="l">Consolidate</text><text x="914" y="348" class="t">merge duplicates • preserve signal</text><rect x="805" y="412" width="260" height="92" rx="18" fill="#fff8ef" stroke="#e2c28d"/><circle cx="845" cy="458" r="24" fill="#c88733"/><text x="838" y="466" font-size="21" fill="#fff" font-weight="700">3</text><text x="884" y="448" font-size="19" class="l">Prune</text><text x="884" y="474" class="t">expire stale context • reduce risk</text></g><g stroke="#7da695" stroke-width="4" fill="none"><path d="M661 274C710 232 748 211 805 207"/><path d="M700 350H835"/><path d="M661 426C710 468 748 468 805 458"/></g><g><rect x="115" y="345" width="255" height="115" rx="20" fill="#fff7f2" stroke="#e5bca5"/><text x="145" y="382" font-size="18" class="l">Without lifecycle control</text><text x="145" y="412" class="t">outdated cases linger</text><text x="145" y="438" class="t">superseded runbooks persist</text><circle cx="330" cy="395" r="12" fill="#d66b4b"/><path d="M324 389l12 12M336 389l-12 12" stroke="#fff" stroke-width="3"/></g><rect x="405" y="510" width="300" height="40" rx="12" fill="#edf8f4"/><text x="445" y="535" font-size="15" class="l">Nightly lifecycle workflow • configurable policies</text></svg>