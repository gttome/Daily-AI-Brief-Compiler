<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7259d6"/><stop offset="1" stop-color="#2d79c7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17345d" flood-opacity=".15"/></filter><style>text{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#10233f}.m{fill:#5a6c84}.l{font-weight:700;fill:#243a5e}.t{font-size:15px;fill:#53657d}</style></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="52" y="62" font-size="34" class="h">HydraFusion: runtime model orchestration</text><text x="52" y="92" font-size="18" class="m">One task, multiple execution patterns selected for quality, cost and latency</text><rect x="45" y="125" width="1110" height="445" rx="28" fill="#fff" stroke="#d7e2f1" filter="url(#s)"/><rect x="80" y="180" width="220" height="300" rx="22" fill="#f8fbff" stroke="#c7d8ec"/><text x="112" y="220" font-size="20" class="l">Coding task</text><rect x="112" y="255" width="155" height="52" rx="12" fill="#fff" stroke="#cbd8e8"/><text x="135" y="287" font-size="15" class="t">Repository context</text><rect x="112" y="325" width="155" height="52" rx="12" fill="#fff" stroke="#cbd8e8"/><text x="147" y="357" font-size="15" class="t">Goal + tools</text><rect x="112" y="395" width="155" height="52" rx="12" fill="#fff" stroke="#cbd8e8"/><text x="140" y="427" font-size="15" class="t">Permission loop</text><path d="M300 330H410" stroke="#547fb6" stroke-width="5"/><polygon points="410,330 394,320 394,340" fill="#547fb6"/><circle cx="500" cy="330" r="78" fill="url(#r)" filter="url(#s)"/><text x="458" y="320" font-size="20" fill="#fff" font-weight="700">Runtime</text><text x="446" y="347" font-size="20" fill="#fff" font-weight="700">orchestrator</text><text x="442" y="375" font-size="14" fill="#eaf3ff">capability signals</text><g><rect x="640" y="155" width="430" height="105" rx="18" fill="#f8fbff" stroke="#c7d8ec"/><circle cx="685" cy="207" r="27" fill="#2d79c7"/><text x="676" y="215" font-size="24" fill="#fff" font-weight="700">1</text><text x="730" y="195" font-size="20" class="l">Single</text><text x="730" y="223" font-size="15" class="t">One selected model solves the task directly</text><rect x="640" y="278" width="430" height="105" rx="18" fill="#fbf9ff" stroke="#d4c8ec"/><circle cx="685" cy="330" r="27" fill="#7259d6"/><text x="676" y="338" font-size="24" fill="#fff" font-weight="700">2</text><text x="730" y="318" font-size="20" class="l">Cascade</text><text x="730" y="346" font-size="15" class="t">Efficient draft → quality gate → stronger model if needed</text><rect x="640" y="401" width="430" height="105" rx="18" fill="#f7fcfb" stroke="#bfe0d9"/><circle cx="685" cy="453" r="27" fill="#238b78"/><text x="676" y="461" font-size="24" fill="#fff" font-weight="700">3</text><text x="730" y="441" font-size="20" class="l">Critique</text><text x="730" y="469" font-size="15" class="t">Draft → independent read-only critic → one revision</text></g><g stroke="#879bb7" stroke-width="3" fill="none"><path d="M578 290C610 255 615 215 640 207"/><path d="M578 330H640"/><path d="M578 370C610 405 615 445 640 453"/></g><rect x="405" y="455" width="190" height="75" rx="18" fill="#fff8e8" stroke="#d8b15e"/><text x="438" y="485" font-size="17" class="l">Guardrails</text><text x="430" y="510" font-size="14" class="t">validate • fail safe</text><text x="780" y="545" font-size="15" class="m">Research preview • controlled offline results</text></svg>