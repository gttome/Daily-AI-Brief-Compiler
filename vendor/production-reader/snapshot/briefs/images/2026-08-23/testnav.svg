<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">TESTNAV search landscape and Pareto frontier</title><desc id="d">A multidimensional field of transformed test cases highlights a Pareto frontier balancing realistic fidelity against failure severity.</desc><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#d9e5f1"/></linearGradient><radialGradient id="hot"><stop stop-color="#ffdc6a"/><stop offset="1" stop-color="#ef5a48"/></radialGradient></defs><rect width="1200" height="630" fill="url(#g)"/><text x="60" y="70" font-family="Arial" font-size="42" font-weight="700" fill="#19324a">TESTNAV: find realistic combinations that expose failure</text><g transform="translate(90 125)" font-family="Arial"><path d="M70 400H700M70 400V30" stroke="#19324a" stroke-width="5"/><text x="385" y="458" text-anchor="middle" font-size="23" fill="#19324a">Input fidelity → more realistic</text><text transform="translate(20 225) rotate(-90)" text-anchor="middle" font-size="23" fill="#19324a">Failure severity</text><g fill="#8fb2cd"><circle cx="130" cy="345" r="12"/><circle cx="175" cy="310" r="14"/><circle cx="220" cy="340" r="10"/><circle cx="250" cy="275" r="15"/><circle cx="300" cy="300" r="11"/><circle cx="340" cy="235" r="16"/><circle cx="390" cy="270" r="12"/><circle cx="430" cy="190" r="16"/><circle cx="485" cy="225" r="12"/><circle cx="530" cy="150" r="17"/><circle cx="590" cy="185" r="11"/><circle cx="640" cy="105" r="18"/></g><path d="M135 330C250 285 310 255 420 185S575 145 650 82" fill="none" stroke="#ef5a48" stroke-width="8"/><g fill="url(#hot)" stroke="#b7352b" stroke-width="3"><circle cx="135" cy="330" r="20"/><circle cx="250" cy="280" r="20"/><circle cx="350" cy="230" r="20"/><circle cx="445" cy="175" r="20"/><circle cx="540" cy="130" r="20"/><circle cx="650" cy="82" r="20"/></g><text x="505" y="70" font-size="22" font-weight="700" fill="#b7352b