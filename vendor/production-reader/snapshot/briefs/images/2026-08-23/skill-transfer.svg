<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Subtask skills transfer across different tasks</title><desc id="d">Two distinct task islands share small reusable text skill pieces while a large monolithic recipe fails to fit.</desc><rect width="1200" height="630" fill="#fff8ea"/><text x="60" y="75" font-family="Arial" font-size="42" font-weight="700" fill="#26384a">Small text skills travel; monolithic recipes get stuck</text><g font-family="Arial"><path d="M70 160h370l50 70-50 250H70z" fill="#dceeff" stroke="#3573a6" stroke-width="5"/><text x="255" y="215" text-anchor="middle" font-size="30" font-weight="700" fill="#255477">TASK X</text><circle cx="170" cy="315" r="62" fill="#fff" stroke="#3573a6" stroke-width="4"/><path d="M145 315h50M170 290v50" stroke="#3573a6" stroke-width="10"/><text x="170" y="405" text-anchor="middle" font-size="19" fill="#255477">Research</text><rect x="270" y="260" width="115" height="110" rx="18" fill="#fff" stroke="#3573a6" stroke-width="4"/><path d="M295 295h65M295 320h50M295 345h60" stroke="#3573a6" stroke-width="7"/><text x="328" y="405" text-anchor="middle" font-size="19" fill="#255477">Report</text><path d="M760 160h370v320H760l-50-250z" fill="#e8def8" stroke="#7353a5" stroke-width="5"/><text x="945" y="215" text-anchor="middle" font-size="30" font-weight="700" fill="#543b7a">TASK Y</text><path d="M850 275l55 30v70l-55 30-55-30v-70z" fill="#fff" stroke="#7353a5" stroke-width="4"/><circle cx="850" cy="340" r="18" fill="#7353a5"/><text x="850" y="438" text-anchor="middle" font-size="19" fill="#543b7a">Plan</text><rect x="965" y="280" width="105" height="120" rx="52" fill="#fff" stroke="#7353a5" stroke-width="4"/><path d="M990 320h55M990 345h55M990 370h40" stroke="#7353a5" stroke-width="7"/><text x="1018" y="438" text-anchor="middle" font-size="19" fill="#543b7a">Execute</text><g transform="translate(430 245)"><path d="M0 0h90v32c25-12 45 2 45 24s-20 36-45 24v32H0V80c-25 12-45-2-45-24S-25 20 0 32z" fill="#f5a623" stroke="#9a5b00" stroke-width="4"/><text x="45" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#553200">CHECK</text></g><g transform="translate(590 320) rotate(8)"><path d="M0 0h90v32c25-12 45 2 45 24s-20 36-45 24v32H0V80c-25 12-45-2-45-24S-25 20 0 32z" fill="#55c2a3" stroke="#267864" stroke-width="4"/><text x="45" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#174c40">CITE</text></g><path d="M470 205C540 150 660 150 730 205" fill="none" stroke="#f5a623" stroke-width="7" stroke-dasharray="10 8"/><path d="M720 190l18 18-25 8" fill="none" stroke="#f5a623" stroke-width="7"/><g transform="translate(445 495)"><rect width="310" height="78" rx="18" fill="#f3c9c9" stroke="#a44" stroke-width="4"/><text x="155" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#7c2f2f">WHOLE-TASK RECIPE</text><text x="155" y="60" text-anchor="middle" font-size="17" fill="#7c2f2f">too large and source-task specific</text></g><path d="M430 535h-55M755 535h55" stroke="#a44" stroke-width="6"/><path d="M387 520l-16 15 16 15M798 520l16 15-16 15" fill="none" stroke="#a44" stroke-width="6"/></g></svg>