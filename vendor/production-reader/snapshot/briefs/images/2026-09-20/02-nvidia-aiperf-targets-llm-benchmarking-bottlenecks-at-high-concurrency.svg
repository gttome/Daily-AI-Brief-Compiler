<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Detailed benchmark architecture showing workload definition, multiprocess AIPerf workers, serving system components, measured results, and bottleneck diagnosis."><rect width="1200" height="630" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71808e"/></marker></defs><text x="54" y="56" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17365d">AIPerf benchmark architecture at high concurrency</text><text x="56" y="88" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#566573">The benchmark client must scale with the serving stack—or the load generator becomes the hidden bottleneck.</text><line x1="55" y1="122" x2="1145" y2="122" stroke="#e7edf2" stroke-width="2"/><g><rect x="55" y="160" width="230" height="295" rx="16" fill="#eef5fb" stroke="#2f6b9a" stroke-width="2"/><rect x="55" y="160" width="8" height="295" rx="4" fill="#2f6b9a"/><text x="75" y="188" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#182635">Workload definition</text><circle cx="79" cy="214" r="4" fill="#2f6b9a"/><text x="91" y="218" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Prompt / token mix</text><circle cx="79" cy="240" r="4" fill="#2f6b9a"/><text x="91" y="244" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Concurrency targets</text><circle cx="79" cy="266" r="4" fill="#2f6b9a"/><text x="91" y="270" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Warm-up + duration</text><circle cx="79" cy="292" r="4" fill="#2f6b9a"/><text x="91" y="296" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">SLO thresholds</text></g><g><rect x="350" y="145" width="270" height="325" rx="16" fill="#fbf0f0" stroke="#9c2f2f" stroke-width="2"/><rect x="350" y="145" width="8" height="325" rx="4" fill="#9c2f2f"/><text x="370" y="173" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#182635">Multiprocess AIPerf</text><circle cx="374" cy="199" r="4" fill="#9c2f2f"/><text x="386" y="203" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Coordinator partitions load</text><circle cx="374" cy="225" r="4" fill="#9c2f2f"/><text x="386" y="229" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Independent worker processes</text><circle cx="374" cy="251" r="4" fill="#9c2f2f"/><text x="386" y="255" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Rate + concurrency control</text><circle cx="374" cy="277" r="4" fill="#9c2f2f"/><text x="386" y="281" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Low-overhead telemetry</text></g><g><rect x="685" y="160" width="245" height="295" rx="16" fill="#eef7f1" stroke="#3f704d" stroke-width="2"/><rect x="685" y="160" width="8" height="295" rx="4" fill="#3f704d"/><text x="705" y="188" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#182635">Serving system</text><circle cx="709" cy="214" r="4" fill="#3f704d"/><text x="721" y="218" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Gateway / scheduler</text><circle cx="709" cy="240" r="4" fill="#3f704d"/><text x="721" y="244" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Model replicas</text><circle cx="709" cy="266" r="4" fill="#3f704d"/><text x="721" y="270" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">KV-cache + memory</text><circle cx="709" cy="292" r="4" fill="#3f704d"/><text x="721" y="296" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">GPU / accelerator pool</text></g><g><rect x="975" y="175" width="170" height="265" rx="16" fill="#fbf6e8" stroke="#8a6516" stroke-width="2"/><rect x="975" y="175" width="8" height="265" rx="4" fill="#8a6516"/><text x="995" y="203" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#182635">Measured result</text><circle cx="999" cy="229" r="4" fill="#8a6516"/><text x="1011" y="233" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Throughput</text><circle cx="999" cy="255" r="4" fill="#8a6516"/><text x="1011" y="259" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">TTFT</text><circle cx="999" cy="281" r="4" fill="#8a6516"/><text x="1011" y="285" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Inter-token latency</text><circle cx="999" cy="307" r="4" fill="#8a6516"/><text x="1011" y="311" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Tail percentiles</text></g><path d="M285,307 L350,307" stroke="#71808e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M620,307 L685,307" stroke="#71808e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M930,307 L975,307" stroke="#71808e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="350" y="485" width="580" height="35" rx="12" fill="#f7f9fb" stroke="#e7edf2"/><text x="640" y="507" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#17365d">If workers saturate first → benchmark result understates serving capacity</text><rect x="54" y="535" width="1092" height="60" rx="14" fill="#f6f8fa" stroke="#e7edf2"/><text x="72" y="555" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#17365d">OPERATING TAKEAWAY</text><text x="72" y="578" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#182635">Benchmark the benchmark: verify the client can sustain intended concurrency before using results for capacity decisions.</text><text x="1145" y="612" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#74808a">Daily Generative AI Brief · explanatory diagram</text></svg>