ight="42" rx="12" fill="#eef7fb"/><text x="562" y="321" class="t">Slack</text><rect x="495" y="350" width="205" height="42" rx="12" fill="#eef7fb"/><text x="536" y="376" class="t">Tableau Next</text><rect x="495" y="405" width="205" height="42" rx="12" fill="#eef7fb"/><text x="536" y="431" class="t">Premier support</text><rect x="805" y="150" width="285" height="345" rx="24" fill="url(#c)" filter="url(#s)"/><text x="845" y="194" font-size="22" fill="#fff" font-weight="700">Max</text><rect x="845" y="225" width="205" height="44" rx="12" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".35"/><text x="886" y="252" font-size="15" fill="#fff">broader AI package</text><rect x="845" y="282" width="205" height="44" rx="12" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".35"/><text x="886" y="309" font-size="15" fill="#fff">analytics + semantics</text><rect x="845" y="339" width="205" height="44" rx="12" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".35"/><text x="887" y="366" font-size="15" fill="#fff">collaboration layer</text><rect x="845" y="396" width="205" height="44" rx="12" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".35"/><text x="881" y="423" font-size="15" fill="#fff">governance + security</text><text x="845" y="468" font-size="14" fill="#eaf8ff">single-purchase packaging</text></g><path d="M390 340H455" stroke="#6e9bb2" stroke-width="4"/><polygon points="455,340 442,331 442,349" fill="#6e9bb2"/><path d="M740 340H805" stroke="#2d91b8" stroke-width="4"/><polygon points="805,340 792,331 792,349" fill="#2d91b8"/><rect x="330" y="520" width="540" height="36" rx="12" fill="#edf6fa"/><text x="373" y="543" font-size="15" class="l">Simpler buying does not remove the need for permissions, evaluation and human accountability</text></svg>