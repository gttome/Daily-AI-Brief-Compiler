<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 -45 1200 720">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a4f9c"/><stop offset="1" stop-color="#327bc6"/></linearGradient>
<linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a8f9a"/><stop offset="1" stop-color="#38b9b0"/></linearGradient>
<filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17345d" flood-opacity=".16"/></filter>
<style>text{font-family:Arial,Helvetica,sans-serif}.h{font-weight:700;fill:#10233f}.m{fill:#53657d}.lab{font-weight:700;fill:#17345d}.tiny{font-size:15px;fill:#52647b}</style>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="50" y="60" font-size="34" class="h">GPT-6 Astra</text><text x="50" y="91" font-size="18" class="m">Controlled computer-use workflow: capability inside explicit authority</text>
<rect x="40" y="125" width="1120" height="445" rx="28" fill="#fff" stroke="#d8e3f3" filter="url(#s)"/>
<!-- intent -->
<rect x="70" y="170" width="190" height="255" rx="20" fill="#f9fbfe" stroke="#c7d7ea"/><circle cx="103" cy="205" r="20" fill="url(#teal)"/><text x="96" y="212" font-size="20" fill="#fff" font-weight="700">1</text><text x="135" y="212" font-size="20" class="lab">User intent</text>
<g class="tiny"><text x="98" y="260">Research topic</text><text x="98" y="305">Find evidence</text><text x="98" y="350">Summarize</text><text x="98" y="395">Create report</text></g>
<g stroke="#5f7ea5" stroke-width="2" fill="none"><circle cx="84" cy="255" r="7"/><circle cx="84" cy="300" r="7"/><rect x="77" y="343" width="14" height="14" rx="2"/><path d="M77 391h14M84 384v14"/></g>
<!-- plan -->
<rect x="295" y="170" width="195" height="255" rx="20" fill="#f9fbfe" stroke="#c7d7ea"/><circle cx="328" cy="205" r="20" fill="url(#blue)"/><text x="321" y="212" font-size="20" fill="#fff" font-weight="700">2</text><text x="360" y="212" font-size="20" class="lab">Plan &amp; reason</text>
<g class="tiny"><text x="324" y="260">Understand goal</text><text x="324" y="305">Break down tasks</text><text x="324" y="350">Select tools</text><text x="324" y="395">Anticipate risks</text></g>
<!-- authorized platform -->
<rect x="530" y="145" width="395" height="310" rx="25" fill="#f6fbff" stroke="#16a6b0" stroke-width="2.5"/><text x="647" y="174" font-size="15" fill="#077784" font-weight="700">AUTHORIZED ACTION BOUNDARY</text><text x="635" y="208" font-size="21" class="lab">3  Bounded computer actions</text>
<ellipse cx="728" cy="385" rx="160" ry="38" fill="#dcecff"/><ellipse cx="728" cy="377" rx="115" ry="25" fill="#eef6ff"/>
<g filter="url(#s)">
<rect x="560" y="245" width="62" height="105" rx="12" fill="#fff" stroke="#c8d8ed"/><text x="576" y="270" font-size="18" fill="#2769bd">◎</text><text x="574" y="326" font-size="14" class="lab">Web</text>
<rect x="635" y="235" width="62" height="115" rx="12" fill="#fff" stroke="#c8d8ed"/><text x="654" y="265" font-size="18" fill="#2769bd">▤</text><text x="646" y="326" font-size="14" class="lab">Docs</text>
<rect x="710" y="228" width="62" height="122" rx="12" fill="#fff" stroke="#c8d8ed"/><text x="729" y="260" font-size="18" fill="#15946b">▦</text><text x="719" y="326" font-size="14" class="lab">Sheets</text>
<rect x="785" y="235" width="62" height="115" rx="12" fill="#fff" stroke="#c8d8ed"/><text x="805" y="265" font-size="18" fill="#d98720">▣</text><text x="794" y="326" font-size="14" class="lab">Slides</text>
<rect x="860" y="245" width="42" height="105" rx="12" fill="#fff" stroke="#c8d8ed"/><text x="868" y="274" font-size="16" fill="#614bb7">&lt;/&gt;</text><text x="867" y="326" font-size="13" class="lab">Code</text>
</g>
<polygon points="728,340 758,358 758,394 728,412 698,394 698,358" fill="url(#blue)" stroke="#31bac0" stroke-width="4"/><path d="M715 376h26M728 363v26" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<!-- verify -->
<rect x="960" y="170" width="165" height="255" rx="20" fill="#f9fbfe" stroke="#c7d7ea"/><circle cx="993" cy="205" r="20" fill="url(#teal)"/><text x="986" y="212" font-size="20" fill="#fff" font-weight="700">4</text><text x="1024" y="212" font-size="20" class="lab">Verify</text><g class="tiny"><text x="987" y="260">Check output</text><text x="987" y="305">Validate sources</text><text x="987" y="350">Confirm accuracy</text><text x="987" y="395">Ensure policy</text></g>
<!-- arrows -->
<g fill="none" stroke="#2f70bd" stroke-width="5" stroke-linecap="round"><path d="M260 300H295"/><path d="M490 300H530"/><path d="M925 300H960"/></g><g fill="#2f70bd"><polygon points="294,300 282,292 282,308"/><polygon points="529,300 517,292 517,308"/><polygon points="959,300 947,292 947,308"/></g>
<!-- review and audit -->
<rect x="430" y="475" width="275" height="70" rx="18" fill="#fffaf0" stroke="#d8ac54"/><circle cx="465" cy="510" r="19" fill="#d9a343"/><text x="459" y="517" font-size="20" fill="#fff" font-weight="700">5</text><text x="495" y="505" font-size="18" class="lab">Human review gate</text><text x="495" y="529" font-size="14" class="m">review actions • assess risk • approve</text><path d="M728 455V475" stroke="#d09a39" stroke-width="4"/>
<rect x="740" y="475" width="300" height="70" rx="18" fill="#f7faff" stroke="#c7d7ea"/><text x="770" y="503" font-size="18" class="lab">Audit trail</text><text x="770" y="528" font-size="14" class="m">actions taken • evidence collected • outcome delivered</text>
</svg>