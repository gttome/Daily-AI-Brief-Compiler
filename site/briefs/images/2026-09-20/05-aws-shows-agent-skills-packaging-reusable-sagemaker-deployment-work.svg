al,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#263746">Easier to improve</text></g><path d="M305,310 L370,310" stroke="#71808e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M590,310 L655,310" stroke="#71808e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M895,310 L960,310" stroke="#71808e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="54" y="535" width="1092" height="60" rx="14" fill="#f6f8fa" stroke="#e7edf2"/><text x="72" y="555" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#17365d">OPERATING TAKEAWAY</text><text x="72" y="578" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#182635">Package stable expert procedures once, then improve the reusable skill instead of rebuilding the workflow in every prompt.</text><text x="1145" y="612" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#74808a">Daily Generative AI Brief · explanatory diagram</text></svg>