<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">InsufficiencyBench missing legal facts</title><desc id="d">A legal case folder contains visible missing-fact gaps that stop at a clarification gate before an answer can proceed.</desc><rect width="1200" height="630" fill="#f4f0e7"/><text x="65" y="75" font-family="Georgia" font-size="42" font-weight="700" fill="#28313a">InsufficiencyBench: stop before answering incomplete cases</text><g transform="translate(70 135)"><path d="M0 70h210l45-55h280v410H0z" fill="#caa96a" stroke="#70552c" stroke-width="6"/><rect x="45" y="105" width="445" height="275" rx="8" fill="#fffdf7"/><text x="75" y="150" font-family="Georgia" font-size="26" font-weight="700" fill="#28313a">CASE FACTS</text><g stroke="#6d7780" stroke-width="6"><path d="M75 190h300"/><path d="M75 230h350"/><path d="M75 350h240"/></g><rect x="75" y="265" width="350" height="52" rx="8" fill="none" stroke="#cf4c42" stroke-width="5" stroke-dasharray="12 8"/><text x="250" y="300" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#cf4c42">DECISION-CHANGING FACT MISSING</text><circle cx="455" cy="70" r="50" fill="#cf4c42"/><text x="455" y="86" text-anchor="middle" font-family="Arial" font-size="50" font-weight="700" fill="white">?</text></g><g transform="translate(650 155)" font-family="Arial"><rect x="0" y="0" width="165" height="340" rx="26" fill="#263f57"/><circle cx="82" cy="80" r="48" fill="#f0b44c"/><path d="M82 48v42M82 112v3" stroke="#263f57" stroke-width="12" stroke-linecap="round"/><text x="82" y="170" text-anchor="middle" fill="white" font-size="26" font-weight="700">SUFFICIENCY</text><text x="82" y="202" text-anchor="middle" fill="white" font-size="26" font-weight="700">GATE</text><rect x="30" y="245" width="105" height="55" rx="12" fill="#cf4c42"/><text x="82" y="281" text-anchor="middle" fill="white" font-size="21" font-weight="700">PAUSE</text><path d="M-90 170h80" stroke="#263f57" stroke-width="9"/><path d="M-20 152l20 18-20 18" fill="none" stroke="#263f57" stroke-width="9"/></g><g transform="translate(900 165)" font-family="Arial"><path d="M0 70l95-70 95 70v200H0z" fill="#d8e9df" stroke="#3e765a" stroke-width="5"/><path d="M45 120h100M45 160h75M45 200h90" stroke="#3e765a" stroke-width="7"/><circle cx="155" cy="280" r="55" fill="#3e765a"/><path d="M130 280l18 18 35-42" fill="none" stroke="white" stroke-width="10"/><text x="95" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#3e765a">ANSWER ONLY AFTER</text><text x="95" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#3e765a">TARGETED CLARIFICATION</text></g></svg>