<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">ReguSim rationale versus action audit</title><desc id="d">A split-screen visual contrasts an agent's persuasive rationale with the attempted action, deterministic enforcement and audit evidence.</desc><rect width="1200" height="630" fill="#101721"/><text x="60" y="72" fill="white" font-family="Arial" font-size="42" font-weight="700">ReguSim: explanations are not execution evidence</text><line x1="600" y1="110" x2="600" y2="570" stroke="#607084" stroke-width="4" stroke-dasharray="10 10"/><g transform="translate(55 125)" font-family="Arial"><text x="245" y="40" text-anchor="middle" fill="#b9c7d6" font-size="24" font-weight="700">WHAT THE AGENT SAYS</text><path d="M70 95h350a35 35 0 0 1 35 35v150a35 35 0 0 1-35 35H220l-70 70 15-70H70a35 35 0 0 1-35-35V130a35 35 0 0 1 35-35z" fill="#f7f9fc" stroke="#8ea2b8" stroke-width="5"/><text x="245" y="160" text-anchor="middle" fill="#33485c" font-size="25">“The trade follows policy</text><text x="245" y="198" text-anchor="middle" fill="#33485c" font-size="25">and serves the client.”</text><path d="M110 245h270" stroke="#c4cdd7" stroke-width="8"/><path d="M110 275h210" stroke="#c4cdd7" stroke-width="8"/><circle cx="245" cy="445" r="58" fill="#6f87a0"/><path d="M215 447l20 20 42-52" fill="none" stroke="white" stroke-width="10"/><text x="245" y="530" text-anchor="middle" fill="#b9c7d6" font-size="20">Plausible rationale</text></g><g transform="translate(645 125)" font-family="Arial"><text x="245" y="40" text-anchor="middle" fill="#b9c7d6" font-size="24" font-weight="700">WHAT THE SYSTEM RECORDS</text><g transform="translate(15 90)"><rect width="180" height="90" rx="14" fill="#663a45" stroke="#e77383" stroke-width="4"/><text x="90" y="38" text-anchor="middle" fill="white" font-size="20" font-weight="700">ATTEMPTED ACTION</text><text x="90" y="67" text-anchor="middle" fill="#ffd5db" font-size="18">restricted trade</text><path d="M195 45h55" stroke="#e77383" stroke-width="7"/><path d="M238 30l18 15-18 15" fill="none" stroke="#e77383" stroke-width="7"/></g><g transform="translate(265 90)"><path d="M90 0l78 30v70c0 55-35 92-78 112-43-20-78-57-78-112V30z" fill="#7a4b1f" stroke="#ffb453" stroke-width="5"/><path d="M55 105l28 28 48-62" fill="none" stroke="#fff2d6" stroke-width="10"/><text x="90" y="245" text-anchor="middle" fill="#ffcf8c" font-size="19" font-weight="700">ENFORCEMENT</text><text x="90" y="271" text-anchor="middle" fill="#ffcf8c" font-size="19">rejected</text></g><g transform="translate(35 390)"><rect width="420" height="115" rx="16" fill="#173f37" stroke="#5ed6ad" stroke-width="4"/><path d="M35 32h18M35 58h18M35 84h18" stroke="#5ed6ad" stroke-width="7"/><path d="M75 32h300M75 58h250M75 84h280" stroke="#d7fff1" stroke-width="6"/><text x="210" y="145" text-anchor="middle" fill="#74e5bd" font-size="20">AUDIT LOG + ENFORCEMENT RECEIPT</text></g></g></svg>