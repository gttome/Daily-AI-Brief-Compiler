<svg role="img" aria-label="Skill-equipped agent evaluation: task routing, instruction fidelity, trace evidence, and answer quality" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#ffffff"/><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
<style>.k{font:700 14px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:1.2px}.h{font:700 29px Inter,Arial,sans-serif;fill:#0f172a}.s{font:400 15px Inter,Arial,sans-serif;fill:#475569}.t{font:700 15px Inter,Arial,sans-serif;fill:#0f172a}.b{font:400 12px Inter,Arial,sans-serif;fill:#475569}.m{font:700 12px Inter,Arial,sans-serif;fill:#334155}.tiny{font:400 10px Inter,Arial,sans-serif;fill:#64748b}</style></defs><text x="44" y="34" class="k">AWS SKILL-EQUIPPED AGENT EVALUATION</text><text x="44" y="69" class="h">Evaluate the procedure, not just the prose</text><text x="44" y="94" class="s">Skill-aware evaluation separates routing, procedural fidelity, tool behavior, and outcome quality so failures become diagnosable.</text><g filter="url(#shadow)"><rect x="44" y="138" width="1112" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1"/></g><text x="66" y="164" class="m">SKILL-AWARE EVALUATION MODEL</text>
<g transform="translate(66,195)"><text x="0" y="20" class="m">TASK</text><rect x="0" y="36" width="170" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="19" y="66" class="t">User request</text><text x="19" y="90" class="b">intent + constraints</text><line x1="174" y1="75" x2="223" y2="75" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="20" class="m">ROUTING</text><rect x="235" y="36" width="190" height="78" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="255" y="66" class="t">Skill selection</text><text x="255" y="90" class="b">choose reusable procedure</text><line x1="429" y1="75" x2="478" y2="75" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="20" class="m">EXECUTION</text><rect x="490" y="36" width="220" height="78" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="510" y="66" class="t">Instruction fidelity</text><text x="510" y="90" class="b">required steps + approved tools</text><line x1="714" y1="75" x2="763" y2="75" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="20" class="m">OUTCOME</text><rect x="775" y="36" width="190" height="78" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="795" y="66" class="t">Final answer</text><text x="795" y="90" class="b">useful + grounded</text><rect x="985" y="36" width="125" height="78" rx="12" fill="#0f172a"/><text x="1007" y="65" style="font:700 12px Inter,Arial;fill:white">TRACE</text><text x="1007" y="84" style="font:400 10px Inter,Arial;fill:#cbd5e1">every decision</text><text x="1007" y="100" style="font:400 10px Inter,Arial;fill:#cbd5e1">is observable</text><rect x="0" y="150" width="1110" height="192" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="18" y="176" class="m">EVALUATION STACK — A FLUENT ANSWER CAN STILL FAIL EARLIER LAYERS</text><line x1="18" y1="190" x2="1090" y2="190" stroke="#e2e8f0"/><text x="24" y="216" class="m">Metric</text><text x="244" y="216" class="m">Question</text><text x="660" y="216" class="m">Evidence</text><text x="930" y="216" class="m">Result</text><text x="24" y="248" class="b">Skill selection</text><text x="244" y="248" class="b">Did the agent choose the right reusable skill?</text><text x="660" y="248" class="b">router decision + task match</text><rect x="930" y="231" width="100" height="24" rx="12" fill="#dcfce7"/><text x="961" y="248" class="m">PASS</text><text x="24" y="280" class="b">Instruction fidelity</text><text x="244" y="280" class="b">Were required steps followed in order?</text><text x="660" y="280" class="b">step trace + tool calls</text><rect x="930" y="263" width="100" height="24" rx="12" fill="#dcfce7"/><text x="961" y="280" class="m">PASS</text><text x="24" y="312" class="b">Answer quality</text><text x="244" y="312" class="b">Is the result useful, grounded, and complete?</text><text x="660" y="312" class="b">output rubric + references</text><rect x="930" y="295" width="100" height="24" rx="12" fill="#fef3c7"/><text x="948" y="312" class="m">REVIEW</text></g><line x1="44" y1="590" x2="1156" y2="590" stroke="#e2e8f0" stroke-width="2"/><text x="44" y="611" class="tiny">Evaluation model: task → skill selection → procedural execution → outcome, with independent metrics and trace evidence at every layer.</text></svg>