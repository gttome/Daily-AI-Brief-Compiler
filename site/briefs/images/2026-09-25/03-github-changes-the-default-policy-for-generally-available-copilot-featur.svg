<svg role="img" aria-label="Copilot governance: enterprise defaults, organization controls, effective user access, and audit evidence" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#ffffff"/><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
<style>.k{font:700 14px Inter,Arial,sans-serif;fill:#64748b;letter-spacing:1.2px}.h{font:700 29px Inter,Arial,sans-serif;fill:#0f172a}.s{font:400 15px Inter,Arial,sans-serif;fill:#475569}.t{font:700 15px Inter,Arial,sans-serif;fill:#0f172a}.b{font:400 12px Inter,Arial,sans-serif;fill:#475569}.m{font:700 12px Inter,Arial,sans-serif;fill:#334155}.tiny{font:400 10px Inter,Arial,sans-serif;fill:#64748b}</style></defs><text x="44" y="34" class="k">GITHUB COPILOT GOVERNANCE</text><text x="44" y="69" class="h">From global defaults to governed user access</text><text x="44" y="94" class="s">A control-plane view of how platform defaults are inherited, overridden, evidenced, and audited across enterprise layers.</text><g filter="url(#shadow)"><rect x="44" y="138" width="1112" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1"/></g><text x="66" y="164" class="m">POLICY PROPAGATION + CONTROL OWNERSHIP</text>
<g transform="translate(68,200)"><circle cx="82" cy="70" r="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="41" y="62" class="t">NEW GA</text><text x="32" y="84" class="t">FEATURE</text><text x="33" y="110" class="tiny">platform default</text><line x1="145" y1="70" x2="206" y2="70" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="215" y="8" width="190" height="124" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="236" y="36" class="m">ENTERPRISE LAYER</text><text x="236" y="63" class="t">Global default</text><text x="236" y="85" class="b">allow / block / configure</text><text x="236" y="107" class="b">baseline for organizations</text><line x1="408" y1="70" x2="463" y2="70" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="472" y="8" width="190" height="124" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="493" y="36" class="m">ORGANIZATION LAYER</text><text x="493" y="63" class="t">Scoped policy</text><text x="493" y="85" class="b">team / org exceptions</text><text x="493" y="107" class="b">review before broad use</text><line x1="665" y1="70" x2="720" y2="70" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="729" y="8" width="190" height="124" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="750" y="36" class="m">USER LAYER</text><text x="750" y="63" class="t">Available capability</text><text x="750" y="85" class="b">experience visible only</text><text x="750" y="107" class="b">after inherited controls</text><rect x="947" y="8" width="138" height="124" rx="14" fill="#0f172a"/><text x="968" y="39" style="font:700 12px Inter,Arial;fill:white">EFFECTIVE</text><text x="968" y="58" style="font:700 12px Inter,Arial;fill:white">ACCESS</text><text x="968" y="86" style="font:400 10px Inter,Arial;fill:#cbd5e1">platform + enterprise</text><text x="968" y="103" style="font:400 10px Inter,Arial;fill:#cbd5e1">+ org + user context</text><rect x="0" y="176" width="1085" height="166" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="18" y="201" class="m">GOVERNANCE MATRIX</text><line x1="18" y1="216" x2="1065" y2="216" stroke="#e2e8f0"/><text x="24" y="242" class="m">Control</text><text x="210" y="242" class="m">Owner</text><text x="390" y="242" class="m">Decision</text><text x="625" y="242" class="m">Evidence</text><text x="865" y="242" class="m">Review trigger</text><line x1="18" y1="252" x2="1065" y2="252" stroke="#e2e8f0"/><text x="24" y="278" class="b">Default policy</text><text x="210" y="278" class="b">Enterprise admin</text><text x="390" y="278" class="b">Allow / block / configure</text><text x="625" y="278" class="b">Change log + rationale</text><text x="865" y="278" class="b">New GA capability</text><text x="24" y="307" class="b">Exception</text><text x="210" y="307" class="b">Org owner</text><text x="390" y="307" class="b">Scoped override</text><text x="625" y="307" class="b">Business need + risk</text><text x="865" y="307" class="b">Expiry / policy change</text><text x="24" y="336" class="b">User access</text><text x="210" y="336" class="b">Inherited controls</text><text x="390" y="336" class="b">Effective capability</text><text x="625" y="336" class="b">Audit trail</text><text x="865" y="336" class="b">Periodic review</text></g><line x1="44" y1="590" x2="1156" y2="590" stroke="#e2e8f0" stroke-width="2"/><text x="44" y="611" class="tiny">Governance model: platform default → enterprise baseline → organization exceptions → effective user capability, with explicit ownership and evidence.</text></svg>