<text x="66" y="160" class="m">VOLUMETRIC INPUT</text><text x="387" y="160" class="m">3D REASONING PIPELINE</text><text x="788" y="160" class="m">STRUCTURED REVIEW</text>
<g transform="translate(80,190)"><path d="M0 65 C28 0 176 0 214 60 C185 120 40 125 0 65Z" fill="#eef2ff" stroke="#64748b" stroke-width="2"/><path d="M10 75 C38 15 166 15 204 68 C175 117 50 121 10 75Z" fill="none" stroke="#94a3b8"/><path d="M22 87 C50 31 156 31 190 77 C163 115 64 117 22 87Z" fill="none" stroke="#94a3b8"/><ellipse cx="112" cy="64" rx="43" ry="29" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><ellipse cx="118" cy="64" rx="18" ry="12" fill="#fff" stroke="#64748b"/><circle cx="150" cy="84" r="8" fill="#f59e0b"/><line x1="158" y1="84" x2="202" y2="104" stroke="#f59e0b" stroke-width="2"/><text x="10" y="150" class="t">Axial slices → 3D volume</text><text x="10" y="172" class="b">Spatial relationships are preserved</text><rect x="10" y="205" width="205" height="64" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="25" y="228" class="m">INPUT SIGNALS</text><text x="25" y="249" class="b">voxel intensity · anatomy · location</text><text x="25" y="267" class="b">multi-slice continuity · region context</text></g>
