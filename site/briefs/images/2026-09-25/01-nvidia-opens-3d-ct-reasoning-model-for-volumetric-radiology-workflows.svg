<g transform="translate(392,190)"><rect x="0" y="0" width="320" height="68" rx="12" fill="#eef2ff" stroke="#6366f1"/><circle cx="28" cy="34" r="15" fill="#c7d2fe"/><text x="23" y="39" class="m">1</text><text x="55" y="27" class="t">Volumetric encoding</text><text x="55" y="49" class="b">3D anatomy + spatial evidence</text><line x1="160" y1="68" x2="160" y2="88" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="0" y="92" width="320" height="68" rx="12" fill="#f5f3ff" stroke="#8b5cf6"/><circle cx="28" cy="126" r="15" fill="#ddd6fe"/><text x="23" y="131" class="m">2</text><text x="55" y="119" class="t">Evidence-linked reasoning</text><text x="55" y="141" class="b">candidate finding ↔ supporting region</text><line x1="160" y1="160" x2="160" y2="180" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="0" y="184" width="320" height="68" rx="12" fill="#ecfeff" stroke="#0891b2"/><circle cx="28" cy="218" r="15" fill="#cffafe"/><text x="23" y="223" class="m">3</text><text x="55" y="211" class="t">Structured generation</text><text x="55" y="233" class="b">finding · location · severity · rationale</text><rect x="0" y="284" width="320" height="72" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="16" y="307" class="m">TRACEABILITY</text><text x="16" y="329" class="b">Each statement maps to a region</text><text x="16" y="347" class="b">and can be reviewed independently.</text></g>
