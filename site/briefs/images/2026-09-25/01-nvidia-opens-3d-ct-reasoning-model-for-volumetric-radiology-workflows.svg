<g transform="translate(790,190)"><rect x="0" y="0" width="338" height="118" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="16" y="24" class="m">STRUCTURED REPORT</text><rect x="16" y="40" width="250" height="10" rx="4" fill="#cbd5e1"/><rect x="16" y="60" width="292" height="10" rx="4" fill="#e2e8f0"/><rect x="16" y="80" width="218" height="10" rx="4" fill="#e2e8f0"/><circle cx="293" cy="45" r="7" fill="#22c55e"/><text x="305" y="49" class="tiny">evidence linked</text><rect x="0" y="140" width="338" height="142" rx="12" fill="#f0fdf4" stroke="#22c55e"/><text x="16" y="165" class="m">HUMAN REVIEW GATE</text><circle cx="25" cy="194" r="10" fill="#22c55e"/><text x="44" y="198" class="b">Confirm supported findings</text><circle cx="25" cy="224" r="10" fill="#f59e0b"/><text x="44" y="228" class="b">Escalate uncertainty / discordance</text><circle cx="25" cy="254" r="10" fill="#3b82f6"/><text x="44" y="258" class="b">Retain clinician responsibility</text><rect x="0" y="304" width="338" height="52" rx="10" fill="#0f172a"/><text x="17" y="327" style="font:700 12px Inter,Arial;fill:white">OUTPUT = reviewed findings + rationale + provenance</text></g><line x1="44" y1="590" x2="1156" y2="590" stroke="#e2e8f0" stroke-width="2"/><text x="44" y="611" class="tiny">Mechanism: 3D volume → spatial evidence reasoning → structured findings → human clinical review.</text></svg>