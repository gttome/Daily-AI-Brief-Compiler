<svg role="img" aria-label="3D CT reasoning: volumetric evidence, structured findings, and clinician review" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#ffffff"/><defs>
