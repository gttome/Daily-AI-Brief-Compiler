name: render-shadow-images

on:
  push:
    branches:
      - 'shadow/**'
      - 'rehearsal/**'
    paths:
      - 'shadow-runs/**/images/specs/**'
      - 'rehearsals/**/images/specs/**'
      - 'shadow-runs/**/images/attempts/**/raw.png'
      - 'shadow-runs/**/images/attempts/**/raw-receipt.json'
      - 'rehearsals/**/images/attempts/**/raw.png'
      - 'rehearsals/**/images/attempts/**/raw-receipt.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save sharp@0.34.4
      - name: Preserve pre-activation Proposal 1R rendering
        run: node scripts/render-pending-images.mjs
      - name: Process immutable D0 raw candidates deterministically
        run: node scripts/process-native-image.mjs
      - name: Build locked D0 benchmark vendor and reviewer atlases
        run: node scripts/build-image-benchmark-atlas.mjs
      - name: Persist exact deterministic image outputs
        run: |
          git config user.name "Daily Compiler Image Processor"
          git config user.email "actions@users.noreply.github.com"
          git add rehearsals 2>/dev/null || true
          git add shadow-runs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new deterministic image outputs"
            exit 0
          fi
          git commit -m "Process deterministic image outputs"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to persist deterministic image outputs after bounded Git rebase retries"
          exit 1
