name: fixture-shadow-pages-proof

# Historical fixture qualification, NOT a public-site publisher.
# A fixture must never replace an actual Daily AI Brief or its accepted images.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-shadow-pages-proof
  cancel-in-progress: false

jobs:
  build-verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save sharp@0.34.4
      - run: npm test
      - run: npm run fixture:e2e
      - name: Verify fixture artifacts remain isolated and nonpublishing
        shell: bash
        run: |
          set -euo pipefail
          test -d build/fixture
          test -s build/fixture/briefs/2026-10-06/index.html
          echo 'FIXTURE_LOCAL_VERIFIED; NO LIVE PAGES DEPLOYMENT'
      - name: Preserve standalone local proof for review
        uses: actions/upload-artifact@v4
        with:
          name: fixture-local-nonpublishing-proof
          path: build/fixture/
          retention-days: 14
          if-no-files-found: error
