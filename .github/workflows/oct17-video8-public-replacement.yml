name: oct17-video8-public-replacement
# Exact-date media-only revision. No new edition, image generation or scheduled job.
on:
  pull_request:
    paths:
      - '.github/workflows/oct17-video8-public-replacement.yml'
      - 'config/media-revisions/2026-10-17-video8.json'
      - 'scripts/correct-oct17-video8.py'
      - 'scripts/test-oct17-video8.py'
      - 'scripts/verify-ibm-episode.cjs'
      - 'scripts/verify-oct17-video8-release.py'
  push:
    branches: [main]
    paths: ['config/media-revisions/2026-10-17-video8.json']
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'pull_request' && github.repository == 'gttome/Daily-AI-Brief-Compiler' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact correction and preserve unrelated published bytes
        shell: bash
        run: |
          set -euo pipefail
          ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/oct17-video8-public-replacement.yml
          python3 scripts/test-oct17-video8.py
          git fetch --depth=1 origin shadow-pages-history
          git worktree add --detach history FETCH_HEAD
          python3 scripts/correct-oct17-video8.py config/media-revisions/2026-10-17-video8.json history/site build/patched build/video-correction.json
          node scripts/assert-published-image-continuity.mjs history/site build/patched
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'gttome/Daily-AI-Brief-Compiler' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: daily-compiler-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Admit exact protected-main revision and capture current history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          git diff --name-only HEAD^ HEAD -- config/media-revisions/2026-10-17-video8.json | grep -qx 'config/media-revisions/2026-10-17-video8.json'
          git fetch --depth=1 origin shadow-pages-history
          HISTORY_HEAD="$(git rev-parse FETCH_HEAD)"
          echo "HISTORY_HEAD=$HISTORY_HEAD" >> "$GITHUB_ENV"
          git worktree add --detach history "$HISTORY_HEAD"
          python3 - <<'PY'
          import hashlib,json,pathlib
          revision=json.loads(pathlib.Path('config/media-revisions/2026-10-17-video8.json').read_text())
          actual=hashlib.sha256(pathlib.Path('history/site/image-jobs/2026-10-17/job.json').read_bytes()).hexdigest()
          assert actual==revision['preservation']['immutable_job_sha256'],'Immutable job changed'
          usage=json.loads(pathlib.Path('docs/after-action/usage/2026-10-16.json').read_text())
          assert usage['work_usage_percent']==8 and usage['edition_date']=='2026-10-17'
          PY
      - name: Require public signed-out playback of the full replacement episode
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/browser --no-audit --no-fund playwright-core@1.51.1 >/dev/null
          node scripts/verify-ibm-episode.cjs build/video-playback.json
      - name: Patch only current video and its ten reader representations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-oct17-video8.py
          python3 scripts/correct-oct17-video8.py config/media-revisions/2026-10-17-video8.json history/site build/patched build/video-correction.json
          node scripts/assert-published-image-continuity.mjs history/site build/patched
      - name: Refuse competing code or publication changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/patched
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify ten live corrected routes and six unchanged article images
        run: python3 scripts/verify-oct17-video8-release.py build/video-correction.json build/patched history
      - name: Independently confirm all protected October 8 live objects
        run: node scripts/audit-oct8-live.mjs build/oct8-after-video-correction.json
      - name: Persist verified media revision without overwriting original evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
          python3 - <<'PY'
          import json,pathlib,shutil
          r=json.loads(pathlib.Path('build/video-correction.json').read_text())
          assert r['result']=='LIVE_REPLACEMENT_VERIFIED' and len(r['changed'])==10
          r['oct8_postdeploy_audit']=json.loads(pathlib.Path('build/oct8-after-video-correction.json').read_text())
          for item in r['changed']:
            shutil.copyfile('build/patched/'+item['route'],'history/site/'+item['route'])
          out=pathlib.Path('history/correction-receipts/2026-10-17-video8.json')
          assert not out.exists(),'Never overwrite the first verification receipt'
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(r,indent=2)+'\n')
          PY
          git -C history add -- site/index.html site/latest.html site/latest.md site/briefs/2026-10-17/index.html site/videos/2026-10-17/agent-skills/index.html site/feed.xml site/feed.json site/data/archive-index.json site/data/compiler-feedback-registry.json site/briefs-archive/index.html correction-receipts/2026-10-17-video8.json
          test "$(git -C history diff --cached --name-only | wc -l)" -eq 11
          git -C history config user.name 'Daily Compiler Media Correction'
          git -C history config user.email 'actions@users.noreply.github.com'
          git -C history commit -m 'Replace October 17 private video 8 with verified public IBM episode'
          git -C history push origin HEAD:refs/heads/shadow-pages-history
          echo 'OCT17_VIDEO8_LIVE_REPLACEMENT_VERIFIED_AND_PERSISTED'
