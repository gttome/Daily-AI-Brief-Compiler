name: oct7-reader-interaction-probe

on:
  push:
    branches:
      - 'implementation/oct7-reader-interaction-verification'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe valid live feedback interactions
        run: node scripts/probe-feedback-service.mjs
