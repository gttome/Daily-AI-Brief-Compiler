name: reader-parity-e2e-development

on:
  push:
    branches:
      - 'implementation/reader-parity-v2-pr3-8-runtime'

permissions:
  contents: read
  pages: read

jobs:
  oct7-reader-parity-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check out sealed October 7 semantic execution read-only
        run: |
          git fetch origin shadow/2026-10-07:shadow/2026-10-07
          git worktree add run shadow/2026-10-07
      - name: Compile same sealed October 7 bundle into canonical reader source
        run: |
          node compiler/compile.mjs \
            --state run/shadow-runs/2026-10-07/compiler-state.json \
            --bundle run/shadow-runs/2026-10-07/edition-bundle.json \
            --out build/reader-source \
            --repo-root run
      - uses: actions/configure-pages@v5
      - name: Build with the GitHub Pages Jekyll builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./build/reader-source
          destination: ./build/site
      - name: Verify exact built reader surfaces
        run: node scripts/verify-built-reader.mjs build/site build/reader-source build/built-verification.json
      - name: Prove no semantic rework
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('build/reader-source/compile-receipt.json','utf8'));
          if(r.source_manifest.semantic_rework!==0) process.exit(1);
          if(r.source_manifest.accepted_image_regenerations!==0) process.exit(1);
          console.log('semantic_rework=0 accepted_image_regenerations=0');
          NODE
