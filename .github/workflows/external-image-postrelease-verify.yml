name: external-image-postrelease-verify
# Manual-only verify/metadata-sync; no new schedule, generation or owner GO.
on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: Already-illustrated edition date
        type: string
        required: true
      expected_history_head:
        description: Exact current Pages history SHA
        type: string
        required: true
      mode:
        description: Nonpublishing verify-only or same-content metadata sync
        type: choice
        options:
          - verify_only
          - sync_metadata
        required: true
        default: verify_only
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily-compiler-pages-deploy
  cancel-in-progress: false
jobs:
  postrelease:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TARGET_DATE: ${{ inputs.edition_date }}
      EXPECTED_HISTORY_HEAD: ${{ inputs.expected_history_head }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require selected flags and exact main/history heads
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$EXPECTED_HISTORY_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
          if [ "$MODE" = sync_metadata ]; then
            node --input-type=module -e "import {readImageProcessVersions} from './scripts/image-process-versions.mjs';let v=readImageProcessVersions();if(v.image_status_sync_mode!=='public_sync_v2'||v.image_verify_only_enabled!==true)process.exit(42)"
          else
            node --input-type=module -e "import {readImageProcessVersions} from './scripts/image-process-versions.mjs';if(readImageProcessVersions().image_verify_only_enabled!==true)process.exit(42)"
          fi
          git fetch origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          test "$(git rev-parse refs/remotes/origin/shadow-pages-history)" = "$EXPECTED_HISTORY_HEAD"
          git worktree add --detach history "$EXPECTED_HISTORY_HEAD"
          test -s "history/site/image-jobs/$TARGET_DATE/release.json"
          test -s "history/site/image-jobs/$TARGET_DATE/job.json"
          test -s "external-image-packages/$TARGET_DATE/manifest.json"
          mkdir -p build/evidence/image-verify-only
      - name: Verify six previously accepted bytes, 12 article pairings and public status
        run: |
          node scripts/verify-external-image-postrelease.mjs \
            "history/site/image-jobs/$TARGET_DATE/job.json" \
            history/site/image-jobs/index.json \
            "history/site/image-jobs/$TARGET_DATE/release.json" \
            "external-image-packages/$TARGET_DATE/manifest.json" \
            build/evidence/image-verify-only/before.json
          node scripts/audit-oct8-live.mjs build/evidence/image-verify-only/oct8-live.json
      - name: Capture optional 24 image-area targets, without claiming semantic review
        shell: bash
        run: |
          set -euo pipefail
          POLICY="$(node --input-type=module -e "import {readImageProcessVersions} from './scripts/image-process-versions.mjs';process.stdout.write(readImageProcessVersions().image_target_capture_policy)")"
          if [[ "$MODE" == sync_metadata && "$TARGET_DATE" > 2026-11-08 && "$POLICY" == element24_v1 ]]; then
            # Metadata-only sync reuses the protected review of the same live
            # image bytes. A missing or mismatched review fails closed.
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {planImageElementTargets} from './scripts/capture-image-element24.mjs';
          const date=process.env.TARGET_DATE,prefix='external-image-packages/'+date+'/';
          const read=path=>JSON.parse(fs.readFileSync(path,'utf8'));
          const job=read('history/site/image-jobs/'+date+'/job.json');
          const release=read('history/site/image-jobs/'+date+'/release.json');
          const manifest=read(prefix+'manifest.json');
          const review=read(prefix+'reviews/live/semantic-pixel-review.json');
          const targets=planImageElementTargets({job,manifest});
          const rows=new Map(review.targets?.map(row=>[row.target_id,row]));
          if(review.schema_version!=='external-image-semantic-pixel-review-v1'||review.edition_date!==date||
             review.result!=='PASS'||review.expected_targets!==24||review.captured_targets!==24||
             review.reviewed_pass!==24||review.defects?.length!==0||review.targets?.length!==24||rows.size!==24||
             release.actions_run_url!=='https://github.com/gttome/Daily-AI-Brief-Compiler/actions/runs/'+review.evidence_source?.workflow_run_id)
            throw Error('protected exact-release visual review required');
          for(const t of targets){
            const row=rows.get(t.target_id);
            const path=prefix+'reviews/live/captures/'+t.target_id.replaceAll(':','--')+'.png';
            if(row?.result!=='PASS'||row.page_url!==t.page_url||row.image_url!==t.image_url||
               row.live_image_sha256!==t.expected_sha256||JSON.stringify(row.viewport_size)!==JSON.stringify(t.viewport_size)||
               row.actual_pixels_inspected!==true||row.correct_story_asset_visible!==true||row.full_diagram_visible!==true||
               row.clipped_or_overlapped!==false||row.placeholder_visible!==false||row.primary_explanatory_labels_recognizable!==true||
               row.inspection_method!=='semantic_pixel_inspection'||
               row.image_pixel_proof?.result!=='PASS'||!Number.isInteger(row.image_pixel_proof.ink_samples)||row.image_pixel_proof.ink_samples<15||
               !Number.isFinite(row.image_pixel_proof.match_ratio)||row.image_pixel_proof.match_ratio<0.82||row.image_pixel_proof.match_ratio>1||
               !/^[a-f0-9]{64}$/.test(row.element_screenshot_sha256||'')||
               row.capture_path!==path)
              throw Error('unverified visual placement: '+t.target_id);
            const bytes=fs.readFileSync(path);
            if(bytes.length!==row.capture_bytes||crypto.createHash('sha256').update(bytes).digest('hex')!==row.capture_sha256)
              throw Error('saved capture bytes changed: '+t.target_id);
          }
          console.log('PROTECTED_24_CONTEXT_REVIEW_REUSED_FOR_METADATA_SYNC');
          NODE
            exit 0
          fi
          if [ "$POLICY" = element24_v1 ]; then
            npm install --no-save playwright-core@1.56.1
            BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
            test -n "$BROWSER"
            CHROME_BINARY="$BROWSER" node scripts/capture-image-element24.mjs \
              "history/site/image-jobs/$TARGET_DATE/job.json" \
              "external-image-packages/$TARGET_DATE/manifest.json" \
              build/evidence/image-verify-only/image-element24
          fi
      - name: Verify history contains accepted images before any metadata redeploy
        if: env.MODE == 'sync_metadata'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {bindAlreadyReleasedJob} from './scripts/verify-external-image-postrelease.mjs';
          const date=process.env.TARGET_DATE;
          const base='https://gttome.github.io/Daily-AI-Brief-Compiler/';
          const history='history/site/';
          const readJSON=path=>JSON.parse(fs.readFileSync(path,'utf8'));
          const {stories}=bindAlreadyReleasedJob({
            jobBytes:fs.readFileSync(history+'image-jobs/'+date+'/job.json'),
            index:readJSON(history+'image-jobs/index.json'),
            release:readJSON(history+'image-jobs/'+date+'/release.json'),
            manifest:readJSON('external-image-packages/'+date+'/manifest.json')
          });
          if(stories.length!==6)throw Error('six accepted image bindings required');
          const relative=url=>{
            if(!url.startsWith(base))throw Error('untrusted image/page origin');
            return new URL(url).pathname.replace(/^\/Daily-AI-Brief-Compiler\//,'');
          };
          const escape=v=>String(v).replace(/[&<>"']/g,c=>({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
          }[c]));
          for(const story of stories){
            const imagePath=relative(story.image_url);
            if(!imagePath.startsWith('briefs/images/'+date+'/'))throw Error('image route escape');
            const bytes=fs.readFileSync(history+imagePath);
            const actual=crypto.createHash('sha256').update(bytes).digest('hex');
            if(bytes.length!==story.image_bytes||actual!==story.image_sha256)
              throw Error('history_image_bytes_not_accepted:'+story.story_id);
            const pages=['briefs/'+date+'/index.html',relative(story.permanent_url)+'index.html'];
            for(const page of pages){
              const html=fs.readFileSync(history+page,'utf8');
              const tags=[...html.matchAll(/<img\b[^>]*>/g)].map(x=>x[0]);
              const matching=tags.filter(x=>x.includes('src="'+story.image_url+'"')&&
                x.includes('alt="'+escape(story.image_alt_text)+'"'));
              if(matching.length!==1||html.includes('Illustration pending for '+story.headline))
                throw Error('history_story_pairing_unverified:'+story.story_id+':'+page);
            }
          }
          console.log('HISTORY_SAFE_TO_REDEPLOY: six exact accepted PNGs, 12 pairings');
          NODE
      - name: Prevent metadata publication from reverting any accepted image
        if: env.MODE == 'sync_metadata'
        run: node scripts/assert-published-image-continuity.mjs history/site history/site
      - name: Verify history has not changed before optional metadata-only redeploy
        if: env.MODE == 'sync_metadata'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$EXPECTED_HISTORY_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
          # Deploy current approved history/site as-is: never restore placeholders.
      - uses: actions/configure-pages@v5
        if: env.MODE == 'sync_metadata'
      - uses: actions/upload-pages-artifact@v3
        if: env.MODE == 'sync_metadata'
        with:
          path: history/site
          name: image-metadata-sync-${{ github.run_id }}
      - id: deployment
        if: env.MODE == 'sync_metadata'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: image-metadata-sync-${{ github.run_id }}
      - name: Verify metadata and live assets again after optional deployment
        if: env.MODE == 'sync_metadata'
        shell: bash
        run: |
          set -euo pipefail
          result=1
          for attempt in $(seq 1 15); do
            if node scripts/verify-external-image-postrelease.mjs \
              "history/site/image-jobs/$TARGET_DATE/job.json" \
              history/site/image-jobs/index.json \
              "history/site/image-jobs/$TARGET_DATE/release.json" \
              "external-image-packages/$TARGET_DATE/manifest.json" \
              build/evidence/image-verify-only/after.json \
              && node -e "let a=require('./build/evidence/image-verify-only/after.json');if(a.public_status.result!=='PUBLIC_STATUS_VERIFIED')process.exit(1)"; then
              result=0
              break
            fi
            echo "IMAGE_PUBLIC_METADATA_PROPAGATION_PENDING attempt=$attempt/15; public receipt may still be propagating"
            if [ "$attempt" -lt 15 ]; then sleep 12; fi
          done
          if [ "$result" -ne 0 ]; then
            echo "::error::PUBLIC_STATUS_SYNC_INCOMPLETE; accepted image bytes are not a metadata PASS"
            test ! -s build/evidence/image-verify-only/after.json || cat build/evidence/image-verify-only/after.json
            exit 1
          fi
          node scripts/audit-oct8-live.mjs build/evidence/image-verify-only/oct8-after-sync.json
          echo "PUBLIC_STATUS_AND_ALL_17_PROTECTED_OCT8_BYTES_VERIFIED_AFTER_SYNC"
      - name: Archive factual verification-only and public-sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-image-postrelease-verify-evidence
          path: build/evidence/image-verify-only/
          retention-days: 30
          if-no-files-found: warn
