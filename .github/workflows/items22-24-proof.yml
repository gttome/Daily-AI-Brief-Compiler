name: items22-24-no-rework-proof

on:
  push:
    branches:
      - proof/items22-24-no-rework
    paths:
      - 'proof/items22-24/verify.mjs'
      - '.github/workflows/items22-24-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: items22-24-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact completed rehearsal
        run: git fetch origin '+refs/heads/rehearsal/full-six-story-v1:refs/remotes/origin/rehearsal/full-six-story-v1'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove items 22-24 without semantic rework
        run: node proof/items22-24/verify.mjs
      - name: Persist proof receipt
        run: |
          git config user.name "Daily Compiler Proof"
          git config user.email "actions@users.noreply.github.com"
          git add proof/items22-24/result.json
          if git diff --cached --quiet; then
            echo "Receipt already current"
            exit 0
          fi
          git commit -m "Record items 22-24 no-rework proof"
          git push origin HEAD:"${GITHUB_REF_NAME}"
