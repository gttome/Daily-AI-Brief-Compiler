name: bundle-ready-signal

on:
  push:
    branches:
      - 'shadow/**'
    paths:
      - 'shadow-runs/**/compiler-state.json'
      - 'shadow-runs/**/edition-bundle.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-ready-signal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: ready
        run: node scripts/check-current-shadow-ready.mjs >> "$GITHUB_OUTPUT"
      - id: media_history
        name: Reject previously published media using full history for Oct26+
        if: steps.ready.outputs.ready == 'true'
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_DATE" < "2026-10-19" ]]; then exit 0; fi
          git fetch origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          git worktree add --detach media-history refs/remotes/origin/shadow-pages-history
          node scripts/verify-media-freshness.mjs \
            "shadow-runs/$TARGET_DATE/edition-bundle.json" media-history/site
      - id: video_playback
        name: Check signed-out advancing public video playback before reader dispatch
        if: steps.ready.outputs.ready == 'true'
        env:
          TARGET_DATE: ${{ steps.ready.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_DATE" < "2026-10-21" ]]; then echo "Historical video unchanged"; exit 0; fi
          npm install --prefix /tmp/browser --no-audit --no-fund playwright-core@1.51.1 >/dev/null
          node scripts/verify-selected-video-playback.cjs "shadow-runs/$TARGET_DATE/edition-bundle.json" build/video-prepublish-playback.json
      - id: signal_dispatch
        name: Signal protected-main compiler
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.ready.outputs.branch }}
          TARGET_DATE: ${{ steps.ready.outputs.date }}
          BUNDLE_DIGEST: ${{ steps.ready.outputs.bundle_digest }}
        run: |
          printf '{"event_type":"daily-compiler-bundle-ready","client_payload":{"branch":"%s","date":"%s","bundle_digest":"%s"}}'             "$TARGET_BRANCH" "$TARGET_DATE" "$BUNDLE_DIGEST" |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
      - name: Persist failed gate for same-edition authorized recovery (no new agent)
        if: ${{ failure() && startsWith(github.ref, 'refs/heads/shadow/') }}
        shell: bash
        env:
          FAILED_STAGE: ${{ steps.video_playback.outcome == 'failure' && 'VIDEO_PLAYBACK' || steps.media_history.outcome == 'failure' && 'MEDIA_HISTORY' || steps.ready.outcome == 'failure' && 'SOURCE_READY' || 'DISPATCH_FAILED' }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in shadow/20??-??-??) ;; *) exit 0 ;; esac
          date="${GITHUB_REF_NAME#shadow/}"
          node scripts/record-publication-health.mjs \
            "shadow-runs/$date/publication-health.json" "$date" BLOCKED_PUBLICATION \
            "$FAILED_STAGE" "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$FAILED_STAGE" = VIDEO_PLAYBACK ] && test -s build/video-prepublish-playback.json; then
            node scripts/record-video-playback-failure.mjs \
              build/video-prepublish-playback.json "$date" \
              "shadow-runs/$date/editorial/video-playback-failure.json" PREPUBLISH_SIGNAL || \
              echo "Video diagnostic unavailable; original failed gate is still recorded"
          fi
          git config user.name "Daily Brief Publication Health"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "shadow-runs/$date/publication-health.json"
          if test -s "shadow-runs/$date/editorial/video-playback-failure.json"; then
            git add "shadow-runs/$date/editorial/video-playback-failure.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record actual blocked publishing gate $FAILED_STAGE"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
