name: bundle-ready-signal

on:
  push:
    branches:
      - 'shadow/**'
    paths:
      - 'shadow-runs/**/compiler-state.json'
      - 'shadow-runs/**/edition-bundle.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-ready-signal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: ready
        name: Read exact semantic input using protected-main code
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          EXPECTED_SEMANTIC_COMMIT: ${{ github.sha }}
        run: |
          if [[ ! "$TARGET_BRANCH" =~ ^shadow/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git worktree add --detach run "refs/remotes/origin/$TARGET_BRANCH"
          node scripts/check-current-shadow-ready.mjs "$TARGET_BRANCH" run --require-remote-head >> "$GITHUB_OUTPUT"
      - name: Signal protected-main compiler
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.ready.outputs.branch }}
          TARGET_DATE: ${{ steps.ready.outputs.date }}
          BUNDLE_DIGEST: ${{ steps.ready.outputs.bundle_digest }}
          ENGINE_SHA: ${{ steps.ready.outputs.engine_sha }}
          SEMANTIC_COMMIT: ${{ steps.ready.outputs.semantic_commit }}
        run: |
          node --input-type=module -e 'const e=process.env; process.stdout.write(JSON.stringify({event_type:"daily-compiler-bundle-ready",client_payload:{branch:e.TARGET_BRANCH,date:e.TARGET_DATE,bundle_digest:e.BUNDLE_DIGEST,engine_sha:e.ENGINE_SHA,semantic_commit:e.SEMANTIC_COMMIT}}))' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
