name: oct10-premium-figure-full-resolution-viewer-one-time
# Exactly one protected merge may activate this bounded, non-image-generating release.
on:
  push:
    branches: [main]
    paths:
      - docs/image-process/_one_time_oct10_mobile_viewer_release.json
permissions:
  contents: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: daily-compiler-pages-deploy
  cancel-in-progress: false
jobs:
  reader-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      DATE: '2026-10-10'
      HISTORY_HEAD: '0730acb060f9bb31ea664f33e609e7c98fb914ca'
      ORIGINAL_JOB_SHA256: '15301d33191ad1e04eb8bba0ce9f40a5ac53809bdcc363f1647bce5f97b2749e'
      REQUEST_FILE: docs/image-process/_one_time_oct10_mobile_viewer_release.json
      EVIDENCE_DIR: build/evidence/mobile-viewer-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require exact protected owner-approved PR, source/main, and no-bypass CI
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          jq -e --arg original 'f1138a22e3ee3a47c3a9172a594de44720d20ed9' \
            --arg hist "$HISTORY_HEAD" --arg digest "$ORIGINAL_JOB_SHA256" \
            '.schema_version=="oct10-premium-figure-mobile-viewer-release-request-v1" and
             .edition_date=="2026-10-10" and .request_kind=="one_time_protected_main_merge_only" and
             .source_main_before_request==$original and .expected_history_sha==$hist and
             .immutable_job_sha256==$digest and .expected_allowed_file_count==9 and
             .source_image_regeneration_prohibited==true and
             .original_editorial_source_recompile_prohibited==true and
             .preserve_oct8_protected_count==17 and .require_live_twelve_zoom_controls==true' \
            "$REQUEST_FILE" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/rulesets/24610983" |
            jq -e '.enforcement=="active" and (.bypass_actors|length)==0 and
              any(.rules[]; .type=="pull_request") and
              any(.rules[]; .type=="required_status_checks")' > /dev/null
          PR_HEAD="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -er --arg merged "$GITHUB_SHA" '[.[]|select(.merged_at!=null and .base.ref=="main" and .merge_commit_sha==$merged)|.head.sha][0]')"
          [[ "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=pull_request&per_page=100" |
            jq -e --arg head "$PR_HEAD" '.workflow_runs|any(.head_sha==$head and .name=="compiler-validation" and .conclusion=="success")' > /dev/null
          test -s scripts/verify-live-premium-mobile-zoom.mjs
          test -s scripts/stage-published-mobile-zoom.mjs
          mkdir -p "$EVIDENCE_DIR"
      - name: Require exact historical production tree, unchanged accepted images and existing completed release receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          test "$(git rev-parse refs/remotes/origin/shadow-pages-history)" = "$HISTORY_HEAD"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
          git worktree add --detach history "$HISTORY_HEAD"
          jq -e --arg hash "$ORIGINAL_JOB_SHA256" \
            '.result=="RELEASED_VERIFIED" and .edition_date=="2026-10-10" and .immutable_job_sha256==$hash' \
            "history/site/image-jobs/$DATE/release.json" > /dev/null
          jq -e --arg hash "$ORIGINAL_JOB_SHA256" \
            '.editions|any(.edition_date=="2026-10-10" and .status=="RELEASED_VERIFIED" and .job_sha256==$hash)' \
            history/site/image-jobs/index.json > /dev/null
          node scripts/verify-external-image-postrelease.mjs \
            "history/site/image-jobs/$DATE/job.json" history/site/image-jobs/index.json \
            "history/site/image-jobs/$DATE/release.json" "external-image-packages/$DATE/manifest.json" \
            "$EVIDENCE_DIR/before.json"
          node --input-type=module -e "import fs from 'node:fs';let a=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/before.json'));if(a.result!=='LIVE_SIX_IMAGE_BYTES_AND_BINDINGS_PASS'||a.live_images?.length!==6||a.article_contexts?.length!==12||a.public_status?.result!=='PUBLIC_STATUS_VERIFIED')process.exit(42)"
          node scripts/audit-oct8-live.mjs "$EVIDENCE_DIR/oct8-before.json"
      - name: Stage exact seven Oct10 HTML pages and two reader assets; never rebuild published art
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-published-mobile-zoom.mjs history/site build/mobile-site "$EVIDENCE_DIR/staging.json"
          node --input-type=module -e "import fs from 'node:fs';const a=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/staging.json'));if(a.result!=='STAGED_ONLY_NOT_PUBLISHED'||a.allowed_changed_paths?.length!==9||a.reader_routes?.length!==7||a.six_accepted_png_sha256s?.length!==6||a.protected_oct8_objects!==17||a.accepted_pngs_regenerated!==0)process.exit(43)"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/mobile-site
          name: single-accepted-oct10-figure-viewer-${{ github.run_id }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: single-accepted-oct10-figure-viewer-${{ github.run_id }}
      - name: Real public nine-object readback and twelve live mobile full-resolution zooms
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core@1.56.1
          CHROME_BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BINARY"
          export CHROME_BINARY
          good=1
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-live-premium-mobile-zoom.mjs \
                "$EVIDENCE_DIR/staging.json" build/mobile-site "$EVIDENCE_DIR"; then
              good=0
              break
            fi
            sleep 15
          done
          test "$good" -eq 0
          node scripts/verify-external-image-postrelease.mjs \
            "history/site/image-jobs/$DATE/job.json" history/site/image-jobs/index.json \
            "history/site/image-jobs/$DATE/release.json" "external-image-packages/$DATE/manifest.json" \
            "$EVIDENCE_DIR/after.json"
          node --input-type=module -e "import fs from 'node:fs';let a=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/after.json'));if(a.result!=='LIVE_SIX_IMAGE_BYTES_AND_BINDINGS_PASS'||a.live_images?.length!==6||a.article_contexts?.length!==12||a.public_status?.result!=='PUBLIC_STATUS_VERIFIED')process.exit(44)"
          node scripts/audit-oct8-live.mjs "$EVIDENCE_DIR/oct8-after.json"
          node --input-type=module -e "import fs from 'node:fs';let a=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/oct8-after.json'));let b=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/oct8-before.json'));if(a.objects_verified!==17||JSON.stringify(a.objects.map(x=>[x.route,x.sha256,x.bytes]))!==JSON.stringify(b.objects.map(x=>[x.route,x.sha256,x.bytes])))process.exit(45)"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          echo "NINE_READER_OBJECTS_TWELVE_FULLSIZE_VIEWERS_SIX_PNGS_TWELVE_PAIRS_OCT8_17_VERIFIED"
      - name: Preserve exact verified public nine-file patch in append-only Pages history
        shell: bash
        run: |
          set -euo pipefail
          git -C history config user.name "Daily Compiler"
          git -C history config user.email "actions@users.noreply.github.com"
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';let r=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/staging.json'));for(let p of r.allowed_changed_paths){if(p.includes('..')||p.startsWith('/')||!fs.existsSync(path.join('build/mobile-site',p)))throw Error('invalid_path:'+p);fs.mkdirSync(path.dirname(path.join('history/site',p)),{recursive:true});fs.copyFileSync(path.join('build/mobile-site',p),path.join('history/site',p));}"
          git -C history add site
          git -C history diff --cached --name-only -z > "$EVIDENCE_DIR/staged-paths.bin"
          node --input-type=module -e "import fs from 'node:fs';let r=JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR+'/staging.json'));let actual=fs.readFileSync(process.env.EVIDENCE_DIR+'/staged-paths.bin','utf8').split('\0').filter(Boolean).sort();let want=r.allowed_changed_paths.map(x=>'site/'+x).sort();if(actual.length!==9||JSON.stringify(actual)!==JSON.stringify(want))throw Error('unexpected_history_diff:'+JSON.stringify(actual));"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          git -C history commit -m "Preserve scoped Oct10 full-resolution reader on all six published figures"
          git -C history push origin HEAD:shadow-pages-history
          FINAL_HISTORY_SHA="$(git -C history rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$FINAL_HISTORY_SHA"
          printf '%s\n' "$FINAL_HISTORY_SHA" > "$EVIDENCE_DIR/final-history-sha.txt"
          echo "READ_ONLY_ACCEPTED_PNGS_PRESERVED_NINE_READER_ASSETS_COMMITTED_TO_CUMULATIVE_HISTORY"
      - name: Preserve factual evidence (never certify inline mobile text as readable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oct10-premium-mobile-viewer-live-evidence
          path: |
            build/evidence/mobile-viewer-release/staging.json
            build/evidence/mobile-viewer-release/before.json
            build/evidence/mobile-viewer-release/after.json
            build/evidence/mobile-viewer-release/oct8-before.json
            build/evidence/mobile-viewer-release/oct8-after.json
            build/evidence/mobile-viewer-release/live-zoom-verify.json
            build/evidence/mobile-viewer-release/live-mobile-*.png
            build/evidence/mobile-viewer-release/final-history-sha.txt
          retention-days: 30
          if-no-files-found: warn
