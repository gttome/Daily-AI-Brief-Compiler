name: oct10-existing-images-one-time-public-status-sync
# One-shot PR-gated operational repair; NOT a schedule, image-production lane,
# placeholder replacement, or new image-release trigger.
on:
  push:
    branches: [main]
    paths:
      - docs/image-process/_one_time_oct10_public_metadata_sync.json
permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: daily-compiler-pages-deploy
  cancel-in-progress: false
jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      DATE: '2026-10-10'
      HISTORY_SHA: '0730acb060f9bb31ea664f33e609e7c98fb914ca'
      JOB_SHA256: '15301d33191ad1e04eb8bba0ce9f40a5ac53809bdcc363f1647bce5f97b2749e'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require real protected PR/CI, exact heads and one-time request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          jq -e --arg sha "$HISTORY_SHA" --arg job "$JOB_SHA256" --arg prior '8e821afc12d8cbf31c7b4d80af1d04c2b4ed918e' \
            '.schema_version=="external-image-one-time-existing-pages-metadata-sync-v1" and
             .edition_date=="2026-10-10" and .pages_history_commit==$sha and
             .original_job_sha256==$job and .source_main_before_request==$prior and
             .only_site_output=="IDENTICAL_CURRENT_HISTORY_SITE_BYTES" and
             (.excludes|index("new_image_generation")!=null)' \
            docs/image-process/_one_time_oct10_public_metadata_sync.json > /dev/null
          node --input-type=module -e "import {readImageProcessVersions} from './scripts/image-process-versions.mjs';let v=readImageProcessVersions();if(v.image_release_authority_policy!=='bounded_starter_v7'||v.image_starter_contract_version!=='rev7'||v.image_status_sync_mode!=='public_sync_v2'||v.image_verify_only_enabled!==true)process.exit(41)"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/24610983" |
            jq -e '.enforcement=="active" and (.bypass_actors|length)==0 and
              any(.rules[]; .type=="pull_request") and
              any(.rules[]; .type=="required_status_checks")' > /dev/null
          PR_HEAD="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -er --arg merge "$GITHUB_SHA" '[.[]|select(.merged_at!=null and .base.ref=="main" and .merge_commit_sha==$merge)|.head.sha][0]')"
          [[ "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=pull_request&per_page=100" |
            jq -e --arg head "$PR_HEAD" '.workflow_runs|any(.head_sha==$head and .name=="compiler-validation" and .conclusion=="success")' > /dev/null
      - name: Pin current already-published Pages history, never change it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          test "$(git rev-parse refs/remotes/origin/shadow-pages-history)" = "$HISTORY_SHA"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_SHA"
          git worktree add --detach history "$HISTORY_SHA"
          test -s "history/site/image-jobs/$DATE/job.json"
          test -s "history/site/image-jobs/$DATE/release.json"
          test -s history/site/image-jobs/index.json
          test -s "external-image-packages/$DATE/manifest.json"
          jq -e --arg sha "$JOB_SHA256" '.immutable_job_sha256==$sha and .result=="RELEASED_VERIFIED" and .edition_date=="2026-10-10"' \
            "history/site/image-jobs/$DATE/release.json" > /dev/null
          jq -e --arg sha "$JOB_SHA256" '.editions|any(.edition_date=="2026-10-10" and .job_sha256==$sha and .status=="RELEASED_VERIFIED")' \
            history/site/image-jobs/index.json > /dev/null
          mkdir -p build/evidence/one-time-oct10-status-sync
      - name: Independently verify six live hashes and paired pages BEFORE any Pages upload
        run: |
          node scripts/verify-external-image-postrelease.mjs \
            "history/site/image-jobs/$DATE/job.json" history/site/image-jobs/index.json \
            "history/site/image-jobs/$DATE/release.json" "external-image-packages/$DATE/manifest.json" \
            build/evidence/one-time-oct10-status-sync/before.json
          node scripts/audit-oct8-live.mjs build/evidence/one-time-oct10-status-sync/oct8-before.json
      - name: Abort on any history/main race before deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: history/site
          name: exact-current-history-oct10-metadata-${{ github.run_id }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: exact-current-history-oct10-metadata-${{ github.run_id }}
      - name: Independently verify PUBLIC_STATUS_VERIFIED, same six PNG hashes, twelve pairings and 17 October8 pins
        shell: bash
        run: |
          set -euo pipefail
          result=1
          for n in 1 2 3 4 5 6 7 8; do
            node scripts/verify-external-image-postrelease.mjs \
              "history/site/image-jobs/$DATE/job.json" history/site/image-jobs/index.json \
              "history/site/image-jobs/$DATE/release.json" "external-image-packages/$DATE/manifest.json" \
              build/evidence/one-time-oct10-status-sync/after.json
            if node -e "const f=require('./build/evidence/one-time-oct10-status-sync/after.json');if(f.public_status.result!=='PUBLIC_STATUS_VERIFIED'||f.live_images?.length!==6||f.article_contexts?.length!==12||f.placeholder_replacement_invocations!==0||f.accepted_image_regenerations!==0)process.exit(1)"; then
              result=0
              break
            fi
            sleep 15
          done
          test "$result" -eq 0
          node scripts/audit-oct8-live.mjs build/evidence/one-time-oct10-status-sync/oct8-after.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=JSON.parse(fs.readFileSync('build/evidence/one-time-oct10-status-sync/oct8-before.json'));
          const a=JSON.parse(fs.readFileSync('build/evidence/one-time-oct10-status-sync/oct8-after.json'));
          const tuple=o=>o.objects.map(x=>[x.route,x.sha256,x.bytes]);
          if(a.objects_verified!==17||JSON.stringify(tuple(a))!==JSON.stringify(tuple(b)))throw Error('oct8_bytes_changed');
          console.log('PUBLIC_STATUS_VERIFIED_SIX_IMAGES_TWELVE_PAIRS_OCT8_17_UNCHANGED');
          NODE
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_SHA"
      - name: Preserve authentic before/after and unchanged-history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-oct10-public-metadata-one-time
          path: build/evidence/one-time-oct10-status-sync/
          retention-days: 30
          if-no-files-found: warn
