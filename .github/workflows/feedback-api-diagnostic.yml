name: feedback-api-diagnostic
on:
  push:
    branches: ['implementation/feedback-api-diagnostic']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public feedback service without recording data
        shell: bash
        run: |
          set -u
          API=https://daily-ai-brief-ratings.gtome.chatgpt.site/api
          for route in watchlist comments ratings; do
            echo "=== OPTIONS $route ==="
            curl -sS -i -X OPTIONS "$API/$route"               -H 'Origin: https://gttome.github.io'               -H 'Access-Control-Request-Method: POST'               -H 'Access-Control-Request-Headers: content-type,x-operation-id' | sed -n '1,30p'
          done
          echo "=== GET watchlist ==="
          curl -sS -i "$API/watchlist" -H 'Origin: https://gttome.github.io' | sed -n '1,40p'
          echo "=== ratings GET known production item ==="
          curl -sS -i "$API/ratings?brief_date=2026-10-06&item_id=dab-story-2026-10-06-m01" -H 'Origin: https://gttome.github.io' | sed -n '1,40p'
          echo "=== ratings GET compiler item ==="
          curl -sS -i "$API/ratings?brief_date=2026-10-07&item_id=dab-story-2026-10-07-dots-always-on-agents" -H 'Origin: https://gttome.github.io' | sed -n '1,40p'
          echo "=== watchlist GET compiler topic query ==="
          curl -sS -i "$API/watchlist?topic_id=dab-topic-compiler-enterprise-context-becomes-the-agent-battleground" -H 'Origin: https://gttome.github.io' | sed -n '1,50p'
          echo "=== comments GET compiler item ==="
          curl -sS -i "$API/comments?brief_date=2026-10-07&item_id=dab-story-2026-10-07-dots-always-on-agents" -H 'Origin: https://gttome.github.io' | sed -n '1,40p'
