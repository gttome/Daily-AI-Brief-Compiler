name: watchlist-alias-live-trigger-development

on:
  push:
    branches:
      - 'implementation/watchlist-alias-live-trigger-oct7'

permissions:
  contents: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch sealed October 7 reader-only rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' '{"event_type":"daily-compiler-bundle-ready","client_payload":{"branch":"shadow/2026-10-07","date":"2026-10-07","bundle_digest":"a158a3b465edebc5b0ef758c5f0c225a0709aed06d443cfeea95d8fdacf3df51","reader_rebuild":true}}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
