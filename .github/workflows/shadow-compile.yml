name: shadow-compile

on:
  repository_dispatch:
    types:
      - daily-compiler-bundle-ready
  workflow_dispatch:
    inputs:
      branch:
        description: 'Existing shadow/YYYY-MM-DD branch to compile'
        required: true
        type: string
      reader_rebuild:
        description: 'Allow deterministic reader-only rebuild of an already verified sealed edition'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-compiler-pages-deploy
  cancel-in-progress: false

jobs:
  compile-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TARGET_BRANCH: ${{ github.event.client_payload.branch || inputs.branch }}
      EXPECTED_DIGEST: ${{ github.event.client_payload.bundle_digest || '' }}
      READER_REBUILD: ${{ github.event.client_payload.reader_rebuild || inputs.reader_rebuild || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate target identity
        run: |
          case "$TARGET_BRANCH" in
            shadow/2026-10-09-owner-placeholder-20261009)
              echo "TARGET_DATE=2026-10-09" >> "$GITHUB_ENV"
              echo "ONE_TIME_OWNER_RECOVERY=true" >> "$GITHUB_ENV"
              ;;
            shadow/????-??-??)
              echo "TARGET_DATE=${TARGET_BRANCH#shadow/}" >> "$GITHUB_ENV"
              ;;
            *) echo "Invalid shadow branch: $TARGET_BRANCH"; exit 1 ;;
          esac
      - name: Check out exact semantic branch as worktree
        run: |
          git fetch origin "$TARGET_BRANCH:$TARGET_BRANCH"
          git worktree add run "$TARGET_BRANCH"
      - name: Require sealed semantic bundle without rework
        run: |
          EXTRA=""
          if [ "$READER_REBUILD" = "true" ]; then EXTRA="--allow-verified"; fi
          node scripts/check-current-shadow-ready.mjs "$TARGET_BRANCH" run $EXTRA > ready.txt
          cat ready.txt
          grep -q '^ready=true$' ready.txt
          if [ -n "$EXPECTED_DIGEST" ]; then
            grep -q "^bundle_digest=$EXPECTED_DIGEST$" ready.txt
          fi
      - name: Materialize canonical production reader from sealed bundle
        run: |
          rm -rf build
          mkdir -p build
          node compiler/compile.mjs \
            --state "run/shadow-runs/$TARGET_DATE/compiler-state.json" \
            --bundle "run/shadow-runs/$TARGET_DATE/edition-bundle.json" \
            --out build/reader-source \
            --repo-root run \
            --allow-pending-images true \
            --release1-production true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build canonical reader with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./build/reader-source
          destination: ./build/current
      - name: Verify built reader parity surfaces
        run: node scripts/verify-built-reader.mjs build/current build/reader-source build/built-verification.json
      - name: Restore previously verified permanent pages
        run: |
          if git ls-remote --exit-code --heads origin shadow-pages-history >/dev/null 2>&1; then
            git fetch origin shadow-pages-history:shadow-pages-history
            git worktree add history shadow-pages-history
            echo "HISTORY_EXISTS=true" >> "$GITHUB_ENV"
            echo "HISTORY_DIR=history/site" >> "$GITHUB_ENV"
          else
            echo "HISTORY_EXISTS=false" >> "$GITHUB_ENV"
            echo "HISTORY_DIR=-" >> "$GITHUB_ENV"
          fi
      - name: Preserve missing prior permanent pages without rewriting canonical reader
        run: node scripts/merge-shadow-history.mjs "$HISTORY_DIR" build/current build/shadow "$TARGET_DATE" build/history-merge-receipt.json
      - name: Fail closed if October 8 local or currently live historical bytes drift
        run: |
          IMAGE_MODE="$(node -p "require('./build/reader-source/build-manifest.json').image_representation")"
          if [ "$IMAGE_MODE" = 'images_pending' ]; then
            node scripts/verify-publication-preservation.mjs preflight "$HISTORY_DIR" build/shadow build/reader-source/build-manifest.json 'https://gttome.github.io/Daily-AI-Brief-Compiler/' build/prepublish-integrity.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/shadow
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact live canonical reader
        run: node scripts/verify-live.mjs "${{ steps.deployment.outputs.page_url }}" "$TARGET_DATE" build/reader-source build/shadow build/live-verification.json
      - name: Independently verify every new public page plus all 17 preserved October 8 objects
        run: |
          IMAGE_MODE="$(node -p "require('./build/reader-source/build-manifest.json').image_representation")"
          if [ "$IMAGE_MODE" = 'images_pending' ]; then
            node scripts/verify-publication-preservation.mjs postdeploy "$HISTORY_DIR" build/shadow build/reader-source/build-manifest.json "${{ steps.deployment.outputs.page_url }}" build/postpublish-integrity.json
          fi
      - name: Persist parity receipts on the same semantic execution
        run: |
          node scripts/finalize-shadow-state.mjs run "$TARGET_DATE" "${{ steps.deployment.outputs.page_url }}"
          git -C run config user.name "Daily Compiler"
          git -C run config user.email "actions@users.noreply.github.com"
          git -C run add "shadow-runs/$TARGET_DATE"
          if git -C run diff --cached --quiet; then
            echo "Shadow receipts already current"
          else
            git -C run commit -m "Verify canonical reader parity for shadow edition $TARGET_DATE"
            git -C run push origin HEAD:"$TARGET_BRANCH"
          fi
      - name: Nonblocking post-verification external image-job discovery (zero image dependency)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_MODE="$(node -p "require('./build/reader-source/build-manifest.json').image_representation")"
          if [ "$IMAGE_MODE" != 'images_pending' ]; then
            echo "No external image job: already illustrated edition"
            exit 0
          fi
          test -s build/postpublish-integrity.json
          SOURCE_COMMIT="$(git -C run rev-parse HEAD)"
          mkdir -p build/external-work-postverify
          node scripts/external-image-jobs.mjs \
            "run/shadow-runs/$TARGET_DATE/edition-bundle.json" \
            "run/shadow-runs/$TARGET_DATE/compiler-state.json" \
            "$SOURCE_COMMIT" \
            build/postpublish-integrity.json \
            "$HISTORY_DIR" \
            build/external-work-postverify/image-jobs
          test -s build/external-work-postverify/image-jobs/index.json
          test -s "build/external-work-postverify/image-jobs/$TARGET_DATE/job.json"
          cp -a build/external-work-postverify/image-jobs build/shadow/
          echo "PUBLIC_SAFE_IMAGE_JOB_PREPARED_AFTER_VERIFIED_RELEASE $TARGET_DATE $SOURCE_COMMIT"
      - name: Persist cumulative verified reader history
        run: |
          if [ "$HISTORY_EXISTS" = "true" ]; then
            rm -rf history/site
            mkdir -p history/site
            cp -a build/shadow/. history/site/
          else
            git worktree add --detach history main
            git -C history switch --orphan shadow-pages-history
            git -C history rm -rf . >/dev/null 2>&1 || true
            mkdir -p history/site
            cp -a build/shadow/. history/site/
          fi
          git -C history config user.name "Daily Compiler"
          git -C history config user.email "actions@users.noreply.github.com"
          git -C history add site
          if git -C history diff --cached --quiet; then
            echo "Permanent reader history already current"
            exit 0
          fi
          git -C history commit -m "Preserve canonical shadow reader through $TARGET_DATE"
          git -C history push origin HEAD:shadow-pages-history
