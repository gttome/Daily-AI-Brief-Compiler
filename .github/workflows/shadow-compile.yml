name: shadow-compile

on:
  repository_dispatch:
    types:
      - daily-compiler-bundle-ready
  workflow_dispatch:
    inputs:
      branch:
        description: 'Existing shadow/YYYY-MM-DD branch to compile'
        required: true
        type: string
      reader_rebuild:
        description: 'Allow deterministic reader-only rebuild of an already verified sealed edition'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-compiler-pages-deploy
  cancel-in-progress: false

jobs:
  compile-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TARGET_BRANCH: ${{ github.event.client_payload.branch || inputs.branch }}
      EXPECTED_DIGEST: ${{ github.event.client_payload.bundle_digest || '' }}
      EXPECTED_ENGINE_SHA: ${{ github.event.client_payload.engine_sha || '' }}
      EXPECTED_SEMANTIC_COMMIT: ${{ github.event.client_payload.semantic_commit || '' }}
      TRIGGER_EVENT: ${{ github.event_name }}
      READER_REBUILD: ${{ github.event.client_payload.reader_rebuild || inputs.reader_rebuild || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate target identity
        run: |
          [[ "$TARGET_BRANCH" =~ ^shadow/[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'Invalid shadow branch'; exit 1; }
          if [ "$TRIGGER_EVENT" = 'repository_dispatch' ]; then
            [[ "$EXPECTED_ENGINE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Exact dispatch engine SHA required'; exit 1; }
            [[ "$EXPECTED_SEMANTIC_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo 'Exact dispatch semantic commit required'; exit 1; }
            [[ "$EXPECTED_DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo 'Exact dispatch bundle digest required'; exit 1; }
          fi
          echo "TARGET_DATE=${TARGET_BRANCH#shadow/}" >> "$GITHUB_ENV"
      - name: Read semantic branch as data in an exact detached worktree
        run: |
          git fetch origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git worktree add --detach run "refs/remotes/origin/$TARGET_BRANCH"
      - name: Select immutable engine using protected-main bootstrap
        id: engine
        run: |
          EXTRA=()
          if [ "$READER_REBUILD" = 'true' ]; then EXTRA+=(--allow-verified); fi
          node scripts/check-current-shadow-ready.mjs "$TARGET_BRANCH" run "${EXTRA[@]}" \
            --require-remote-head --write-binding "$RUNNER_TEMP/value-engine-binding.json" > "$RUNNER_TEMP/value-ready.txt"
          cat "$RUNNER_TEMP/value-ready.txt"
          grep -q '^ready=true$' "$RUNNER_TEMP/value-ready.txt"
          cat "$RUNNER_TEMP/value-ready.txt" >> "$GITHUB_OUTPUT"
      - name: Execute the selected protected release engine
        env:
          ENGINE_SHA: ${{ steps.engine.outputs.engine_sha }}
        run: |
          git checkout --detach "$ENGINE_SHA"
          node --input-type=module -e 'import fs from "node:fs"; import {verifyReleaseEngineHandoff} from "./operations/release-engine.mjs"; verifyReleaseEngineHandoff({binding:JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/value-engine-binding.json","utf8")),semanticRoot:"run",branch:process.env.TARGET_BRANCH,allowVerified:process.env.READER_REBUILD==="true"});'
      - name: Materialize canonical production reader from sealed bundle
        run: |
          rm -rf build
          mkdir -p build
          node compiler/compile.mjs \
            --state "run/shadow-runs/$TARGET_DATE/compiler-state.json" \
            --bundle "run/shadow-runs/$TARGET_DATE/edition-bundle.json" \
            --out build/reader-source \
            --repo-root run \
            --release-binding "$RUNNER_TEMP/value-engine-binding.json"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build canonical reader with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./build/reader-source
          destination: ./build/current
      - name: Verify built reader parity surfaces
        run: node scripts/verify-built-reader.mjs build/current build/reader-source build/built-verification.json
      - name: Restore previously verified permanent pages
        run: |
          if git ls-remote --exit-code --heads origin shadow-pages-history >/dev/null 2>&1; then
            git fetch origin shadow-pages-history:shadow-pages-history
            git worktree add history shadow-pages-history
            echo "HISTORY_EXISTS=true" >> "$GITHUB_ENV"
            echo "HISTORY_DIR=history/site" >> "$GITHUB_ENV"
          else
            echo "HISTORY_EXISTS=false" >> "$GITHUB_ENV"
            echo "HISTORY_DIR=-" >> "$GITHUB_ENV"
          fi
      - name: Preserve missing prior permanent pages without rewriting canonical reader
        run: node scripts/merge-shadow-history.mjs "$HISTORY_DIR" build/current build/shadow "$TARGET_DATE" build/history-merge-receipt.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/shadow
      - name: Recheck exact semantic head immediately before deployment
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {verifyReleaseEngineHandoff,assertCompiledEngineReceipt} from "./operations/release-engine.mjs"; const binding=verifyReleaseEngineHandoff({binding:JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/value-engine-binding.json","utf8")),semanticRoot:"run",branch:process.env.TARGET_BRANCH,allowVerified:process.env.READER_REBUILD==="true",requireRemoteHead:true}); assertCompiledEngineReceipt({binding,compile:JSON.parse(fs.readFileSync("build/reader-source/compile-receipt.json","utf8"))});'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact live canonical reader
        run: node scripts/verify-live.mjs "${{ steps.deployment.outputs.page_url }}" "$TARGET_DATE" build/reader-source build/shadow build/live-verification.json
      - name: Persist parity receipts on the same semantic execution
        run: |
          node scripts/finalize-shadow-state.mjs run "$TARGET_DATE" "${{ steps.deployment.outputs.page_url }}"
          git -C run config user.name "Daily Compiler"
          git -C run config user.email "actions@users.noreply.github.com"
          git -C run add "shadow-runs/$TARGET_DATE"
          if git -C run diff --cached --quiet; then
            echo "Shadow receipts already current"
          else
            git -C run commit -m "Verify canonical reader parity for shadow edition $TARGET_DATE"
            git -C run push origin HEAD:"$TARGET_BRANCH"
          fi
      - name: Persist cumulative verified reader history
        run: |
          if [ "$HISTORY_EXISTS" = "true" ]; then
            rm -rf history/site
            mkdir -p history/site
            cp -a build/shadow/. history/site/
          else
            git worktree add --detach history main
            git -C history switch --orphan shadow-pages-history
            git -C history rm -rf . >/dev/null 2>&1 || true
            mkdir -p history/site
            cp -a build/shadow/. history/site/
          fi
          git -C history config user.name "Daily Compiler"
          git -C history config user.email "actions@users.noreply.github.com"
          git -C history add site
          if git -C history diff --cached --quiet; then
            echo "Permanent reader history already current"
            exit 0
          fi
          git -C history commit -m "Preserve canonical shadow reader through $TARGET_DATE"
          git -C history push origin HEAD:shadow-pages-history
