name: compiler-validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'implementation/**'
      - 'proof/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-audit --no-fund --fetch-retries=1 --fetch-timeout=20000 sharp@0.34.4 playwright-core@1.51.1
      - name: Parse real image-release workflow YAML before protected validation
        run: ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/external-image-only-replacement.yml
      - name: Parse optional real six-binary transport proof workflow YAML
        run: |
          if [ -f .github/workflows/existing-six-png-github-binary-transport-proof.yml ]; then
            ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/existing-six-png-github-binary-transport-proof.yml
          fi
      - name: Parse media-gated producer and publisher workflows
        run: |
          ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/bundle-ready-signal.yml
          ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/shadow-compile.yml
      - name: Parse nonpublishing operations reporting workflow YAML
        run: ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/daily-operations-report.yml
      - name: Parse Watchlist-only correction workflow YAML
        run: ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/watchlist-editorial-correction.yml
      - name: Parse premium social preview correction workflow YAML
        run: ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/premium-social-preview-correction.yml
      - name: Parse duplicate-reading-copy correction workflow YAML
        run: ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/reading-copy-correction.yml
      - name: Parse the editorial signal and archive-aware production deploy workflows
        run: |
          ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/bundle-ready-signal.yml
          ruby -rpsych -e 'Psych.parse_file(ARGV.fetch(0))' .github/workflows/shadow-compile.yml
      - name: Rehearse historical archive recovery against actual preserved pages (hardening PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'hardening/media-freshness-and-archive-history'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          mkdir -p build/full-history-rehearsal
          git archive refs/remotes/origin/shadow-pages-history site | tar -x -C build/full-history-rehearsal
          node scripts/rebuild-history-discovery.mjs build/full-history-rehearsal/site build/full-history-rehearsal/receipt.json
          node -e "const r=require('./build/full-history-rehearsal/receipt.json'); if(r.result!=='PASS'||r.edition_count<60||!r.edition_dates.includes('2026-10-17')||!r.edition_dates.includes('2026-10-18'))process.exit(1); console.log('FULL_HISTORY_REHEARSAL_PASS',r.edition_count,r.discovered_item_count)"
      - name: Rehearse October 13–19 historical link correction against actual published Pages history
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/verified-earlier-brief-links-20261019'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          mkdir -p build/generic-related-history-proof
          git archive refs/remotes/origin/shadow-pages-history site | tar -x -C build/generic-related-history-proof
          node scripts/correct-generic-related-coverage.mjs \
            config/reading-copy-revisions/2026-10-19-earlier-brief.json \
            build/generic-related-history-proof/site \
            build/generic-related-history-proof/patched \
            build/generic-related-history-proof/receipt.json
          node scripts/assert-published-image-continuity.mjs \
            build/generic-related-history-proof/site \
            build/generic-related-history-proof/patched
          node -e "const r=require('./build/generic-related-history-proof/receipt.json');const changed=r.homepage_latest_changed?52:49;const removed=r.homepage_latest_changed?102:84;if(r.result!=='PASS'||r.files_changed!==changed||r.panels_removed!==removed||r.accepted_png_files_byte_preserved<6)process.exit(1);console.log('ACTUAL_PUBLISHED_READER_PATCH_REHEARSAL_PASS',changed,removed)"
      - name: Protected PR image-package admission (Rev8, no incomplete-checkpoint push runs)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'image-package/')
        env:
          CANDIDATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_BRANCH" =~ ^image-package/(20[0-9]{2}-[0-9]{2}-[0-9]{2})-[a-zA-Z0-9_-]+$ ]]
          TARGET_DATE="${BASH_REMATCH[1]}"
          CYCLE_DATE="$(node -e "const d=new Date(process.argv[1]+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);process.stdout.write(d.toISOString().slice(0,10))" "$TARGET_DATE")"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow origin; fi
          git fetch origin "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history" \
            "+refs/heads/shadow/$TARGET_DATE:refs/remotes/origin/shadow/$TARGET_DATE"
          git fetch origin "$CANDIDATE_HEAD"
          git cat-file -e "$CANDIDATE_HEAD^{commit}"
          WORKTREE="$RUNNER_TEMP/image-prepr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git worktree add -b "image-package/$TARGET_DATE-ci-admission-$GITHUB_RUN_ATTEMPT" "$WORKTREE" "$CANDIDATE_HEAD"
          (cd "$WORKTREE" && node scripts/preflight-recurring-image-package.mjs "$CYCLE_DATE" .)
      - run: npm test
      - name: Rehearse public-video playback logic in an isolated real browser
        shell: bash
        run: |
          set -euo pipefail
          # One dependency install shared with the existing validated test harness.
          # Bound the previously silent apt operation; a missing dependency must
          # fail clearly instead of spending the full job timeout on a network stall.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 75s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq
            timeout 75s sudo apt-get -o Dpkg::Use-Pty=0 install -y -qq ffmpeg >/dev/null
          fi
          test -x /usr/bin/google-chrome
          test -d node_modules/playwright-core
          mkdir -p /tmp/browser/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules/playwright-core" /tmp/browser/node_modules/playwright-core
          node tests/selected-video-browser-rehearsal.cjs
      - run: npm run validate:bootstrap
      - run: npm run fixture:e2e
      - run: npm run reader:parity
      - name: Independently audit all 17 immutable October 8 live HTTP bytes
        run: node scripts/audit-oct8-live.mjs build/audits/oct8-live.json
      - name: Archive October 8 exact network-hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: oct8-live-hashes
          path: build/audits/oct8-live.json
          if-no-files-found: error
