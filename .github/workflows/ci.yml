name: compiler-validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'implementation/**'
      - 'proof/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run validate:bootstrap
      - run: npm run fixture:e2e
      - run: npm run reader:parity
