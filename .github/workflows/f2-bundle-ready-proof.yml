name: f2-bundle-ready-autocompile

on:
  push:
    branches:
      - experiment/f2-bundle-ready-autocompile
    paths:
      - 'proof/f2/fixture/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f2-bundle-ready-autocompile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require BUNDLE_READY fixture
        run: |
          node -e "const s=require('./proof/f2/fixture/compiler-state.json'); if(s.state!=='BUNDLE_READY'||s.bundle?.status!=='BUNDLE_READY') process.exit(1)"

      - name: Deterministically validate and build
        run: node f2-compiler/compile-fixture.mjs proof/f2/fixture proof/f2/result

      - name: Verify compiler receipt
        run: |
          node -e "const r=require('./proof/f2/result/receipt.json'); if(r.result!=='PASS'||r.chatgpt_involved_after_fixture_commit!==false||r.owner_intervention!==false) process.exit(1)"
          test -s proof/f2/result/site/index.html

      - name: Persist deterministic result
        run: |
          git config user.name "Daily Compiler F2"
          git config user.email "actions@users.noreply.github.com"
          git add proof/f2/result
          if git diff --cached --quiet; then
            echo "Result already persisted for this digest"
            exit 0
          fi
          git commit -m "Persist F2 autonomous BUNDLE_READY compile receipt"
          git push origin HEAD:experiment/f2-bundle-ready-autocompile

      - name: Upload deterministic build
        uses: actions/upload-artifact@v4
        with:
          name: f2-bundle-ready-build
          path: proof/f2/result/
          if-no-files-found: error
