name: reading-copy-correction
# Existing protected Pages deploy lane for independently audited reader-only copy corrections.
on:
  push:
    branches: [main]
    paths:
      - 'config/reading-copy-revisions/*.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-compiler-pages-deploy
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Admit exactly one protected-main correction revision
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t revisions < <(git diff --name-only HEAD^ HEAD -- 'config/reading-copy-revisions/*.json')
          test "${#revisions[@]}" -eq 1
          test -s "${revisions[0]}"
          echo "REVISION_PATH=${revisions[0]}" >> "$GITHUB_ENV"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
      - name: Read existing published Pages history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          HISTORY_HEAD="$(git rev-parse refs/remotes/origin/shadow-pages-history)"
          echo "HISTORY_HEAD=$HISTORY_HEAD" >> "$GITHUB_ENV"
          git worktree add --detach history "$HISTORY_HEAD"
          test -s history/site/briefs/2026-10-14/index.html
          test -s history/site/briefs/2026-10-19/index.html
      - name: Apply only the selected independently audited reader copy correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          REVISION_KIND="$(node -e 'console.log(require("./"+process.env.REVISION_PATH).correction_type)')"
          case "$REVISION_KIND" in
            DUPLICATED_READING_SUPPORT_TEXT_ONLY)
              node scripts/correct-reading-duplication.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            UNVERIFIED_EARLIER_BRIEF_TEXT_ONLY)
              node scripts/correct-generic-related-coverage.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            OCT22_READER_DATES_MEDIA_COPY_ONLY)
              node scripts/correct-oct22-reader-dates.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            OCT23_MEDIA_AGE_AND_METADATA_ONLY)
              node scripts/correct-oct23-media-metadata.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            WATCHLIST_RESEARCH_SCORE_DISPLAY_ONLY)
              node scripts/correct-watchlist-score-visibility.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            PODCAST_OVERVIEW_ANCHORS_ONLY)
              node scripts/correct-podcast-overview-anchors.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            *) echo "Unknown reader correction kind: $REVISION_KIND" >&2; exit 1 ;;
          esac
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('build/reading-copy-receipt.json','utf8'));
          if(r.result!=='PASS')throw Error('reader copy correction failed');
          if(r.schema_version==='daily-compiler-reading-copy-correction-receipt-v1'){
            if(r.files_changed!==13||r.repeated_blocks_removed!==34||
                r.current_image_files_byte_preserved<1||r.canonical_summary_why_unchanged!==true)
              throw Error('October 14 text-only integrity invariants failed');
          }else if(r.schema_version==='daily-compiler-generic-related-reader-correction-v1'){
            const expected=r.homepage_latest_changed?52:49;
            if(r.files_changed!==expected||r.panels_removed!==(r.homepage_latest_changed?102:84)||
                r.editions_corrected!==7||r.accepted_png_files_byte_preserved<6||
                r.original_articles_images_media_watchlist_unchanged!==true)
              throw Error('October 13–19 history-link integrity invariants failed');
          }else if(r.schema_version==='daily-compiler-oct22-reader-correction-v1'){
            if(r.edition_date!=='2026-10-22'||r.files_changed!==(r.homepage_latest_changed?14:11)||
               r.dates_repaired!==(r.homepage_latest_changed?50:20)||
               r.accepted_png_files_byte_preserved<6||
               r.no_editorial_reseal!==true||
               (r.homepage_latest_changed && (r.markdown_accepted_images_corrected!==6||r.html_accepted_images_corrected!==6)))
              throw Error('October 22 reader/date/Markdown integrity invariants failed');
          }else if(r.schema_version==='daily-compiler-oct23-media-metadata-correction-v1'){
            if(r.edition_date!=='2026-10-23'||r.files_changed!==(r.homepage_latest_changed?8:5)||
               r.misleading_media_labels_repaired!==(r.homepage_latest_changed?12:6)||
               r.unverified_host_fields_removed!==(r.homepage_latest_changed?10:4)||
               r.accepted_png_files_byte_preserved!==6||
               r.no_source_bundle_resealed!==true)
               throw Error('Oct23 original-date media metadata and immutable-image invariants failed');
          }else if(r.schema_version==='daily-compiler-watchlist-score-display-correction-v1'){
            if(r.edition_date!=='2026-10-27'||r.files_changed!==1||
               r.changed?.[0]?.route!=='assets/js/watchlist.js'||
               r.watchlist_topic_count!==50||r.graded_topic_count!==50||
               r.no_watchlist_content_change!==true||r.no_editorial_reseal!==true)
              throw Error('Watchlist rubric-score display-only correction invariants failed');

          }else if(r.schema_version==='daily-compiler-podcast-overview-anchor-correction-v1'){
            if(r.edition_date!=='2026-10-27'||r.first_affected_edition!=='2026-09-18'||
               r.affected_editions<25||r.latest_variants_changed!==3||
               r.links_fixed!==2*(r.affected_editions+3)||r.files_changed!==r.affected_editions+3||
               r.files_changed>150||r.changed.length!==r.files_changed||
               r.editorial_bundles_unchanged!==true||r.media_sources_unchanged!==true||
               r.accepted_images_regenerated!==0||r.all_other_site_bytes_preserved!==true)
              throw Error('Multi-edition podcast overview anchor correction invariants failed');

          }else throw Error('Unexpected correction receipt version');
          console.log('READER_TEXT_CORRECTION_PREFLIGHT_PASS',r.files_changed);
          NODE
      - name: Preserve all previously published accepted images during text corrections
        run: node scripts/assert-published-image-continuity.mjs history/site build/patched
      - name: Refuse competing history or main changes before deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/patched
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every changed live route with bounded CDN-propagation retries
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-reader-live-readback.mjs build/patched build/reading-copy-receipt.json "$SITE_URL" "$GITHUB_SHA" build/reader-live-verification.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('build/reader-live-verification.json'));if(r.result!=='PASS'||r.all_staged_bytes_verified!==true||r.all_live_bytes_verified!==true)process.exit(1)"
      - name: Persist verified correction to cumulative reader history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
          while IFS= read -r route; do
            test -n "$route"
            cp "build/patched/$route" "history/site/$route"
            git -C history add "site/$route"
          done < <(node -e "const r=require('./build/reading-copy-receipt.json');for(const f of r.changed)console.log(f.route)")
          EXPECTED_FILES="$(node -p "require('./build/reading-copy-receipt.json').files_changed")"
          test "$(git -C history diff --cached --name-only | wc -l)" -eq "$EXPECTED_FILES"
          git -C history config user.name 'Daily Compiler'
          git -C history config user.email 'actions@users.noreply.github.com'
          git -C history commit -m 'Publish verified reader-only copy correction'
          git -C history push origin HEAD:shadow-pages-history
          echo 'READING_COPY_CORRECTION_LIVE_VERIFIED_AND_PERSISTED'
