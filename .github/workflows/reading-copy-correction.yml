name: reading-copy-correction
# Existing protected Pages deploy lane for independently audited reader-only copy corrections.
on:
  push:
    branches: [main]
    paths:
      - 'config/reading-copy-revisions/*.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-compiler-pages-deploy
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Admit exactly one protected-main correction revision
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t revisions < <(git diff --name-only HEAD^ HEAD -- 'config/reading-copy-revisions/*.json')
          test "${#revisions[@]}" -eq 1
          test -s "${revisions[0]}"
          echo "REVISION_PATH=${revisions[0]}" >> "$GITHUB_ENV"
          REVISION_KIND="$(node -e 'console.log(require("./"+process.argv[1]).correction_type)' "${revisions[0]}")"
          echo "REVISION_KIND=$REVISION_KIND" >> "$GITHUB_ENV"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
      - name: Read existing published Pages history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          HISTORY_HEAD="$(git rev-parse refs/remotes/origin/shadow-pages-history)"
          echo "HISTORY_HEAD=$HISTORY_HEAD" >> "$GITHUB_ENV"
          git worktree add --detach history "$HISTORY_HEAD"
          test -s history/site/briefs/2026-10-14/index.html
          test -s history/site/briefs/2026-10-19/index.html

      - name: Prepare five-scenario website page using existing Jekyll layout
        if: env.REVISION_KIND == 'BRIEF_BUILDER_SITE_PAGES' || env.REVISION_KIND == 'BRIEF_BUILDER_HOBBY_EVOLUTION_AND_LINK_HYGIENE'
        run: node scripts/prepare-brief-builder-jekyll.mjs build/brief-builder-source
      - name: Render new public website page with GitHub Pages Jekyll
        if: env.REVISION_KIND == 'BRIEF_BUILDER_SITE_PAGES' || env.REVISION_KIND == 'BRIEF_BUILDER_HOBBY_EVOLUTION_AND_LINK_HYGIENE'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./build/brief-builder-source
          destination: ./build/brief-builder-built

      - name: Apply only the selected independently audited reader copy correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          REVISION_KIND="$(node -e 'console.log(require("./"+process.env.REVISION_PATH).correction_type)')"
          case "$REVISION_KIND" in
            DUPLICATED_READING_SUPPORT_TEXT_ONLY)
              node scripts/correct-reading-duplication.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            UNVERIFIED_EARLIER_BRIEF_TEXT_ONLY)
              node scripts/correct-generic-related-coverage.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            OCT22_READER_DATES_MEDIA_COPY_ONLY)
              node scripts/correct-oct22-reader-dates.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            OCT23_MEDIA_AGE_AND_METADATA_ONLY)
              node scripts/correct-oct23-media-metadata.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            WATCHLIST_RESEARCH_SCORE_DISPLAY_ONLY)
              node scripts/correct-watchlist-score-visibility.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            PODCAST_OVERVIEW_ANCHORS_ONLY)
              node scripts/correct-podcast-overview-anchors.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            SOURCES_TRANSPARENCY_ENHANCEMENT_ONLY)
              node scripts/correct-sources-transparency.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            BRIEF_BUILDER_SITE_PAGES)
              node scripts/stage-brief-builder-pages.mjs \
                "$REVISION_PATH" history/site \
                build/brief-builder-built/build-your-own-brief-compiler/index.html \
                build/patched build/reading-copy-receipt.json
              ;;
            BRIEF_BUILDER_HISTORY_PERSIST_ONLY)
              node scripts/recover-brief-builder-history.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            BRIEF_BUILDER_HOBBY_EVOLUTION_AND_LINK_HYGIENE)
              node scripts/update-brief-explainer-webpages.mjs \
                "$REVISION_PATH" history/site \
                build/brief-builder-built/build-your-own-brief-compiler/index.html \
                build/patched build/reading-copy-receipt.json
              ;;
            GLOBAL_BRIEF_HEADER_AND_BUILDER_CSS)
              node scripts/stage-global-brief-header-css.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            SOURCES_ASSETS_CSS_JS_FIX)
              node scripts/stage-sources-page-assets.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            OCT28_PRIVATE_LAST_VIDEO_LINK_ONLY)
              node scripts/stage-oct28-last-video-link.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            OCT29_TWO_VIDEO_VALUE_MEDIA_ONLY)
              node scripts/stage-oct29-video-value.mjs \
                "$REVISION_PATH" history/site build/patched build/reading-copy-receipt.json
              ;;
            *) echo "Unknown reader correction kind: $REVISION_KIND" >&2; exit 1 ;;
          esac
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('build/reading-copy-receipt.json','utf8'));
          if(r.result!=='PASS')throw Error('reader copy correction failed');
          if(r.schema_version==='daily-compiler-reading-copy-correction-receipt-v1'){
            if(r.files_changed!==13||r.repeated_blocks_removed!==34||
                r.current_image_files_byte_preserved<1||r.canonical_summary_why_unchanged!==true)
              throw Error('October 14 text-only integrity invariants failed');
          }else if(r.schema_version==='daily-compiler-generic-related-reader-correction-v1'){
            const expected=r.homepage_latest_changed?52:49;
            if(r.files_changed!==expected||r.panels_removed!==(r.homepage_latest_changed?102:84)||
                r.editions_corrected!==7||r.accepted_png_files_byte_preserved<6||
                r.original_articles_images_media_watchlist_unchanged!==true)
              throw Error('October 13–19 history-link integrity invariants failed');
          }else if(r.schema_version==='daily-compiler-oct22-reader-correction-v1'){
            if(r.edition_date!=='2026-10-22'||r.files_changed!==(r.homepage_latest_changed?14:11)||
               r.dates_repaired!==(r.homepage_latest_changed?50:20)||
               r.accepted_png_files_byte_preserved<6||
               r.no_editorial_reseal!==true||
               (r.homepage_latest_changed && (r.markdown_accepted_images_corrected!==6||r.html_accepted_images_corrected!==6)))
              throw Error('October 22 reader/date/Markdown integrity invariants failed');
          }else if(r.schema_version==='daily-compiler-oct23-media-metadata-correction-v1'){
            if(r.edition_date!=='2026-10-23'||r.files_changed!==(r.homepage_latest_changed?8:5)||
               r.misleading_media_labels_repaired!==(r.homepage_latest_changed?12:6)||
               r.unverified_host_fields_removed!==(r.homepage_latest_changed?10:4)||
               r.accepted_png_files_byte_preserved!==6||
               r.no_source_bundle_resealed!==true)
               throw Error('Oct23 original-date media metadata and immutable-image invariants failed');
          }else if(r.schema_version==='daily-compiler-watchlist-score-display-correction-v1'){
            if(r.edition_date!=='2026-10-27'||r.files_changed!==1||
               r.changed?.[0]?.route!=='assets/js/watchlist.js'||
               r.watchlist_topic_count!==50||r.graded_topic_count!==50||
               r.no_watchlist_content_change!==true||r.no_editorial_reseal!==true)
              throw Error('Watchlist rubric-score display-only correction invariants failed');

          }else if(r.schema_version==='daily-compiler-podcast-overview-anchor-correction-v1'){
            if(r.edition_date!=='2026-10-27'||r.first_affected_edition!=='2026-09-18'||
               r.affected_editions<25||r.latest_variants_changed!==3||
               r.links_fixed!==2*(r.affected_editions+3)||r.files_changed!==r.affected_editions+3||
               r.files_changed>150||r.changed.length!==r.files_changed||
               r.editorial_bundles_unchanged!==true||r.media_sources_unchanged!==true||
               r.accepted_images_regenerated!==0||r.all_other_site_bytes_preserved!==true)
              throw Error('Multi-edition podcast overview anchor correction invariants failed');

          }else if(r.schema_version==='daily-compiler-sources-transparency-correction-v1'){
            if(r.edition_date!=='2026-10-27'||r.files_changed!==1||
               r.changed?.length!==1||r.changed[0].route!=='sources/index.html'||
               r.source_records!==208||r.enabled_routes!==98||r.pending_qualification!==110||
               r.all_earlier_editions_and_accepted_images_unchanged!==true||
               r.story_count_changed!==0||r.new_paid_dependencies!==0)
               throw Error('Source transparency correction violates one-page and inventory scope');

          }else if(r.schema_version==='daily-compiler-brief-builder-site-pages-v1'){
            if(r.edition_date!=='2026-10-27'||r.files_changed!==3||
               r.pages_added!==1||r.pages_updated!==2||
               !Array.isArray(r.changed)||
               JSON.stringify(r.changed.map(x=>x.route))!==
                 JSON.stringify(['index.html','sources/index.html','build-your-own-brief-compiler/index.html'])||
               r.source_section_linked!==true||r.homepage_navigation_linked!==true||
               r.five_examples_and_four_book_destinations!==true||
               r.all_editions_podcasts_articles_and_accepted_images_unchanged!==true||
               r.no_paid_services!==true||r.no_editorial_bundle_reseal!==true)
              throw Error('Brief Builder website route/content/preservation invariants failed');

          }else if(r.schema_version==='daily-compiler-brief-builder-history-only-recovery-v1'){
            if(r.edition_date!=='2026-10-27'||r.files_changed!==3||
               r.original_deployment_run!==40576857499||
               JSON.stringify(r.changed.map(x=>x.route))!==
                 JSON.stringify(['index.html','sources/index.html','build-your-own-brief-compiler/index.html'])||
               r.exact_already_live_bytes_preserved!==true||r.live_review_authorized!==true||
               r.new_pages_deployed!==0||r.previous_editions_and_accepted_images_unchanged!==true||
               r.semantic_rework!==0||r.additional_image_generation!==0)
               throw Error('Already-verified website history recovery invariants failed');

          }else if(r.schema_version==='daily-compiler-brief-explainer-hobby-evolution-v1'){
            if(r.edition_date!=='2026-10-27'||r.files_changed!==2||
               JSON.stringify(r.changed.map(c=>c.route))!==JSON.stringify([
                 'sources/index.html','build-your-own-brief-compiler/index.html'])||
               r.documented_hobby_use_cases!==6||r.hobby!=='home gardening'||
               r.feedback_sources_watchlist_learning_loop!==true||
               r.duplicate_internal_links!==0||r.registry_directory_preserved!==true||
               r.accepted_images_reencoded!==0||
               r.all_previous_reader_and_media_bytes_preserved!==true||
               r.new_schedules!==0||r.new_paid_apis!==0)
              throw Error('Gardening, feedback, unique-link and accepted-image invariants failed');

          }else if(r.schema_version==='daily-compiler-global-brief-header-css-repair-v1'){
            if(r.edition_date!=='2026-10-27'||r.files_changed!==3||
               JSON.stringify(r.changed.map(c=>c.route))!==
                 JSON.stringify(['assets/js/audience.js','build-your-own-brief-compiler/index.html','sources/index.html'])||
               !r.shared_navigation||r.shared_navigation.eligible_header_pages<300||
               r.shared_navigation.common_audience_js_present!==r.shared_navigation.eligible_header_pages||
               r.shared_navigation.sources_links!==r.shared_navigation.eligible_header_pages||
               r.browser_header_has_sources_and_builder!==true||
               r.builder_style_in_head_not_body!==true||
               r.no_duplicate_explainer_brief_links!==true||
               r.all_historical_html_except_two_informational_pages_unchanged!==true||
               r.all_accepted_pngs_unchanged!==true||
               r.no_editorial_reseal!==true||r.no_paid_apis!==true)
              throw Error('Global navigation / CSS repair violates historical publication safeguards');

          }else if(r.schema_version==='daily-compiler-sources-css-js-asset-repair-v1'){
            if(r.edition_date!=='2026-10-28'||r.files_changed!==3||
               JSON.stringify(r.changed.map(x=>x.route))!==
                 JSON.stringify(['sources/index.html','assets/css/sources-transparency.css','assets/js/sources-transparency.js'])||
               r.source_records!==208||r.source_enabled!==98||
               r.external_css_head!==true||r.external_js_deferred!==true||
               r.escaped_css_and_js_removed!==true||
               r.interactive_directory_preserved!==true||
               r.all_earlier_articles_videos_podcasts_images_unchanged!==true||
               r.new_paid_apis!==0||r.new_schedules!==0)
              throw Error('Sources CSS/JS repair violates exact three-route and image integrity');

          }else if(r.schema_version==='daily-compiler-oct28-last-video-link-correction-v1'){
            if(r.edition_date!=='2026-10-28'||r.files_changed!==5||
               JSON.stringify(r.changed.map(x=>x.route))!==JSON.stringify([
                 'index.html','latest.html','latest.md',
                 'briefs/2026-10-28/index.html','videos/2026-10-28/agent-skills/index.html'
               ])||r.publisher!=='Okta'||r.official_youtube_video_id!=='TpJsRDZ29Os'||
               r.owner_reported_original_player_private!==true||
               r.replacement_verified_official_publisher_identity!==true||
               r.original_semantic_bundle_unchanged!==true||
               r.all_other_reader_and_accepted_image_bytes_preserved!==true||
               r.no_video_download_or_reupload!==true||r.no_paid_api_or_new_schedule!==true)
              throw Error('Oct28 video-only link correction changed unapproved content');

          }else if(r.schema_version==='daily-compiler-oct29-two-video-editorial-correction-v1'){
            const wanted=['index.html','latest.html','latest.md','briefs/2026-10-29/index.html',
              'videos/2026-10-29/general/index.html','videos/2026-10-29/agent-skills/index.html',
              'feed.xml','feed.json','data/archive-index.json','data/compiler-feedback-registry.json',
              'briefs-archive/index.html'];
            if(r.edition_date!=='2026-10-29'||r.files_changed!==11||
               JSON.stringify(r.changed.map(x=>x.route).sort())!==JSON.stringify(wanted.sort())||
               !r.original_bundle_unchanged||!r.accepted_image_and_job_bytes_unchanged||
               !r.historical_edition_bytes_unchanged||!r.original_feedback_identities_preserved||
               r.video_count!==2||new Set(r.source_publishers).size!==2||
               r.image_generation_count!==0||r.new_paid_apis!==0||r.new_schedules!==0)
              throw Error('Oct29 owner-requested two independent video media-only correction violated preservation contract');

          }else throw Error('Unexpected correction receipt version');
          console.log('READER_TEXT_CORRECTION_PREFLIGHT_PASS',r.files_changed);
          NODE
      - name: Require real signed-out advancing playback for both October 29 replacements
        if: env.REVISION_KIND == 'OCT29_TWO_VIDEO_VALUE_MEDIA_ONLY'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --fetch-retries=1 --fetch-timeout=20000 playwright-core@1.51.1
          mkdir -p /tmp/browser/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules/playwright-core" /tmp/browser/node_modules/playwright-core
          node scripts/verify-selected-video-playback.cjs \
            config/media-revisions/2026-10-29-playback-candidates.json \
            build/oct29-protected-public-playback.json
      - name: Preserve all previously published accepted images during text corrections
        run: node scripts/assert-published-image-continuity.mjs history/site build/patched
      - name: Refuse competing history or main changes before deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
      - if: env.REVISION_KIND != 'BRIEF_BUILDER_HISTORY_PERSIST_ONLY'
        uses: actions/configure-pages@v5
      - if: env.REVISION_KIND != 'BRIEF_BUILDER_HISTORY_PERSIST_ONLY'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/patched
      - id: deployment
        if: env.REVISION_KIND != 'BRIEF_BUILDER_HISTORY_PERSIST_ONLY'
        uses: actions/deploy-pages@v4
      - name: Verify every changed live route with bounded CDN-propagation retries
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url || 'https://gttome.github.io/Daily-AI-Brief-Compiler/' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-reader-live-readback.mjs build/patched build/reading-copy-receipt.json "$SITE_URL" "$GITHUB_SHA" build/reader-live-verification.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('build/reader-live-verification.json'));if(r.result!=='PASS'||r.all_staged_bytes_verified!==true||r.all_live_bytes_verified!==true)process.exit(1)"
      - name: Persist verified correction to cumulative reader history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/shadow-pages-history | awk '{print $1}')" = "$HISTORY_HEAD"
          while IFS= read -r route; do
            test -n "$route"
            mkdir -p "$(dirname "history/site/$route")"
            cp "build/patched/$route" "history/site/$route"
            git -C history add "site/$route"
          done < <(node -e "const r=require('./build/reading-copy-receipt.json');for(const f of r.changed)console.log(f.route)")
          EXPECTED_FILES="$(node -p "require('./build/reading-copy-receipt.json').files_changed")"
          test "$(git -C history diff --cached --name-only | wc -l)" -eq "$EXPECTED_FILES"
          git -C history config user.name 'Daily Compiler'
          git -C history config user.email 'actions@users.noreply.github.com'
          git -C history commit -m 'Publish verified reader-only copy correction'
          git -C history push origin HEAD:shadow-pages-history
          echo 'READING_COPY_CORRECTION_LIVE_VERIFIED_AND_PERSISTED'
