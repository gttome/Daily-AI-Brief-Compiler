name: daily-operations-report
# Only deterministic GitHub evidence reconciliation, NEVER reader/image publication.
on:
  # Refresh after the actual approved 24-context review or a new optional usage entry.
  # Paths are restricted; report writes only to operations-reports, not main or Pages.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-operations-report.yml'
      - 'external-image-packages/**/reviews/live/image-element24/semantic-reviews.json'
      - 'external-image-packages/**/reviews/live/semantic-pixel-review.json'
      - 'external-image-packages/**/reviews/after-action.json'
      - 'external-image-packages/**/reviews/worker-state.json'
      - 'docs/after-action/usage/*.json'
      - 'docs/after-action/incidents/*.json'
      - 'docs/after-action/*-unified-production-aar.md'
      - 'docs/after-action/timing/*.json'
      - 'scripts/derive-image-stage-timing.mjs'
      - 'scripts/render-unified-production-aar.mjs'
      - 'scripts/aar-charts.mjs'
      - 'scripts/aar-improvement-metrics.mjs'
      - 'config/aar-improvement-register.json'
      - 'scripts/compile-daily-aar.mjs'
      - 'scripts/top10-aar.mjs'
      - 'scripts/nov02-evidence-summary.mjs'
      - 'scripts/collect-top10-consumed-report.mjs'
      - 'scripts/worker-checkpoint-consistency.mjs'
  # Reconcile immediately after the existing image-only release finishes; this is reporting only.
  workflow_run:
    workflows: [external-image-only-replacement]
    types: [completed]
  schedule:
    # One workflow, DST-aware 09:00 Chicago guard: one of these UTC starts is skipped.
    - cron: '0 14,15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compiler-daily-evidence-report
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: chicago
        shell: bash
        run: |
          set -euo pipefail
          hour="$(TZ=America/Chicago date +%H)"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$hour" != 09 ]; then
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "Skipping UTC cron not aligned with 09:00 Chicago"
          else
            echo 'go=true' >> "$GITHUB_OUTPUT"
            echo "Deterministic after-release or morning report reconciliation; no AI, image generation, Pages, or scheduler changes"
          fi
      - uses: actions/setup-node@v4
        if: steps.chicago.outputs.go == 'true'
        with:
          node-version: '20'
      - name: Reconcile previous 14 cycles without publication triggers
        if: steps.chicago.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'gttome/Daily-AI-Brief-Compiler'
          test "$(git branch --show-current)" = main
          tmp="$(mktemp -d)"
          # Use protected main report renderers even if the evidence branch has an older snapshot.
          cp scripts/compile-daily-aar.mjs "$tmp/compile-daily-aar.mjs"
          cp scripts/top10-aar.mjs "$tmp/top10-aar.mjs"
          cp scripts/nov02-evidence-summary.mjs "$tmp/nov02-evidence-summary.mjs"
          cp scripts/collect-top10-consumed-report.mjs "$tmp/collect-top10-consumed-report.mjs"
          cp scripts/oct27-source-readiness.mjs "$tmp/oct27-source-readiness.mjs"
          cp scripts/task-origin-evidence.mjs "$tmp/task-origin-evidence.mjs"
          cp scripts/render-unified-production-aar.mjs "$tmp/render-unified-production-aar.mjs"
          cp scripts/aar-charts.mjs "$tmp/aar-charts.mjs"
          cp scripts/aar-improvement-metrics.mjs "$tmp/aar-improvement-metrics.mjs"
          cp config/resource-registry.json "$tmp/resource-registry.json"
          cp config/aar-improvement-register.json "$tmp/aar-improvement-register.json"
          cp scripts/image-aar-contract.mjs "$tmp/image-aar-contract.mjs"
          cp scripts/worker-checkpoint-consistency.mjs "$tmp/worker-checkpoint-consistency.mjs"
          cp scripts/owner-usage.mjs "$tmp/owner-usage.mjs"
          cp scripts/derive-image-stage-timing.mjs "$tmp/derive-image-stage-timing.mjs"
          cp scripts/package-offline-unified-aar.mjs "$tmp/package-offline-unified-aar.mjs"
          git fetch -q origin '+refs/heads/main:refs/remotes/origin/main'
          git config user.name 'Daily Compiler Report Reconciler'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin '+refs/heads/shadow-pages-history:refs/remotes/origin/shadow-pages-history'
          # Freeze the optional Top 10 input branch before gathering evidence. Later
          # checkout still refreshes the write branch so concurrent signal files survive.
          reports_source_commit=''
          if git ls-remote --exit-code origin refs/heads/operations-reports >/dev/null 2>&1; then
            git fetch -q origin '+refs/heads/operations-reports:refs/remotes/origin/operations-reports'
            reports_source_commit="$(git rev-parse refs/remotes/origin/operations-reports)"
          fi
          # Image workflow completion is on the *production evening* (lag zero).
          # The next-morning schedule starts at lag one, avoiding premature reports.
          start_lag=1
          if [[ "$GITHUB_EVENT_NAME" = workflow_run || "$GITHUB_EVENT_NAME" = workflow_dispatch || "$GITHUB_EVENT_NAME" = push ]]; then start_lag=0; fi
          for lag in $(seq "$start_lag" 14); do
            current="$(TZ=America/Chicago date +%F)"
            cycle="$(date -u -d "$current -$lag days" +%F)"
            if [[ "$cycle" < '2026-10-11' ]]; then continue; fi
            edition="$(date -u -d "$cycle +1 day" +%F)"
            if git ls-remote --exit-code origin "refs/heads/shadow/$edition" >/dev/null 2>&1; then
              git fetch -q origin "+refs/heads/shadow/$edition:refs/remotes/origin/shadow/$edition"
            fi
            in="$tmp/evidence/$cycle"
            mkdir -p "$in"
            # Source trust: immutable protected branch, exact edition-scoped paths, no cross-date fallback.
            ref="refs/remotes/origin/shadow/$edition"
            git show "$ref:shadow-runs/$edition/compiler-state.json" > "$in/compiler-state.json" 2>/dev/null || rm -f "$in/compiler-state.json"
            git show "$ref:shadow-runs/$edition/publication-health.json" > "$in/publication-health.json" 2>/dev/null || rm -f "$in/publication-health.json"
            while IFS= read -r diagnostic; do
              git show "$ref:$diagnostic"
            done < <(git ls-tree -r --name-only "$ref" "shadow-runs/$edition/editorial" 2>/dev/null |
              grep -E '/video-playback-failure-[0-9]+[.]json$' || true) | jq -s '.' > "$in/video-playback-failures.json"
            git show "refs/remotes/origin/main:docs/after-action/$edition-compiler-production-aar.json" > "$in/owner-intervention-incident.json" 2>/dev/null || rm -f "$in/owner-intervention-incident.json"
            git show "$ref:shadow-runs/$edition/edition-bundle.json" > "$in/edition-bundle.json" 2>/dev/null || rm -f "$in/edition-bundle.json"
            git show "$ref:shadow-runs/$edition/compiler/postpublish-video-playback.json" > "$in/postpublish-video-playback.json" 2>/dev/null || rm -f "$in/postpublish-video-playback.json"
            git show "refs/remotes/origin/main:docs/after-action/incidents/$edition.json" > "$in/postpublication-incidents.json" 2>/dev/null || rm -f "$in/postpublication-incidents.json"
            git show "$ref:shadow-runs/$edition/producer-receipt.json" > "$in/producer-receipt.json" 2>/dev/null || rm -f "$in/producer-receipt.json"
            # Optional edition-scoped source qualification receipts; absence is NOT OBSERVED, never PASS.
            git show "$ref:shadow-runs/$edition/editorial/source-route-coverage.json" > "$in/source-route-coverage.json" 2>/dev/null || rm -f "$in/source-route-coverage.json"
            git show "$ref:shadow-runs/$edition/editorial/source-item-census.json" > "$in/source-item-census.json" 2>/dev/null || rm -f "$in/source-item-census.json"
             git show "$ref:shadow-runs/$edition/editorial/source-item-retries.json" > "$in/source-item-retries.json" 2>/dev/null || rm -f "$in/source-item-retries.json"
            git show "$ref:shadow-runs/$edition/editorial/source-qualification.json" > "$in/source-qualification.json" 2>/dev/null || rm -f "$in/source-qualification.json"
            # Topic discovery and the Compiler's exact consumption/search receipts
            # are distinct evidence. Missing inputs never imply successful handoff.
            git show "$ref:shadow-runs/$edition/editorial/trend-input.json" > "$in/trend-input.json" 2>/dev/null || rm -f "$in/trend-input.json"
            git show "$ref:shadow-runs/$edition/editorial/trend-search-coverage.json" > "$in/trend-search-coverage.json" 2>/dev/null || rm -f "$in/trend-search-coverage.json"
            node "$tmp/collect-top10-consumed-report.mjs" "$cycle" "$edition" "$in"
            if [ -n "$reports_source_commit" ]; then
              # Optional original guard receipt. Missing timing/cause evidence remains unknown.
              git show "$reports_source_commit:recovery/$edition.json" > "$in/recovery-receipt.json" 2>/dev/null || rm -f "$in/recovery-receipt.json"
              # Fixed owner-approved input baseline; never infer it from today's larger sample.
              git show "aebc04de2173c37b2c041eb0e9f964e27325ee26:signals/ai-topic-top10/baselines/2026-11-03.json" > "$in/top10-baseline.json" 2>/dev/null || rm -f "$in/top10-baseline.json"
              previous_cycle="$(date -u -d "$cycle -1 day" +%F)"
              git show "$reports_source_commit:signals/ai-topic-top10/$previous_cycle.json" > "$in/top10-previous-report.json" 2>/dev/null || rm -f "$in/top10-previous-report.json"
              git show "$reports_source_commit:daily/$previous_cycle/top10.json" > "$in/top10-previous-aar.json" 2>/dev/null || rm -f "$in/top10-previous-aar.json"
              git show "$reports_source_commit:signals/ai-topic-top10/$cycle.improvement.json" > "$in/top10-improvement.json" 2>/dev/null || rm -f "$in/top10-improvement.json"
              git show "$reports_source_commit:daily/baselines/nov03-2026-top10.json" > "$in/top10-outcome-baseline.json" 2>/dev/null || rm -f "$in/top10-outcome-baseline.json"
              report_path="signals/ai-topic-top10/$cycle.json"
              if git show "$reports_source_commit:$report_path" > "$in/top10-report.json" 2>/dev/null; then
                report_blob_sha="$(git rev-parse "$reports_source_commit:$report_path")"
                node --input-type=module - "$cycle" "$edition" "$reports_source_commit" "$report_path" "$report_blob_sha" "$in" <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const [cycle,edition,commit,sourcePath,blob,inputDir]=process.argv.slice(2);
          const bytes=fs.readFileSync(inputDir+'/top10-report.json');
          const source={schema_version:'daily-ai-topic-top10-source-v1',cycle_date:cycle,
            edition_date:edition,source_commit:commit,source_path:sourcePath,source_blob_sha:blob,
            report_sha256:crypto.createHash('sha256').update(bytes).digest('hex'),
            observed_at:new Date().toISOString()};
          fs.writeFileSync(inputDir+'/top10-report-source.json',JSON.stringify(source,null,2)+'\n');
          NODE
              else
                rm -f "$in/top10-report.json"
              fi
              git show "$reports_source_commit:signals/ai-topic-top10/$cycle.aar.json" > "$in/top10-after-action.json" 2>/dev/null || rm -f "$in/top10-after-action.json"
            fi
            git show "$ref:shadow-runs/$edition/producer/task-origin.json" > "$in/compiler-task-origin.json" 2>/dev/null || rm -f "$in/compiler-task-origin.json"
            git show "$ref:shadow-runs/$edition/compiler/compile-receipt.json" > "$in/compile-receipt.json" 2>/dev/null || rm -f "$in/compile-receipt.json"
            git show "$ref:shadow-runs/$edition/compiler/postpublish-integrity.json" > "$in/postpublish-integrity.json" 2>/dev/null || rm -f "$in/postpublish-integrity.json"
            git show "refs/remotes/origin/shadow-pages-history:site/image-jobs/$edition/job.json" > "$in/image-job.json" 2>/dev/null || rm -f "$in/image-job.json"
            git show "refs/remotes/origin/shadow-pages-history:site/image-jobs/$edition/release.json" > "$in/image-release.json" 2>/dev/null || rm -f "$in/image-release.json"
            git show "refs/remotes/origin/main:external-image-packages/$edition/manifest.json" > "$in/image-manifest.json" 2>/dev/null || rm -f "$in/image-manifest.json"
            git show "refs/remotes/origin/main:external-image-packages/$edition/recurring-assignment.json" > "$in/image-recurring-assignment.json" 2>/dev/null || rm -f "$in/image-recurring-assignment.json"
            git show "refs/remotes/origin/main:external-image-packages/$edition/reviews/after-action.json" > "$in/image-after-action.json" 2>/dev/null || rm -f "$in/image-after-action.json"
            git show "refs/remotes/origin/main:external-image-packages/$edition/reviews/worker-state.json" > "$in/image-worker-state.json" 2>/dev/null || rm -f "$in/image-worker-state.json"
            git show "refs/remotes/origin/main:external-image-packages/$edition/reviews/route-preflight.json" > "$in/image-route-preflight.json" 2>/dev/null || rm -f "$in/image-route-preflight.json"
            git show "$ref:shadow-runs/$edition/execution-milestones.json" > "$in/execution-milestones.json" 2>/dev/null || rm -f "$in/execution-milestones.json"
            git show "$ref:shadow-runs/$edition/editorial/fallback-search-evidence.json" > "$in/fallback-search-evidence.json" 2>/dev/null || rm -f "$in/fallback-search-evidence.json"
            git show "refs/remotes/origin/main:external-image-packages/$edition/reviews/task-origin.json" > "$in/image-task-origin.json" 2>/dev/null || rm -f "$in/image-task-origin.json"
            git show "refs/remotes/origin/shadow-pages-history:site/data/watchlist.json" > "$in/published-watchlist.json" 2>/dev/null || rm -f "$in/published-watchlist.json"
            # Exception-only per-cycle schedule anchor; missing is normal.
            git show "refs/remotes/origin/main:docs/after-action/timing/$cycle.json" > "$in/image-scheduled-start.json" 2>/dev/null || rm -f "$in/image-scheduled-start.json"
            # Owner usage is a per-cycle optional input; a missing record is normal.
            git show "refs/remotes/origin/main:docs/after-action/usage/$cycle.json" > "$in/owner-usage.json" 2>/dev/null || rm -f "$in/owner-usage.json"
            git show "refs/remotes/origin/main:external-image-packages/$edition/reviews/live/image-element24/semantic-verification.json" > "$in/image-context-verification.json" 2>/dev/null || rm -f "$in/image-context-verification.json"
            # Both actual-pixel review contracts are supported; prefer the newest source when present.
            git show "refs/remotes/origin/main:external-image-packages/$edition/reviews/live/semantic-pixel-review.json" > "$in/image-context-reviews.json" 2>/dev/null || \
              git show "refs/remotes/origin/main:external-image-packages/$edition/reviews/live/image-element24/semantic-reviews.json" > "$in/image-context-reviews.json" 2>/dev/null || \
              rm -f "$in/image-context-reviews.json"
            node "$tmp/derive-image-stage-timing.mjs" "$cycle" "$in" .
          done
          if git ls-remote --exit-code origin refs/heads/operations-reports >/dev/null 2>&1; then
            git fetch -q origin '+refs/heads/operations-reports:refs/remotes/origin/operations-reports'
            git checkout -B operations-reports refs/remotes/origin/operations-reports
          else
            git checkout -b operations-reports
          fi
          for lag in $(seq "$start_lag" 14); do
            current="$(TZ=America/Chicago date +%F)"
            cycle="$(date -u -d "$current -$lag days" +%F)"
            if [[ "$cycle" < '2026-10-11' ]]; then continue; fi
            # A genuine Top 10 run can be reported before the Compiler starts;
            # never manufacture Compiler/image receipts to admit that cycle.
            test -s "$tmp/evidence/$cycle/compiler-state.json" || test -s "$tmp/evidence/$cycle/image-job.json" || test -s "$tmp/evidence/$cycle/top10-report.json" || test -s "$tmp/evidence/$cycle/top10-after-action.json" || continue
            # Pick up a previously frozen outcome; the compiler creates it only once,
            # after genuine November 3 publication and bound search/selection evidence.
            if [ -s daily/baselines/nov03-2026-top10.json ]; then
              cp daily/baselines/nov03-2026-top10.json "$tmp/evidence/$cycle/top10-outcome-baseline.json"
            fi
            node "$tmp/compile-daily-aar.mjs" "$cycle" "$tmp/evidence/$cycle" .
            if [ -s daily/baselines/nov03-2026-top10.json ]; then
              cp daily/baselines/nov03-2026-top10.json "$tmp/evidence/$cycle/top10-outcome-baseline.json"
            fi
            node "$tmp/render-unified-production-aar.mjs" "$cycle" "$tmp/evidence/$cycle" "daily/$cycle"
          done
          if [ ! -d daily ]; then
            echo 'No eligible completed evening cycles yet; safe deterministic no-op'
            exit 0
          fi
          # One deterministic postpass over existing reports, oldest to newest.
          # No new job, cadence, producer, network request or publication trigger.
          node "$tmp/aar-improvement-metrics.mjs" daily "$tmp/evidence" \
            "$tmp/resource-registry.json" "$tmp/aar-improvement-register.json"
          git add -- daily
          if git diff --cached --quiet; then
            echo 'AAR reports already idempotently current; no commit'
          else
            git commit -m "Reconcile evidence-backed daily Compiler and image AARs"
            git push origin HEAD:refs/heads/operations-reports
          fi
          # Portable report archives: original published PNG bytes are read from
          # current protected main and independently SHA-256 checked. They never
          # change published content or add binaries to operations-reports.
          for lag in 0 1 2; do
            current="$(TZ=America/Chicago date +%F)"
            cycle="$(date -u -d "$current -$lag days" +%F)"
            report_path="daily/$cycle/combined.md"
            if [ -s "$report_path" ]; then
              node "$tmp/package-offline-unified-aar.mjs" "$cycle" "$report_path" \
                "$tmp/evidence/$cycle" "$RUNNER_TEMP/unified-aar-offline/$cycle"
            fi
          done
      - name: Upload standalone Markdown + original PNGs for offline Typora
        if: steps.chicago.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unified-aar-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/unified-aar-offline/
          if-no-files-found: ignore
          retention-days: 90


