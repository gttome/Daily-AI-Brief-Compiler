name: reader-vendor-import-development

on:
  push:
    branches:
      - 'implementation/reader-parity-v2-pr2-vendor'

permissions:
  contents: write

jobs:
  import-reader-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Compiler branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Check out pinned production reader source read-only
        uses: actions/checkout@v4
        with:
          repository: gttome/Daily-AI-Brief
          ref: 912248e5add14b2ec08d7a5eefed43cbf3af485f
          path: .reader-source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Import allowlisted reader-only snapshot
        run: node scripts/import-production-reader.mjs .reader-source
      - name: Verify architecture firewall before commit
        run: node --test tests/reader-vendor-architecture-firewall.test.mjs
      - name: Commit pinned snapshot to implementation branch
        run: |
          git config user.name "Daily Compiler Reader Import"
          git config user.email "actions@users.noreply.github.com"
          git add vendor/production-reader
          if git diff --cached --quiet; then
            echo "Reader snapshot already current"
            exit 0
          fi
          git commit -m "Vendor pinned production reader snapshot"
          git push origin HEAD:${{ github.ref_name }}
