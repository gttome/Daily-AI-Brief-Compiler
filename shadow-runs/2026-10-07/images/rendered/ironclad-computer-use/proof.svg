<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#193b5d"/><stop offset="1" stop-color="#0b2037"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#334f6a" flood-opacity=".18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1477e6"/></marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14a673"/></marker>
  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">Contract work becomes a measurable state machine</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">Observable states, approval gates, exception branches, and final verification make contract work measurable.</text>

 <rect x="52" y="112" width="1096" height="52" rx="16" fill="#16375b"/>
 <text x="78" y="142" font-size="10.5" font-weight="800" fill="#a9d1ff">BUSINESS RULE SPINE</text>
 <text x="220" y="142" font-size="10.5" font-weight="600" fill="#fff">parties • clauses • thresholds • approvers • required evidence • acceptance criteria</text>
 <g><rect x="55" y="205" width="170" height="82" rx="15" fill="#fff" stroke="#1477e6" stroke-width="2" filter="url(#shadow)"/><rect x="55" y="205" width="9" height="82" rx="5" fill="#1477e6"/>
  <text x="77" y="231" font-size="13.2" font-weight="800" fill="#12233d">Intake</text>
  <text x="77" y="248" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="77" dy="0">Capture request details,</tspan><tspan x="77" dy="10.5">thresholds, terms, and</tspan><tspan x="77" dy="10.5">reviewers</tspan></text></g><g><rect x="260" y="205" width="170" height="82" rx="15" fill="#fff" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><rect x="260" y="205" width="9" height="82" rx="5" fill="#14a673"/>
  <text x="282" y="231" font-size="13.2" font-weight="800" fill="#12233d">Interpret rules</text>
  <text x="282" y="248" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="282" dy="0">Translate policy into</tspan><tspan x="282" dy="10.5">forms, templates, and</tspan><tspan x="282" dy="10.5">conditions</tspan></text></g><g><rect x="465" y="205" width="170" height="82" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2" filter="url(#shadow)"/><rect x="465" y="205" width="9" height="82" rx="5" fill="#7656d8"/>
  <text x="487" y="231" font-size="13.2" font-weight="800" fill="#12233d">Route approvals</text>
  <text x="487" y="248" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="487" dy="0">Send required reviews</tspan><tspan x="487" dy="10.5">according to business</tspan><tspan x="487" dy="10.5">policy</tspan></text></g><g><rect x="670" y="205" width="170" height="82" rx="15" fill="#fff" stroke="#f18a2b" stroke-width="2" filter="url(#shadow)"/><rect x="670" y="205" width="9" height="82" rx="5" fill="#f18a2b"/>
  <text x="692" y="231" font-size="13.2" font-weight="800" fill="#12233d">Build agreement</text>
  <text x="692" y="248" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="692" dy="0">Assemble the contract</tspan><tspan x="692" dy="10.5">using approved terms and</tspan><tspan x="692" dy="10.5">rules</tspan></text></g><g><rect x="875" y="205" width="170" height="82" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2" filter="url(#shadow)"/><rect x="875" y="205" width="9" height="82" rx="5" fill="#25b5e9"/>
  <text x="897" y="231" font-size="13.2" font-weight="800" fill="#12233d">Verify result</text>
  <text x="897" y="248" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="897" dy="0">Check criteria and confirm</tspan><tspan x="897" dy="10.5">the finished process works</tspan></text></g>
 <g><line x1="225" y1="246" x2="248" y2="246" stroke="#14a673" stroke-width="3" stroke-linecap="round"/><polygon points="248,239 260,246 248,253" fill="#14a673"/></g><g><line x1="430" y1="246" x2="453" y2="246" stroke="#7656d8" stroke-width="3" stroke-linecap="round"/><polygon points="453,239 465,246 453,253" fill="#7656d8"/></g><g><line x1="635" y1="246" x2="658" y2="246" stroke="#f18a2b" stroke-width="3" stroke-linecap="round"/><polygon points="658,239 670,246 658,253" fill="#f18a2b"/></g><g><line x1="840" y1="246" x2="863" y2="246" stroke="#25b5e9" stroke-width="3" stroke-linecap="round"/><polygon points="863,239 875,246 863,253" fill="#25b5e9"/></g>
 <line x1="140" y1="164" x2="140" y2="205" stroke="#7e93a8" stroke-width="2"/><circle cx="140" cy="181" r="4" fill="#16375b"/><line x1="345" y1="164" x2="345" y2="205" stroke="#7e93a8" stroke-width="2"/><circle cx="345" cy="181" r="4" fill="#16375b"/><line x1="550" y1="164" x2="550" y2="205" stroke="#7e93a8" stroke-width="2"/><circle cx="550" cy="181" r="4" fill="#16375b"/><line x1="755" y1="164" x2="755" y2="205" stroke="#7e93a8" stroke-width="2"/><circle cx="755" cy="181" r="4" fill="#16375b"/><line x1="960" y1="164" x2="960" y2="205" stroke="#7e93a8" stroke-width="2"/><circle cx="960" cy="181" r="4" fill="#16375b"/>
 <g><rect x="660" y="320" width="180" height="28" rx="14" fill="#f18a2b"/><text x="750" y="339" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">EXCEPTION PATH</text></g>
 <path d="M755 287 V320" fill="none" stroke="#f18a2b" stroke-width="3"/><polygon points="748,308 755,320 762,308" fill="#f18a2b"/>
 <g><rect x="575" y="370" width="175" height="80" rx="15" fill="#fff" stroke="#f18a2b" stroke-width="2" filter="url(#shadow)"/><rect x="575" y="370" width="9" height="80" rx="5" fill="#f18a2b"/>
  <text x="597" y="396" font-size="13" font-weight="800" fill="#12233d">Handle exception</text>
  <text x="597" y="413" font-size="8.5" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="597" dy="0">Identify nonstandard cases</tspan><tspan x="597" dy="10.5">and surface them for</tspan><tspan x="597" dy="10.5">review</tspan></text></g>
 <g><rect x="790" y="370" width="175" height="80" rx="15" fill="#fff" stroke="#df5e62" stroke-width="2" filter="url(#shadow)"/><rect x="790" y="370" width="9" height="80" rx="5" fill="#df5e62"/>
  <text x="812" y="396" font-size="13" font-weight="800" fill="#12233d">Corrective action</text>
  <text x="812" y="413" font-size="8.5" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="812" dy="0">Human or agent revises one</tspan><tspan x="812" dy="10.5">bounded state, then</tspan><tspan x="812" dy="10.5">re-enters the flow</tspan></text></g>
 <g><line x1="750" y1="410" x2="778" y2="410" stroke="#df5e62" stroke-width="3" stroke-linecap="round"/><polygon points="778,403 790,410 778,417" fill="#df5e62"/></g>
 <path d="M875 450 V480 H550 V287" fill="none" stroke="#7656d8" stroke-width="3"/>
 <polygon points="543,299 550,287 557,299" fill="#7656d8"/>
 <rect x="995" y="335" width="145" height="135" rx="14" fill="#f1f5fa" stroke="#b8c8d8" stroke-width="1.2"/>
 <text x="1015" y="357" font-size="10" font-weight="800" fill="#16375b">FINAL GATE</text>
 <circle cx="1022" cy="386" r="5" fill="#14a673"/><text x="1036" y="389" font-size="8.8" font-weight="600" fill="#12233d">Rules preserved</text><circle cx="1022" cy="414" r="5" fill="#14a673"/><text x="1036" y="417" font-size="8.8" font-weight="600" fill="#12233d">Approvals complete</text><circle cx="1022" cy="442" r="5" fill="#14a673"/><text x="1036" y="445" font-size="8.8" font-weight="600" fill="#12233d">Exceptions closed</text>
 
<g filter="url(#shadow)">
      <rect x="82" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#14a673" stroke-width="1.7"/>
      <circle cx="107" cy="535" r="10" fill="#14a673"/>
      <path d="M102,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="126" y="538" font-size="13" font-weight="800" fill="#12233d">Observable</text>
      <text x="102" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="102" dy="0">Each transition has a defined state,</tspan><tspan x="102" dy="11">inputs, and completion proof.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="420" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#7656d8" stroke-width="1.7"/>
      <circle cx="445" cy="535" r="10" fill="#7656d8"/>
      <path d="M440,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="464" y="538" font-size="13" font-weight="800" fill="#12233d">Measurable</text>
      <text x="440" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="440" dy="0">Success is the verified agreement, not a</tspan><tspan x="440" dy="11">plausible midstream step.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="758" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#f18a2b" stroke-width="1.7"/>
      <circle cx="783" cy="535" r="10" fill="#f18a2b"/>
      <path d="M778,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="802" y="538" font-size="13" font-weight="800" fill="#12233d">Governed</text>
      <text x="778" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="778" dy="0">Nonstandard cases branch to explicit human</tspan><tspan x="778" dy="11">review.</tspan></text>
    </g>
<text x="600" y="616" text-anchor="middle" font-size="9.5" fill="#7b91a4">The useful unit of evaluation is the end-to-end workflow with its business rules intact.</text>
</g></svg>