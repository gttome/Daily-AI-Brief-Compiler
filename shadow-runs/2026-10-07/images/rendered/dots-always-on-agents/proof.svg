  <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14a673"/></marker>
  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">Persistent assistants keep delegated work connected</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">Goals, memory, triggers, connected apps, human review, and resumable state stay linked across time.</text>

 <rect x="44" y="112" width="1112" height="365" rx="26" fill="#f3f8fc" stroke="#c6d7e6" stroke-width="1.5"/>
 <g><rect x="64" y="126" width="160" height="28" rx="14" fill="#16375b"/><text x="144" y="145" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">DELEGATED INPUTS</text></g>
 <g><rect x="830" y="126" width="220" height="28" rx="14" fill="#16375b"/><text x="940" y="145" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">ACTION + CONTROL</text></g>
 <rect x="64" y="159" width="205" height="28" rx="10" fill="#fff" stroke="#f18a2b" stroke-width="1.6" filter="url(#shadow)"/>
 <circle cx="82" cy="173" r="6" fill="#f18a2b"/><text x="96" y="177" font-size="10.5" font-weight="800" fill="#12233d">Events + triggers</text>
 <g><rect x="64" y="203" width="205" height="72" rx="15" fill="#fff" stroke="#1477e6" stroke-width="2" filter="url(#shadow)"/><rect x="64" y="203" width="9" height="72" rx="5" fill="#1477e6"/>
  <text x="86" y="229" font-size="14" font-weight="800" fill="#12233d">Goal queue</text>
  <text x="86" y="246" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="86" dy="0">Active objectives remain</tspan><tspan x="86" dy="10.5">visible across conversations</tspan></text></g>
 <g><rect x="64" y="292" width="205" height="72" rx="15" fill="#fff" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><rect x="64" y="292" width="9" height="72" rx="5" fill="#14a673"/>
  <text x="86" y="318" font-size="14" font-weight="800" fill="#12233d">Working context</text>
  <text x="86" y="335" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="86" dy="0">Preferences and task state</tspan><tspan x="86" dy="10.5">provide continuity</tspan></text></g>
 <g><rect x="64" y="381" width="205" height="72" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2" filter="url(#shadow)"/><rect x="64" y="381" width="9" height="72" rx="5" fill="#7656d8"/>
  <text x="86" y="407" font-size="14" font-weight="800" fill="#12233d">Connected apps</text>
  <text x="86" y="424" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="86" dy="0">Authorized services provide</tspan><tspan x="86" dy="10.5">information and work surfaces</tspan></text></g>
 <rect x="330" y="139" width="420" height="318" rx="24" fill="#edf5fb" stroke="#afc4d8" stroke-width="1.6"/>
 <g><rect x="354" y="151" width="170" height="28" rx="14" fill="#16375b"/><text x="439" y="170" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">PERSISTENT CORE</text></g>
 <g><rect x="360" y="199" width="196" height="68" rx="15" fill="url(#dark)" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><rect x="360" y="199" width="9" height="68" rx="5" fill="#14a673"/>
  <text x="382" y="225" font-size="13.5" font-weight="800" fill="#fff">Task state</text>
  <text x="382" y="242" font-size="8.7" font-weight="400" fill="#c8d7e4" text-anchor="start"><tspan x="382" dy="0">Done, pending, blocked, and</tspan><tspan x="382" dy="10.5">next action stay durable</tspan></text></g>
 <g><rect x="360" y="284" width="196" height="68" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2" filter="url(#shadow)"/><rect x="360" y="284" width="9" height="68" rx="5" fill="#7656d8"/>
  <text x="382" y="310" font-size="13.5" font-weight="800" fill="#12233d">Memory + context</text>
  <text x="382" y="327" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="382" dy="0">Prior decisions, preferences,</tspan><tspan x="382" dy="10.5">and working facts carry</tspan><tspan x="382" dy="10.5">forward</tspan></text></g>
 <g><rect x="360" y="369" width="196" height="68" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2" filter="url(#shadow)"/><rect x="360" y="369" width="9" height="68" rx="5" fill="#25b5e9"/>
  <text x="382" y="395" font-size="13.5" font-weight="800" fill="#12233d">Audit trail</text>
  <text x="382" y="412" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="382" dy="0">Actions and evidence remain</tspan><tspan x="382" dy="10.5">inspectable across resumptions</tspan></text></g>
 <rect x="592" y="196" width="136" height="205" rx="68" fill="url(#dark)" stroke="#14a673" stroke-width="3" filter="url(#shadow)"/>
 <text x="660" y="232" text-anchor="middle" font-size="10.5" font-weight="800" fill="#8fe0cf">PERSISTENT</text>
 <text x="660" y="270" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">ASSISTANT</text>
 <text x="660" y="306" text-anchor="middle" font-size="10.5" fill="#d7e4ef"><tspan x="660">observe</tspan><tspan x="660" dy="16">plan</tspan><tspan x="660" dy="16">act</tspan></text>
 <rect x="612" y="366" width="96" height="24" rx="12" fill="#14a673"/><text x="660" y="382" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff">RESUME</text>
 <g><line x1="556" y1="232" x2="580" y2="232" stroke="#14a673" stroke-width="3" stroke-linecap="round"/><polygon points="580,225 592,232 580,239" fill="#14a673"/></g><g><line x1="556" y1="318" x2="580" y2="318" stroke="#7656d8" stroke-width="3" stroke-linecap="round"/><polygon points="580,311 592,318 580,325" fill="#7656d8"/></g>
 <path d="M592 358 C575 382 570 397 556 405" fill="none" stroke="#25b5e9" stroke-width="3"/>
 <g><rect x="803" y="169" width="317" height="72" rx="15" fill="#fff" stroke="#f18a2b" stroke-width="2" filter="url(#shadow)"/><rect x="803" y="169" width="9" height="72" rx="5" fill="#f18a2b"/>
  <text x="825" y="195" font-size="14" font-weight="800" fill="#12233d">Remote workspace</text>
  <text x="825" y="212" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="825" dy="0">Longer tasks can continue outside a single chat</tspan><tspan x="825" dy="10.5">turn</tspan></text></g>
 <g><rect x="803" y="263" width="317" height="78" rx="15" fill="url(#dark)" stroke="#df5e62" stroke-width="2" filter="url(#shadow)"/><rect x="803" y="263" width="9" height="78" rx="5" fill="#df5e62"/>
  <text x="825" y="289" font-size="14" font-weight="800" fill="#fff">Review points</text>
  <text x="825" y="306" font-size="9.2" font-weight="400" fill="#c8d7e4" text-anchor="start"><tspan x="825" dy="0">Important steps return to the user for checking</tspan></text></g>
 <g><rect x="803" y="363" width="317" height="72" rx="15" fill="#fff" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><rect x="803" y="363" width="9" height="72" rx="5" fill="#14a673"/>
  <text x="825" y="389" font-size="14" font-weight="800" fill="#12233d">Progress state</text>
  <text x="825" y="406" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="825" dy="0">Results update what is complete and what comes</tspan><tspan x="825" dy="10.5">next</tspan></text></g>
