<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#193b5d"/><stop offset="1" stop-color="#0b2037"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#334f6a" flood-opacity=".18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1477e6"/></marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14a673"/></marker>
  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">How a persistent assistant keeps work connected</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">One assistant coordinates goals, context, app connections, review points, and ongoing task state.</text>
<path d="M600 292 C480 292,197.5 213,197.5 213" fill="none" stroke="#14a673" stroke-width="4" opacity=".72"/><path d="M600 292 C480 292,202.5 368,202.5 368" fill="none" stroke="#7656d8" stroke-width="4" opacity=".72"/><path d="M600 292 C720 292,1002.5 213,1002.5 213" fill="none" stroke="#f18a2b" stroke-width="4" opacity=".72"/><path d="M600 292 C720 292,997.5 368,997.5 368" fill="none" stroke="#25b5e9" stroke-width="4" opacity=".72"/><path d="M600 292 C480 292,597.5 443,597.5 443" fill="none" stroke="#df5e62" stroke-width="4" opacity=".72"/><g filter="url(#shadow)">
    <rect x="470" y="218" width="260" height="150" rx="28" fill="url(#dark)" stroke="#1477e6" stroke-width="3"/>
    <text x="600" y="263" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">Goal queue</text>
    <text x="600" y="290" font-size="11" font-weight="400" fill="#c8d9e7" text-anchor="middle"><tspan x="600" dy="0">Active objectives remain visible</tspan><tspan x="600" dy="14">across conversations</tspan></text>
    <rect x="520" y="328" width="160" height="26" rx="13" fill="#14a673"/>
    <text x="600" y="346" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">Persistent delegation around one assistant</text>
  </g><g filter="url(#shadow)">
    <rect x="105" y="175" width="185" height="76" rx="15" fill="#fff" stroke="#14a673" stroke-width="2"/>
    <rect x="105" y="175" width="10" height="76" rx="5" fill="#14a673"/>
    <text x="129" y="202" font-size="14.5" font-weight="800" fill="#12233d">Working context</text>
    <text x="129" y="218" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="129" dy="0">Preferences and task state</tspan><tspan x="129" dy="10">provide continuity</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="110" y="330" width="185" height="76" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2"/>
    <rect x="110" y="330" width="10" height="76" rx="5" fill="#7656d8"/>
    <text x="134" y="357" font-size="14.5" font-weight="800" fill="#12233d">Connected apps</text>
    <text x="134" y="373" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="134" dy="0">Authorized services provide</tspan><tspan x="134" dy="10">information and work</tspan><tspan x="134" dy="10">surfaces</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="910" y="175" width="185" height="76" rx="15" fill="#fff" stroke="#f18a2b" stroke-width="2"/>
    <rect x="910" y="175" width="10" height="76" rx="5" fill="#f18a2b"/>
    <text x="934" y="202" font-size="14.5" font-weight="800" fill="#12233d">Remote workspace</text>
    <text x="934" y="218" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="934" dy="0">Longer tasks can continue</tspan><tspan x="934" dy="10">outside a single chat turn</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="905" y="330" width="185" height="76" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2"/>
    <rect x="905" y="330" width="10" height="76" rx="5" fill="#25b5e9"/>
    <text x="929" y="357" font-size="14.5" font-weight="800" fill="#12233d">Review points</text>
    <text x="929" y="373" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="929" dy="0">Important steps return to</tspan><tspan x="929" dy="10">the user for checking</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="505" y="405" width="185" height="76" rx="15" fill="#fff" stroke="#df5e62" stroke-width="2"/>
    <rect x="505" y="405" width="10" height="76" rx="5" fill="#df5e62"/>
    <text x="529" y="432" font-size="14.5" font-weight="800" fill="#12233d">Progress state</text>
    <text x="529" y="448" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="529" dy="0">Results update what is</tspan><tspan x="529" dy="10">complete and what comes</tspan><tspan x="529" dy="10">next</tspan></text>
  </g>
<g filter="url(#shadow)">
      <rect x="82" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#14a673" stroke-width="1.7"/>
      <circle cx="107" cy="535" r="10" fill="#14a673"/>
      <path d="M102,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="126" y="538" font-size="13" font-weight="800" fill="#12233d">Persistence</text>
      <text x="102" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="102" dy="0">Work does not have to restart from a blank</tspan><tspan x="102" dy="11">state each time</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="420" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#7656d8" stroke-width="1.7"/>
      <circle cx="445" cy="535" r="10" fill="#7656d8"/>
      <path d="M440,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="464" y="538" font-size="13" font-weight="800" fill="#12233d">Continuity</text>
      <text x="440" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="440" dy="0">Task context links activity across tools</tspan><tspan x="440" dy="11">and conversations</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="758" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#f18a2b" stroke-width="1.7"/>
      <circle cx="783" cy="535" r="10" fill="#f18a2b"/>
      <path d="M778,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="802" y="538" font-size="13" font-weight="800" fill="#12233d">Control</text>
      <text x="778" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="778" dy="0">Permissions and review points keep</tspan><tspan x="778" dy="11">delegation bounded</tspan></text>
    </g>
<text x="600" y="616" text-anchor="middle" font-size="9.5" fill="#7b91a4">Continuity creates value when it is paired with clear authority and review.</text>
</g></svg>