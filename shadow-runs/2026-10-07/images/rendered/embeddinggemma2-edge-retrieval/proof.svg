  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">On-device retrieval removes the cloud round trip</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">EmbeddingGemma 2 moves multimodal embedding, indexing, and routing closer to where data is created.</text>

 <rect x="44" y="120" width="521" height="360" rx="24" fill="#f5f8fc" stroke="#9bb8da" stroke-width="1.5"/>
 <rect x="635" y="120" width="521" height="360" rx="24" fill="#f2fbf8" stroke="#8fd1ba" stroke-width="1.5"/>
 <g><rect x="67" y="138" width="180" height="28" rx="14" fill="#1477e6"/><text x="157" y="157" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">CLOUD-CENTRIC</text></g>
 <g><rect x="658" y="138" width="205" height="28" rx="14" fill="#14a673"/><text x="760.5" y="157" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">ON-DEVICE MULTIMODAL</text></g>
 <g><rect x="75" y="195" width="142" height="72" rx="15" fill="#fff" stroke="#1477e6" stroke-width="2" filter="url(#shadow)"/><rect x="75" y="195" width="9" height="72" rx="5" fill="#1477e6"/>
  <text x="97" y="221" font-size="12.8" font-weight="800" fill="#12233d">Local data</text>
  <text x="97" y="238" font-size="8.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="97" dy="0">Text, images, audio,</tspan><tspan x="97" dy="10.5">and video begin on</tspan><tspan x="97" dy="10.5">the device</tspan></text></g>
 <g><line x1="217" y1="231" x2="238" y2="231" stroke="#1477e6" stroke-width="3" stroke-linecap="round"/><polygon points="238,224 250,231 238,238" fill="#1477e6"/></g>
 <g><rect x="250" y="195" width="135" height="72" rx="15" fill="#fff" stroke="#f18a2b" stroke-width="2" filter="url(#shadow)"/><rect x="250" y="195" width="9" height="72" rx="5" fill="#f18a2b"/>
  <text x="272" y="221" font-size="12.8" font-weight="800" fill="#12233d">Network</text>
  <text x="272" y="238" font-size="8.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="272" dy="0">Upload plus</tspan><tspan x="272" dy="10.5">round-trip latency</tspan></text></g>
 <g><line x1="385" y1="231" x2="408" y2="231" stroke="#1477e6" stroke-width="3" stroke-linecap="round"/><polygon points="408,224 420,231 408,238" fill="#1477e6"/></g>
 <g><rect x="420" y="195" width="115" height="72" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2" filter="url(#shadow)"/><rect x="420" y="195" width="9" height="72" rx="5" fill="#7656d8"/>
  <text x="442" y="221" font-size="11.5" font-weight="800" fill="#12233d">Cloud embedding</text>
  <text x="442" y="238" font-size="8" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="442" dy="0">Remote model</tspan><tspan x="442" dy="10.5">creates semantic</tspan><tspan x="442" dy="10.5">representation</tspan></text></g>
 <g><line x1="478" y1="267" x2="478" y2="293" stroke="#1477e6" stroke-width="3" stroke-linecap="round"/><polygon points="471,293 478,305 485,293" fill="#1477e6"/></g>
 <g><rect x="350" y="310" width="185" height="75" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2" filter="url(#shadow)"/><rect x="350" y="310" width="9" height="75" rx="5" fill="#25b5e9"/>
  <text x="372" y="336" font-size="12.5" font-weight="800" fill="#12233d">Remote chain</text>
  <text x="372" y="353" font-size="8.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="372" dy="0">Multiple services add</tspan><tspan x="372" dy="10.5">network hops and processing</tspan><tspan x="372" dy="10.5">stages</tspan></text></g>
 <path d="M350 348 H305" fill="none" stroke="#1477e6" stroke-width="3"/><polygon points="317,341 305,348 317,355" fill="#1477e6"/>
 <g><rect x="80" y="310" width="225" height="75" rx="15" fill="#fff" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><rect x="80" y="310" width="9" height="75" rx="5" fill="#14a673"/>
  <text x="102" y="336" font-size="12.5" font-weight="800" fill="#12233d">Return result</text>
  <text x="102" y="353" font-size="8.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="102" dy="0">Response travels back across the</tspan><tspan x="102" dy="10.5">network to the device</tspan></text></g>
 <g><rect x="110" y="420" width="390" height="28" rx="14" fill="#16375b"/><text x="305" y="439" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">network + remote inference + hosted search</text></g>
 <text x="675" y="198" font-size="9.5" font-weight="800" fill="#14a673">INPUTS</text>
 <rect x="675" y="215" width="62" height="34" rx="9" fill="#fff" stroke="#1477e6" stroke-width="1.5"/><text x="706" y="237" text-anchor="middle" font-size="9" font-weight="800" fill="#1477e6">TXT</text><rect x="755" y="215" width="62" height="34" rx="9" fill="#fff" stroke="#14a673" stroke-width="1.5"/><text x="786" y="237" text-anchor="middle" font-size="9" font-weight="800" fill="#14a673">IMG</text><rect x="835" y="215" width="62" height="34" rx="9" fill="#fff" stroke="#7656d8" stroke-width="1.5"/><text x="866" y="237" text-anchor="middle" font-size="9" font-weight="800" fill="#7656d8">AUD</text><rect x="915" y="215" width="62" height="34" rx="9" fill="#fff" stroke="#f18a2b" stroke-width="1.5"/><text x="946" y="237" text-anchor="middle" font-size="9" font-weight="800" fill="#f18a2b">VID</text>
 <g><rect x="675" y="280" width="150" height="88" rx="15" fill="url(#dark)" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><rect x="675" y="280" width="9" height="88" rx="5" fill="#14a673"/>
  <text x="697" y="306" font-size="12.5" font-weight="800" fill="#fff">Unified embeddings</text>
  <text x="697" y="323" font-size="8.2" font-weight="400" fill="#c8d7e4" text-anchor="start"><tspan x="697" dy="0">One model represents</tspan><tspan x="697" dy="10.5">text, images, video,</tspan><tspan x="697" dy="10.5">and audio</tspan></text></g>
 <g><line x1="750" y1="249" x2="750" y2="268" stroke="#14a673" stroke-width="3" stroke-linecap="round"/><polygon points="743,268 750,280 757,268" fill="#14a673"/></g>
 <g><line x1="825" y1="324" x2="853" y2="324" stroke="#14a673" stroke-width="3" stroke-linecap="round"/><polygon points="853,317 865,324 853,331" fill="#14a673"/></g>
 <g><rect x="865" y="280" width="250" height="68" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2" filter="url(#shadow)"/><rect x="865" y="280" width="9" height="68" rx="5" fill="#7656d8"/>
  <text x="887" y="306" font-size="12.5" font-weight="800" fill="#12233d">Local index</text>
  <text x="887" y="323" font-size="8.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="887" dy="0">On-device vectors support semantic</tspan><tspan x="887" dy="10.5">similarity search</tspan></text></g>
 <g><line x1="990" y1="348" x2="990" y2="376" stroke="#14a673" stroke-width="3" stroke-linecap="round"/><polygon points="983,376 990,388 997,376" fill="#14a673"/></g>
 <g><rect x="865" y="388" width="250" height="68" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2" filter="url(#shadow)"/><rect x="865" y="388" width="9" height="68" rx="5" fill="#25b5e9"/>
  <text x="887" y="414" font-size="12.5" font-weight="800" fill="#12233d">Local routing</text>
  <text x="887" y="431" font-size="8.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="887" dy="0">Semantic labels can support fast local</tspan><tspan x="887" dy="10.5">decisions</tspan></text></g>
 <g><rect x="675" y="388" width="150" height="68" rx="15" fill="#fff" stroke="#df5e62" stroke-width="2" filter="url(#shadow)"/><rect x="675" y="388" width="9" height="68" rx="5" fill="#df5e62"/>
  <text x="697" y="414" font-size="12.2" font-weight="800" fill="#12233d">Modular memory</text>
  <text x="697" y="431" font-size="7.8" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="697" dy="0">Load only the</tspan><tspan x="697" dy="10.5">components needed for</tspan><tspan x="697" dy="10.5">the device workload</tspan></text></g>
 <g><rect x="535" y="212" width="130" height="28" rx="14" fill="#f18a2b"/><text x="600" y="231" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">REMOVES</text></g>
 <g><line x1="565" y1="260" x2="623" y2="260" stroke="#f18a2b" stroke-width="3" stroke-linecap="round"/><polygon points="623,253 635,260 623,267" fill="#f18a2b"/></g>
 <text x="600" y="286" text-anchor="middle" font-size="10" font-weight="800" fill="#f18a2b">round trip</text>
 
