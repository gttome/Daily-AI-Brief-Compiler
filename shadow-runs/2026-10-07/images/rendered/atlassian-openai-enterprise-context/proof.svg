<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#193b5d"/><stop offset="1" stop-color="#0b2037"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#334f6a" flood-opacity=".18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1477e6"/></marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14a673"/></marker>
  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">Enterprise agents need a permission-aware context stack</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">Identity, context, systems of record, actions, review, and evidence turn model reasoning into enterprise work.</text>

 <g><rect x="58" y="100" width="190" height="28" rx="14" fill="#16375b"/><text x="153" y="119" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">GOVERNANCE BOUNDARY</text></g>
 <g><rect x="936" y="100" width="200" height="28" rx="14" fill="#16375b"/><text x="1036" y="119" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">EVIDENCE / AUDIT TRAIL</text></g>
 <rect x="55" y="135" width="1090" height="340" rx="25" fill="#f3f7fb" stroke="#c4d2e1" stroke-width="1.5"/>
 <rect x="90" y="154" width="1020" height="43" rx="13" fill="#fff" stroke="#1477e6" stroke-width="2" filter="url(#shadow)"/><circle cx="118" cy="175.5" r="13" fill="#1477e6"/><text x="118" y="179" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">1</text><text x="145" y="173" font-size="12.8" font-weight="800" fill="#12233d">Model reasoning</text><text x="145" y="188" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="145" dy="0">General intelligence interprets the user&apos;s goal and plans work</tspan></text><rect x="110" y="205" width="980" height="43" rx="13" fill="#fff" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><circle cx="138" cy="226.5" r="13" fill="#14a673"/><text x="138" y="230" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">2</text><text x="165" y="224" font-size="12.8" font-weight="800" fill="#12233d">Identity + permissions</text><text x="165" y="239" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="165" dy="0">User identity and access policy establish legitimate boundaries</tspan></text><rect x="130" y="256" width="940" height="43" rx="13" fill="#fff" stroke="#7656d8" stroke-width="2" filter="url(#shadow)"/><circle cx="158" cy="277.5" r="13" fill="#7656d8"/><text x="158" y="281" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">3</text><text x="185" y="275" font-size="12.8" font-weight="800" fill="#12233d">Teamwork Graph</text><text x="185" y="290" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="185" dy="0">People, projects, decisions, and relationships add context</tspan></text><rect x="150" y="307" width="900" height="43" rx="13" fill="#fff" stroke="#f18a2b" stroke-width="2" filter="url(#shadow)"/><circle cx="178" cy="328.5" r="13" fill="#f18a2b"/><text x="178" y="332" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">4</text><text x="205" y="326" font-size="12.8" font-weight="800" fill="#12233d">Systems of record</text><text x="205" y="341" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="205" dy="0">Jira and Confluence provide current source evidence</tspan></text><rect x="170" y="358" width="860" height="43" rx="13" fill="#fff" stroke="#25b5e9" stroke-width="2" filter="url(#shadow)"/><circle cx="198" cy="379.5" r="13" fill="#25b5e9"/><text x="198" y="383" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">5</text><text x="225" y="377" font-size="12.8" font-weight="800" fill="#12233d">Workflow actions</text><text x="225" y="392" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="225" dy="0">Grounded context supports planning and coordinated work</tspan></text><rect x="190" y="409" width="820" height="43" rx="13" fill="#fff" stroke="#df5e62" stroke-width="2" filter="url(#shadow)"/><circle cx="218" cy="430.5" r="13" fill="#df5e62"/><text x="218" y="434" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">6</text><text x="245" y="428" font-size="12.8" font-weight="800" fill="#12233d">Human review</text><text x="245" y="443" font-size="8.7" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="245" dy="0">People inspect outputs before consequential changes</tspan></text>
 <line x1="1118" y1="160" x2="1118" y2="446" stroke="#70869c" stroke-width="3"/>
 <line x1="1098" y1="175" x2="1118" y2="175" stroke="#70869c" stroke-width="2"/><circle cx="1118" cy="175" r="4" fill="#70869c"/><line x1="1098" y1="226" x2="1118" y2="226" stroke="#70869c" stroke-width="2"/><circle cx="1118" cy="226" r="4" fill="#70869c"/><line x1="1098" y1="277" x2="1118" y2="277" stroke="#70869c" stroke-width="2"/><circle cx="1118" cy="277" r="4" fill="#70869c"/><line x1="1098" y1="328" x2="1118" y2="328" stroke="#70869c" stroke-width="2"/><circle cx="1118" cy="328" r="4" fill="#70869c"/><line x1="1098" y1="379" x2="1118" y2="379" stroke="#70869c" stroke-width="2"/><circle cx="1118" cy="379" r="4" fill="#70869c"/><line x1="1098" y1="430" x2="1118" y2="430" stroke="#70869c" stroke-width="2"/><circle cx="1118" cy="430" r="4" fill="#70869c"/>
 <g><line x1="600" y1="197" x2="600" y2="194" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><polygon points="593,194 600,206 607,194" fill="#16375b"/></g><g><line x1="600" y1="248" x2="600" y2="245" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><polygon points="593,245 600,257 607,245" fill="#16375b"/></g><g><line x1="600" y1="299" x2="600" y2="296" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><polygon points="593,296 600,308 607,296" fill="#16375b"/></g><g><line x1="600" y1="350" x2="600" y2="347" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><polygon points="593,347 600,359 607,347" fill="#16375b"/></g><g><line x1="600" y1="401" x2="600" y2="398" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><polygon points="593,398 600,410 607,398" fill="#16375b"/></g>
 
<g filter="url(#shadow)">
      <rect x="82" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#14a673" stroke-width="1.7"/>
      <circle cx="107" cy="535" r="10" fill="#14a673"/>
      <path d="M102,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="126" y="538" font-size="13" font-weight="800" fill="#12233d">Context</text>
      <text x="102" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="102" dy="0">Resolve the right project, owner,</tspan><tspan x="102" dy="11">decision, and source of truth.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="420" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#7656d8" stroke-width="1.7"/>
      <circle cx="445" cy="535" r="10" fill="#7656d8"/>
      <path d="M440,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="464" y="538" font-size="13" font-weight="800" fill="#12233d">Permissions</text>
      <text x="440" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="440" dy="0">Identity and access policy determine</tspan><tspan x="440" dy="11">legitimate context and actions.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="758" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#f18a2b" stroke-width="1.7"/>
      <circle cx="783" cy="535" r="10" fill="#f18a2b"/>
      <path d="M778,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="802" y="538" font-size="13" font-weight="800" fill="#12233d">Traceability</text>
      <text x="778" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="778" dy="0">Current systems of record and evidence</tspan><tspan x="778" dy="11">keep actions grounded.</tspan></text>
    </g>
<text x="600" y="616" text-anchor="middle" font-size="9.5" fill="#7b91a4">Enterprise context turns generic intelligence into accountable work.</text>
</g></svg>