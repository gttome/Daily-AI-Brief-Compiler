      <text x="778" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="778" dy="0">Infrastructure speed becomes</tspan><tspan x="778" dy="11">responsiveness and perceived quality.</tspan></text>
    </g>
<text x="600" y="616" text-anchor="middle" font-size="9.5" fill="#7b91a4">Users experience the accumulated wall time of the full agent loop.</text>
