  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">Inference speed compounds across every agent loop</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">Reasoning, generation, tools, observation, verification, and next-step choice repeat throughout one workflow.</text>

 <rect x="48" y="145" width="197" height="297" rx="20" fill="#fff" stroke="#c5d1de" stroke-width="1.5"/>
 <g><rect x="70" y="165" width="152" height="28" rx="14" fill="#16375b"/><text x="146" y="184" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">INFRASTRUCTURE</text></g>
 <text x="70" y="232" font-size="13" font-weight="800" fill="#12233d">Blackwell + inference</text><text x="70" y="249" font-size="13" font-weight="800" fill="#12233d">optimization</text>
 <rect x="72" y="292" width="135" height="13" rx="6" fill="#df5e62"/><rect x="72" y="324" width="105" height="13" rx="6" fill="#f18a2b"/><rect x="72" y="356" width="75" height="13" rx="6" fill="#14a673"/>
 <text x="70" y="397" font-size="9" font-weight="400" fill="#5b7186" text-anchor="start"><tspan x="70" dy="0">Up to 8x faster token</tspan><tspan x="70" dy="11">generation reported for</tspan><tspan x="70" dy="11">Astra Ultrafast vs…</tspan></text>
 <line x1="585" y1="135" x2="770" y2="205" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><line x1="770" y1="205" x2="805" y2="365" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><line x1="805" y1="365" x2="585" y2="455" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><line x1="585" y1="455" x2="365" y2="365" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><line x1="365" y1="365" x2="400" y2="205" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><line x1="400" y1="205" x2="585" y2="135" stroke="#16375b" stroke-width="3" stroke-linecap="round"/><g><rect x="502" y="98" width="166" height="74" rx="15" fill="#fff" stroke="#1477e6" stroke-width="2" filter="url(#shadow)"/><rect x="502" y="98" width="9" height="74" rx="5" fill="#1477e6"/>
  <text x="524" y="124" font-size="12.8" font-weight="800" fill="#12233d">Reason</text>
  <text x="524" y="141" font-size="8.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="524" dy="0">Choose the next step from</tspan><tspan x="524" dy="10.5">the goal and current</tspan><tspan x="524" dy="10.5">state</tspan></text></g><g><rect x="687" y="168" width="166" height="74" rx="15" fill="#fff" stroke="#14a673" stroke-width="2" filter="url(#shadow)"/><rect x="687" y="168" width="9" height="74" rx="5" fill="#14a673"/>
  <text x="709" y="194" font-size="12.8" font-weight="800" fill="#12233d">Generate</text>
  <text x="709" y="211" font-size="8.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="709" dy="0">Produce code,</tspan><tspan x="709" dy="10.5">instructions, or</tspan><tspan x="709" dy="10.5">structured output</tspan></text></g><g><rect x="722" y="328" width="166" height="74" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2" filter="url(#shadow)"/><rect x="722" y="328" width="9" height="74" rx="5" fill="#7656d8"/>
  <text x="744" y="354" font-size="12.8" font-weight="800" fill="#12233d">External step</text>
  <text x="744" y="371" font-size="8.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="744" dy="0">A connected system turns</tspan><tspan x="744" dy="10.5">the planned step into</tspan><tspan x="744" dy="10.5">observable work</tspan></text></g><g><rect x="502" y="418" width="166" height="74" rx="15" fill="#fff" stroke="#f18a2b" stroke-width="2" filter="url(#shadow)"/><rect x="502" y="418" width="9" height="74" rx="5" fill="#f18a2b"/>
  <text x="524" y="444" font-size="12.8" font-weight="800" fill="#12233d">Check result</text>
  <text x="524" y="461" font-size="8.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="524" dy="0">Read evidence and</tspan><tspan x="524" dy="10.5">determine whether the</tspan><tspan x="524" dy="10.5">step succeeded</tspan></text></g><g><rect x="282" y="328" width="166" height="74" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2" filter="url(#shadow)"/><rect x="282" y="328" width="9" height="74" rx="5" fill="#25b5e9"/>
  <text x="304" y="354" font-size="12.8" font-weight="800" fill="#12233d">Decide next</text>
  <text x="304" y="371" font-size="8.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="304" dy="0">Update the plan or close</tspan><tspan x="304" dy="10.5">the workflow</tspan></text></g><g><rect x="317" y="168" width="166" height="74" rx="15" fill="#fff" stroke="#df5e62" stroke-width="2" filter="url(#shadow)"/><rect x="317" y="168" width="9" height="74" rx="5" fill="#df5e62"/>
  <text x="339" y="194" font-size="12.8" font-weight="800" fill="#12233d">Optimize runtime</text>
  <text x="339" y="211" font-size="8.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="339" dy="0">Inference improvements</tspan><tspan x="339" dy="10.5">shorten future model</tspan><tspan x="339" dy="10.5">turns</tspan></text></g>
 <rect x="485" y="235" width="200" height="130" rx="65" fill="url(#dark)" stroke="#14a673" stroke-width="3" filter="url(#shadow)"/>
 <text x="585" y="270" text-anchor="middle" font-size="10" font-weight="800" fill="#8fe0cf">LOWER</text><text x="585" y="302" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">MODEL LATENCY</text><text x="585" y="330" text-anchor="middle" font-size="9.5" fill="#d7e4ef">repeats at every model turn</text>
 <g><line x1="245" y1="295" x2="318" y2="295" stroke="#14a673" stroke-width="3" stroke-linecap="round"/><polygon points="318,288 330,295 318,302" fill="#14a673"/></g>
 <rect x="925" y="145" width="227" height="297" rx="20" fill="#fff" stroke="#c5d1de" stroke-width="1.5"/>
 <g><rect x="950" y="165" width="178" height="28" rx="14" fill="#16375b"/><text x="1039" y="184" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">WORKFLOW EFFECT</text></g>
 <text x="950" y="232" font-size="12" font-weight="800" fill="#12233d">Every loop pays:</text>
 <rect x="950" y="260" width="175" height="28" rx="8" fill="#fff" stroke="#1477e6"/><text x="963" y="278" font-size="9" font-weight="700" fill="#1477e6">model delay</text><rect x="950" y="302" width="175" height="28" rx="8" fill="#fff" stroke="#7656d8"/><text x="963" y="320" font-size="9" font-weight="700" fill="#7656d8">tool delay</text><rect x="950" y="344" width="175" height="28" rx="8" fill="#fff" stroke="#f18a2b"/><text x="963" y="362" font-size="9" font-weight="700" fill="#f18a2b">check delay</text>
 <text x="950" y="399" font-size="9.2" font-weight="400" fill="#5b7186" text-anchor="start"><tspan x="950" dy="0">Total wall time = sum of</tspan><tspan x="950" dy="11">repeated passes</tspan></text>
 
