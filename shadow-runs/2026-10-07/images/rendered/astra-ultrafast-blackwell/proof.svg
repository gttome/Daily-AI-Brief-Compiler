    <rect x="512.5" y="408" width="10" height="74" rx="5" fill="#f18a2b"/>
    <text x="536.5" y="435" font-size="14.5" font-weight="800" fill="#fff">Check result</text>
    <text x="536.5" y="451" font-size="8.9" font-weight="400" fill="#c4d4e2" text-anchor="start"><tspan x="536.5" dy="0">Read evidence and</tspan><tspan x="536.5" dy="10">determine whether the step</tspan><tspan x="536.5" dy="10">succeeded</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="200.73085463760214" y="335.50000000000006" width="175" height="74" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2"/>
    <rect x="200.73085463760214" y="335.50000000000006" width="10" height="74" rx="5" fill="#25b5e9"/>
    <text x="224.73085463760214" y="362.50000000000006" font-size="14.5" font-weight="800" fill="#12233d">Decide next</text>
    <text x="224.73085463760214" y="378.50000000000006" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="224.73085463760214" dy="0">Update the plan or close</tspan><tspan x="224.73085463760214" dy="10">the workflow</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="200.73085463760208" y="190.5" width="175" height="74" rx="15" fill="#fff" stroke="#df5e62" stroke-width="2"/>
    <rect x="200.73085463760208" y="190.5" width="10" height="74" rx="5" fill="#df5e62"/>
    <text x="224.73085463760208" y="217.5" font-size="14.5" font-weight="800" fill="#12233d">Optimize runtime</text>
    <text x="224.73085463760208" y="233.5" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="224.73085463760208" dy="0">Inference improvements</tspan><tspan x="224.73085463760208" dy="10">shorten future model turns</tspan></text>
