<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">Why inference speed compounds across AI loops</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">Generation, external steps, checks, and next-step decisions repeat many times inside one workflow.</text>
