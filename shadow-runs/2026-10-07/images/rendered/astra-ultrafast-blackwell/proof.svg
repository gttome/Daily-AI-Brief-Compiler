    <text x="848.2691453623979" y="362.5" font-size="14.5" font-weight="800" fill="#12233d">External step</text>
    <text x="848.2691453623979" y="378.5" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="848.2691453623979" dy="0">A connected system turns</tspan><tspan x="848.2691453623979" dy="10">the planned step into</tspan><tspan x="848.2691453623979" dy="10">observable work</tspan></text>
  </g><g filter="url(#shadow)">
