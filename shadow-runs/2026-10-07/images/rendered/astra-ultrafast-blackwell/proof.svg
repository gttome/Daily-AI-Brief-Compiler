    <text x="848.2691453623979" y="217.5" font-size="14.5" font-weight="800" fill="#12233d">Generate</text>
    <text x="848.2691453623979" y="233.5" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="848.2691453623979" dy="0">Produce code,</tspan><tspan x="848.2691453623979" dy="10">instructions, or</tspan><tspan x="848.2691453623979" dy="10">structured output</tspan></text>
  </g><g filter="url(#shadow)">
