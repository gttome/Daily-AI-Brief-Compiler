<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#193b5d"/><stop offset="1" stop-color="#0b2037"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#334f6a" flood-opacity=".18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1477e6"/></marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14a673"/></marker>
  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">Hybrid intelligence needs containment below the agent</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">Local context, identity, routing, and isolation form the platform boundary for delegated work.</text>
<rect x="165" y="125" width="870" height="365" rx="32" fill="url(#panel)" stroke="#c9d8e7" stroke-width="2"/>
    <rect x="183" y="145" width="46" height="325" rx="22" fill="url(#dark)"/>
    <text x="206" y="310" text-anchor="middle" transform="rotate(-90 206 310)" font-size="12" font-weight="800" fill="#fff">Intent → context → policy → isolated action</text>
    <g filter="url(#shadow)">
      <rect x="250" y="153" width="700" height="49" rx="13" fill="#fff" stroke="#1477e6" stroke-width="2"/>
      <rect x="270" y="165" width="24" height="24" rx="6" fill="#1477e6"/>
      <text x="308" y="174" font-size="14" font-weight="800" fill="#12233d">User intent</text>
      <text x="308" y="190" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="308" dy="0">A delegated goal defines the requested outcome</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="262" y="205" width="676" height="49" rx="13" fill="#fff" stroke="#14a673" stroke-width="2"/>
      <rect x="282" y="217" width="24" height="24" rx="6" fill="#14a673"/>
      <text x="320" y="226" font-size="14" font-weight="800" fill="#12233d">Local context</text>
      <text x="320" y="242" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="320" dy="0">Relevant PC state is available only with permission</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="274" y="257" width="652" height="49" rx="13" fill="#fff" stroke="#7656d8" stroke-width="2"/>
      <rect x="294" y="269" width="24" height="24" rx="6" fill="#7656d8"/>
      <text x="332" y="278" font-size="14" font-weight="800" fill="#12233d">Identity + policy</text>
      <text x="332" y="294" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="332" dy="0">Access rules constrain data, tools, and destinations</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="286" y="309" width="628" height="49" rx="13" fill="#fff" stroke="#f18a2b" stroke-width="2"/>
      <rect x="306" y="321" width="24" height="24" rx="6" fill="#f18a2b"/>
      <text x="344" y="330" font-size="14" font-weight="800" fill="#12233d">Hybrid router</text>
      <text x="344" y="346" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="344" dy="0">Work is directed to local or cloud intelligence</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="298" y="361" width="604" height="49" rx="13" fill="#fff" stroke="#25b5e9" stroke-width="2"/>
      <rect x="318" y="373" width="24" height="24" rx="6" fill="#25b5e9"/>
      <text x="356" y="382" font-size="14" font-weight="800" fill="#12233d">Execution container</text>
      <text x="356" y="398" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="356" dy="0">File and network boundaries isolate agent activity</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="310" y="413" width="580" height="49" rx="13" fill="#fff" stroke="#df5e62" stroke-width="2"/>
      <rect x="330" y="425" width="24" height="24" rx="6" fill="#df5e62"/>
      <text x="368" y="434" font-size="14" font-weight="800" fill="#12233d">Bounded result</text>
      <text x="368" y="450" font-size="9.2" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="368" dy="0">Actions and outputs return through controlled surfaces</tspan></text>
    </g>
<g filter="url(#shadow)">
      <rect x="82" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#14a673" stroke-width="1.7"/>
      <circle cx="107" cy="535" r="10" fill="#14a673"/>
      <path d="M102,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="126" y="538" font-size="13" font-weight="800" fill="#12233d">Containment</text>
      <text x="102" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="102" dy="0">Execution Containers enforce runtime file</tspan><tspan x="102" dy="11">and network boundaries.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="420" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#7656d8" stroke-width="1.7"/>
      <circle cx="445" cy="535" r="10" fill="#7656d8"/>
      <path d="M440,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="464" y="538" font-size="13" font-weight="800" fill="#12233d">Hybrid routing</text>
      <text x="440" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="440" dy="0">Work can stay local or use cloud capacity</tspan><tspan x="440" dy="11">according to policy.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="758" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#f18a2b" stroke-width="1.7"/>
      <circle cx="783" cy="535" r="10" fill="#f18a2b"/>
      <path d="M778,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="802" y="538" font-size="13" font-weight="800" fill="#12233d">Rollout caveat</text>
      <text x="778" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="778" dy="0">Broader Copilot local-context actions are</tspan><tspan x="778" dy="11">expanding over time.</tspan></text>
    </g>
<text x="600" y="616" text-anchor="middle" font-size="9.5" fill="#7b91a4">Useful desktop agency needs context access and execution boundaries to advance together.</text>
</g></svg>