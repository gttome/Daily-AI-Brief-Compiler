<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#193b5d"/><stop offset="1" stop-color="#0b2037"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#334f6a" flood-opacity=".18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1477e6"/></marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14a673"/></marker>
  </defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="600" cy="300" r="250" fill="#1477e6" opacity=".035"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600" y="44" text-anchor="middle" font-size="27" font-weight="800" fill="#12233d">Long-horizon research stays bounded by an acceptance gate</text>
<text x="600" y="70" text-anchor="middle" font-size="12.5" fill="#587089">Agents can explore longer, but environment, evidence, evaluation, and human acceptance stay explicit.</text>
<path d="M280 220 C325 220,305 220,350 220" fill="none" stroke="#1477e6" stroke-width="4" marker-end="url(#arrow)"/><path d="M565 220 C610 220,590 220,635 220" fill="none" stroke="#14a673" stroke-width="4" marker-end="url(#arrow)"/><path d="M850 220 C895 220,875 220,920 220" fill="none" stroke="#7656d8" stroke-width="4" marker-end="url(#arrow)"/><path d="M1135 220 C1180 220,590 375,635 375" fill="none" stroke="#f18a2b" stroke-width="4" marker-end="url(#arrow)"/><path d="M850 375 C895 375,305 375,350 375" fill="none" stroke="#25b5e9" stroke-width="4" marker-end="url(#arrow)"/><path d="M350 375 C220 450,150 325,172 275" fill="none" stroke="#7656d8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow2)"/><g><g filter="url(#shadow)">
    <rect x="65" y="175" width="215" height="90" rx="15" fill="#fff" stroke="#1477e6" stroke-width="2"/>
    <rect x="65" y="175" width="10" height="90" rx="5" fill="#1477e6"/>
    <text x="89" y="202" font-size="14.5" font-weight="800" fill="#12233d">Research question</text>
    <text x="89" y="218" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="89" dy="0">A meaningful problem starts the</tspan><tspan x="89" dy="10">investigation</tspan></text>
  </g>
    <circle cx="255" cy="193" r="14" fill="#1477e6"/>
    <text x="255" y="198" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">1</text>
  </g><g><g filter="url(#shadow)">
    <rect x="350" y="175" width="215" height="90" rx="15" fill="#fff" stroke="#14a673" stroke-width="2"/>
    <rect x="350" y="175" width="10" height="90" rx="5" fill="#14a673"/>
    <text x="374" y="202" font-size="14.5" font-weight="800" fill="#12233d">Bounded environment</text>
    <text x="374" y="218" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="374" dy="0">Tools, data, and operating</tspan><tspan x="374" dy="10">constraints define the workspace</tspan></text>
  </g>
    <circle cx="540" cy="193" r="14" fill="#14a673"/>
    <text x="540" y="198" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">2</text>
  </g><g><g filter="url(#shadow)">
    <rect x="635" y="175" width="215" height="90" rx="15" fill="#fff" stroke="#7656d8" stroke-width="2"/>
    <rect x="635" y="175" width="10" height="90" rx="5" fill="#7656d8"/>
    <text x="659" y="202" font-size="14.5" font-weight="800" fill="#12233d">Agent exploration</text>
    <text x="659" y="218" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="659" dy="0">Long-running work tests paths</tspan><tspan x="659" dy="10">and can be redirected</tspan></text>
  </g>
    <circle cx="825" cy="193" r="14" fill="#7656d8"/>
    <text x="825" y="198" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">3</text>
  </g><g><g filter="url(#shadow)">
    <rect x="920" y="175" width="215" height="90" rx="15" fill="#fff" stroke="#f18a2b" stroke-width="2"/>
    <rect x="920" y="175" width="10" height="90" rx="5" fill="#f18a2b"/>
    <text x="944" y="202" font-size="14.5" font-weight="800" fill="#12233d">Evidence review</text>
    <text x="944" y="218" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="944" dy="0">Quality and significance are</tspan><tspan x="944" dy="10">checked before human acceptance</tspan></text>
  </g>
    <circle cx="1110" cy="193" r="14" fill="#f18a2b"/>
    <text x="1110" y="198" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">4</text>
  </g><g><g filter="url(#shadow)">
    <rect x="635" y="330" width="215" height="90" rx="15" fill="#fff" stroke="#25b5e9" stroke-width="2"/>
    <rect x="635" y="330" width="10" height="90" rx="5" fill="#25b5e9"/>
    <text x="659" y="357" font-size="14.5" font-weight="800" fill="#12233d">Human acceptance</text>
    <text x="659" y="373" font-size="8.9" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="659" dy="0">A responsible reviewer decides</tspan><tspan x="659" dy="10">whether evidence is sufficient</tspan></text>
  </g>
    <circle cx="825" cy="348" r="14" fill="#25b5e9"/>
    <text x="825" y="353" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">5</text>
  </g><g><g filter="url(#shadow)">
    <rect x="350" y="330" width="215" height="90" rx="15" fill="url(#dark)" stroke="#df5e62" stroke-width="2"/>
    <rect x="350" y="330" width="10" height="90" rx="5" fill="#df5e62"/>
    <text x="374" y="357" font-size="14.5" font-weight="800" fill="#fff">Controlled use</text>
    <text x="374" y="373" font-size="8.9" font-weight="400" fill="#c4d4e2" text-anchor="start"><tspan x="374" dy="0">Accepted findings inform work</tspan><tspan x="374" dy="10">without becoming unquestioned</tspan><tspan x="374" dy="10">fact</tspan></text>
  </g>
    <circle cx="540" cy="348" r="14" fill="#df5e62"/>
    <text x="540" y="353" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">6</text>
  </g>
    <rect x="465" y="440" width="270" height="32" rx="16" fill="#16375b"/>
    <text x="600" y="461" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff">Evaluate → accept → use or redirect</text>
<g filter="url(#shadow)">
      <rect x="82" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#14a673" stroke-width="1.7"/>
      <circle cx="107" cy="535" r="10" fill="#14a673"/>
      <path d="M102,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="126" y="538" font-size="13" font-weight="800" fill="#12233d">Steerability</text>
      <text x="102" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="102" dy="0">The research path can be redirected when</tspan><tspan x="102" dy="11">evidence is weak.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="420" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#7656d8" stroke-width="1.7"/>
      <circle cx="445" cy="535" r="10" fill="#7656d8"/>
      <path d="M440,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="464" y="538" font-size="13" font-weight="800" fill="#12233d">Evaluation</text>
      <text x="440" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="440" dy="0">Quality criteria are defined before</tspan><tspan x="440" dy="11">plausible output is trusted.</tspan></text>
    </g><g filter="url(#shadow)">
      <rect x="758" y="510" width="300" height="74" rx="17" fill="#fff" stroke="#f18a2b" stroke-width="1.7"/>
      <circle cx="783" cy="535" r="10" fill="#f18a2b"/>
      <path d="M778,535 l4,4 l8,-10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="802" y="538" font-size="13" font-weight="800" fill="#12233d">Acceptance</text>
      <text x="778" y="557" font-size="9.3" font-weight="400" fill="#526b80" text-anchor="start"><tspan x="778" dy="0">Human judgment remains the final boundary</tspan><tspan x="778" dy="11">for consequential use.</tspan></text>
    </g>
<text x="600" y="616" text-anchor="middle" font-size="9.5" fill="#7b91a4">Autonomy scales research effort; evaluation and human acceptance preserve responsibility.</text>
</g></svg>